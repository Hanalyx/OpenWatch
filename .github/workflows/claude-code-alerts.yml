name: Claude Code Alert Triage

on:
  # Triggered when Dependabot creates/updates a PR. Other pull requests
  # trigger it too and skip every job.
  pull_request:
    types: [opened, synchronize]

  # Manual trigger
  workflow_dispatch:
    inputs:
      alert_id:
        description: 'Alert ID to process'
        required: true
      alert_type:
        description: 'Alert type (dependabot or codeql)'
        required: true
        default: 'codeql'

# No job inherits write access. Each job names what it needs (bugs/OW-126).
permissions: {}

# Untrusted text (pull request titles, dispatch inputs, alert descriptions)
# reaches a run script only through env and is used quoted. A ${{ }}
# expression inside run: is substituted before bash parses the script, so it
# can change the script itself (bugs/OW-126).
jobs:
  risk-assessment:
    name: Assess Risk Level
    # Only a Dependabot pull request or a manual dispatch has an alert to
    # assess. Every other event skips the job, and with it every job that
    # needs it, before any shell step runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor == 'dependabot[bot]' &&
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    outputs:
      risk_level: ${{ steps.assess.outputs.risk_level }}
      alert_id: ${{ steps.assess.outputs.alert_id }}
      description: ${{ steps.assess.outputs.description }}
      can_auto_fix: ${{ steps.assess.outputs.can_auto_fix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch Alert
        id: fetch
        run: |
          mkdir -p /tmp/alerts

          # The step ends in exactly one of three ways: one validated
          # alert in alert.json with its type in type; a reason in none,
          # when there is nothing to assess; or a non-zero exit, when the
          # alert could not be read. Nothing is made up in between. An
          # alert that could not be read must never be assessed as if it
          # were a mild one (bugs/OW-126).
          no_alert() {
            printf '%s\n' "$1" > /tmp/alerts/none
            echo "No alert to assess: $1"
          }

          if [ "$EVENT_NAME" == "pull_request" ]; then
            # Dependabot PR
            echo "Fetching Dependabot alert for PR #$PR_NUMBER"
            # Dependabot titles read "... bump <package> from <old> to
            # <new> ...". A grouped update names no single package. jq
            # receives the name with --arg, so it stays data in the
            # filter too.
            PACKAGE=$(printf '%s\n' "$PR_TITLE" | grep -m 1 -oiP '(?<=\bbump )\S+(?= from )' || true)
            PACKAGE=${PACKAGE%%$'\n'*}
            if [ -z "$PACKAGE" ]; then
              no_alert "the pull request title names no single package"
              exit 0
            fi

            if ! gh api --paginate "/repos/$REPOSITORY/dependabot/alerts?state=open&per_page=100" \
              > /tmp/alerts/pages.json; then
              echo "Error: could not list Dependabot alerts"
              exit 1
            fi
            if ! jq -s --arg pkg "$PACKAGE" '
                if length > 0 and all(.[]; type == "array")
                then [.[][] | select(.state == "open" and .dependency.package.name == $pkg)]
                else error("the alert listing is not a list of alerts") end' \
              /tmp/alerts/pages.json > /tmp/alerts/matches.json; then
              echo "Error: could not read the Dependabot alert listing"
              exit 1
            fi

            COUNT=$(jq 'length' /tmp/alerts/matches.json)
            if [ "$COUNT" -eq 0 ]; then
              no_alert "no open Dependabot alert for this package"
              exit 0
            fi
            if [ "$COUNT" -ne 1 ]; then
              echo "Error: $COUNT open alerts match this package; assess them by hand"
              exit 1
            fi
            jq '.[0]' /tmp/alerts/matches.json > /tmp/alerts/alert.json
            echo dependabot > /tmp/alerts/type

          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            # Manual trigger
            if ! [[ "$INPUT_ALERT_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Error: alert_id must be a number"
              exit 1
            fi

            case "$INPUT_ALERT_TYPE" in
              codeql)
                ENDPOINT="code-scanning/alerts/$INPUT_ALERT_ID"
                ;;
              dependabot)
                ENDPOINT="dependabot/alerts/$INPUT_ALERT_ID"
                ;;
              *)
                echo "Error: alert_type must be codeql or dependabot"
                exit 1
                ;;
            esac
            if ! gh api "/repos/$REPOSITORY/$ENDPOINT" > /tmp/alerts/alert.json; then
              echo "Error: could not fetch alert $INPUT_ALERT_ID"
              exit 1
            fi
            if ! jq -e --argjson id "$INPUT_ALERT_ID" 'type == "object" and .number == $id' \
              /tmp/alerts/alert.json > /dev/null; then
              echo "Error: the response is not alert $INPUT_ALERT_ID"
              exit 1
            fi
            echo "$INPUT_ALERT_TYPE" > /tmp/alerts/type

          else
            echo "Error: unsupported event $EVENT_NAME"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_ALERT_ID: ${{ github.event.inputs.alert_id }}
          INPUT_ALERT_TYPE: ${{ github.event.inputs.alert_type }}

      - name: Assess Risk
        id: assess
        run: |
          if [ -e /tmp/alerts/none ]; then
            # Nothing to assess. NONE matches no job, so nothing acts.
            RISK_LEVEL="NONE"
            ALERT_ID="unknown"
            DESCRIPTION="No alert to assess: $(cat /tmp/alerts/none)"
          else
            ALERT_TYPE=$(cat /tmp/alerts/type)
            echo "Alert type: $ALERT_TYPE"

            # The assessor fills a missing field with its mildest value
            # (severity "low", rule severity "note"), so an incomplete
            # alert would be scored LOW. Only a complete, open alert is
            # assessed (bugs/OW-126).
            case "$ALERT_TYPE" in
              dependabot)
                VALID='(.dependency.package.name | type == "string" and length > 0)
                  and (.security_vulnerability.severity | IN("low", "moderate", "high", "critical"))'
                ;;
              codeql)
                VALID='(.rule.id | type == "string" and length > 0)
                  and (.rule.severity | IN("note", "warning", "error"))'
                ;;
              *)
                echo "Error: unknown alert type"
                exit 1
                ;;
            esac
            if ! jq -e 'type == "object"
                and (.number | type == "number" and . >= 1 and . == floor)
                and .state == "open"
                and '"$VALID" /tmp/alerts/alert.json > /dev/null; then
              echo "Error: the alert is incomplete or not open; it is not assessed"
              exit 1
            fi

            # Run risk assessment
            python scripts/risk_assessment.py \
              --type="$ALERT_TYPE" \
              --output=/tmp/alerts \
              /tmp/alerts/alert.json

            # One alert went in, so exactly one comes out, in one file.
            LOW=$(jq 'length' /tmp/alerts/low_risk_alerts.json)
            MEDIUM=$(jq 'length' /tmp/alerts/medium_risk_alerts.json)
            HIGH=$(jq 'length' /tmp/alerts/high_risk_alerts.json)
            if [ $((LOW + MEDIUM + HIGH)) -ne 1 ]; then
              echo "Error: the assessment did not classify exactly one alert"
              exit 1
            fi
            if [ "$LOW" -eq 1 ]; then
              RISK_LEVEL="LOW"
            elif [ "$MEDIUM" -eq 1 ]; then
              RISK_LEVEL="MEDIUM"
            else
              RISK_LEVEL="HIGH"
            fi

            ALERT_ID=$(jq -r '.number' /tmp/alerts/alert.json)
            DESCRIPTION=$(jq -r '.rule.description // .security_advisory.summary // "Unknown issue"' /tmp/alerts/alert.json)
          fi
          # The description is alert text. Folding it to one line keeps a
          # newline in it from writing another output, such as risk_level.
          DESCRIPTION=$(printf '%s' "$DESCRIPTION" | tr '\r\n' '  ')
          CAN_AUTO_FIX="false"
          if [ "$RISK_LEVEL" == "LOW" ]; then
            CAN_AUTO_FIX="true"
          fi

          {
            printf 'risk_level=%s\n' "$RISK_LEVEL"
            printf 'alert_id=%s\n' "$ALERT_ID"
            printf 'description=%s\n' "$DESCRIPTION"
            printf 'can_auto_fix=%s\n' "$CAN_AUTO_FIX"
          } >> "$GITHUB_OUTPUT"

          echo "Risk Assessment Complete:"
          echo "  Alert ID: $ALERT_ID"
          echo "  Risk Level: $RISK_LEVEL"
          echo "  Can Auto-Fix: $CAN_AUTO_FIX"

      - name: Upload Alert Data
        uses: actions/upload-artifact@v6
        with:
          name: alert-data
          path: /tmp/alerts/

  auto-fix-low-risk:
    name: Auto-Fix (Low Risk)
    needs: risk-assessment
    if: >-
      needs.risk-assessment.outputs.risk_level == 'LOW' &&
      needs.risk-assessment.outputs.can_auto_fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-Approve Dependabot PR
        if: github.actor == 'dependabot[bot]'
        run: |
          # Approve only an assessed alert. Every path without one sets
          # alert_id to "unknown" (bugs/OW-126).
          if ! [[ "$ALERT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Error: no assessed alert; not approving"
            exit 1
          fi
          echo "Auto-approving LOW risk Dependabot PR"
          gh pr review "$PR_NUMBER" \
            --approve \
            --body "**Auto-approved by Risk Assessment**

          **Risk Level:** LOW
          **Alert ID:** #$ALERT_ID

          This is a low-risk dependency update that passed all risk assessment checks:
          - Patch/minor version update
          - Low/moderate severity
          - Non-critical package
          - Backward compatible

          Enabling auto-merge."

          # Enable auto-merge
          gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALERT_ID: ${{ needs.risk-assessment.outputs.alert_id }}

  claude-code-fix:
    name: Claude Code Fix (Medium Risk)
    needs: risk-assessment
    if: needs.risk-assessment.outputs.risk_level == 'MEDIUM'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better context

      - name: Create Claude Task
        run: |
          cat > /tmp/claude_task.md <<EOF
          # Fix Security/Quality Alert

          **Alert ID:** #$ALERT_ID
          **Description:** $DESCRIPTION
          **Risk Level:** MEDIUM (requires review)

          ## Your Task

          1. **Analyze the Issue**
             - Read the affected file(s)
             - Understand the vulnerability or quality issue
             - Review similar patterns in the codebase

          2. **Implement the Fix**
             - Follow coding standards in CLAUDE.md
             - Make minimal, focused changes
             - Ensure backward compatibility

          3. **Test the Fix**
             - Run relevant unit tests
             - Run linters and type checkers
             - Verify no regressions

          4. **Create Pull Request**
             - Commit with message: "fix: Resolve alert #$ALERT_ID - <description>"
             - Create PR with detailed description
             - Include test results
             - Request review from repository owner

          ## Important Notes
          - This is MEDIUM risk - human review is REQUIRED
          - Include "Fixes #$ALERT_ID" in PR description
          - Run quality checks before committing
          - If tests fail, document why in the PR

          ## Success Criteria
          - [ ] Issue is fixed
          - [ ] Tests pass
          - [ ] Code follows standards
          - [ ] PR created with review request
          EOF

          echo "Claude task created"
          cat /tmp/claude_task.md
        env:
          ALERT_ID: ${{ needs.risk-assessment.outputs.alert_id }}
          DESCRIPTION: ${{ needs.risk-assessment.outputs.description }}

      - name: Run Claude Code (Headless)
        run: |
          echo "Running Claude Code in headless mode..."

          # Note: This requires Claude Code CLI to be installed
          # For now, we'll use the GitHub Action instead
          # Install instructions: https://docs.claude.com/docs/claude-code/headless

          echo "Claude Code headless execution placeholder"
          echo "To enable: Install Claude Code CLI and uncomment the command below"

          # claude -p "$(cat /tmp/claude_task.md)" \
          #   --output-format json \
          #   --allowedTools "Bash,Read,Edit,Write,Grep,Glob" \
          #   --permission-mode acceptEdits \
          #   > /tmp/claude_output.json

          # For now, create a manual review issue
          echo '{"status": "manual_review_needed"}' > /tmp/claude_output.json

      - name: Fallback - Create Manual Review Issue
        run: |
          gh issue create \
            --title "MEDIUM RISK: Fix Alert #$ALERT_ID" \
            --label "security" \
            --label "medium-risk" \
            --label "claude-review" \
            --assignee "$REPOSITORY_OWNER" \
            --body "## Medium Risk Alert - Claude Code Assistance Available

          **Alert ID:** #$ALERT_ID
          **Description:** $DESCRIPTION
          **Risk Level:** MEDIUM

          This alert requires human review but can be assisted by Claude Code.

          ## How to Use Claude Code

          **Option 1: Comment on this issue**
          \`\`\`
          @claude analyze this alert and create a fix PR
          \`\`\`

          **Option 2: Local Claude Code**
          \`\`\`bash
          claude -p \"Fix alert #$ALERT_ID: $DESCRIPTION\"
          \`\`\`

          ## Task Details
          $(cat /tmp/claude_task.md)

          ---
          *This issue was automatically created by the Automated Triage System*
          *To enable automatic Claude Code fixes, install the Claude Code CLI in the workflow*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ALERT_ID: ${{ needs.risk-assessment.outputs.alert_id }}
          DESCRIPTION: ${{ needs.risk-assessment.outputs.description }}

  human-review-required:
    name: Human Review (High Risk)
    needs: risk-assessment
    if: needs.risk-assessment.outputs.risk_level == 'HIGH'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create High-Priority Issue
        run: |
          gh issue create \
            --title "HIGH RISK: Alert #$ALERT_ID" \
            --label "security" \
            --label "high-risk" \
            --label "urgent" \
            --assignee "$REPOSITORY_OWNER" \
            --body "## High Risk Security Alert

          **Alert ID:** #$ALERT_ID
          **Description:** $DESCRIPTION
          **Risk Level:** HIGH

          This alert has been classified as HIGH risk due to:
          - High complexity fix required, OR
          - Critical security vulnerability, OR
          - Potential for service disruption

          ## DO NOT USE AUTO-FIX

          This requires careful human assessment and planning.

          ## Action Required

          1. **Assess Impact**
             - Review the vulnerability details
             - Determine affected systems
             - Estimate blast radius

          2. **Plan Remediation**
             - Research fix options
             - Plan testing strategy
             - Schedule deployment window

          3. **Implement Carefully**
             - Create feature branch
             - Implement fix with thorough testing
             - Request security review
             - Deploy to staging first

          4. **You May Use Claude Code for Assistance**
             - Comment: \`@claude help me analyze this high-risk issue\`
             - But ALWAYS review Claude's suggestions carefully
             - Never auto-merge high-risk fixes

          ## Resources

          - [Security Response Playbook](../docs/SECURITY.md)
          - [High Risk Change Checklist](../docs/HIGH_RISK_CHANGES.md)

          ---
          *This issue was automatically created by the Automated Triage System*
          *Human review and approval is REQUIRED*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ALERT_ID: ${{ needs.risk-assessment.outputs.alert_id }}
          DESCRIPTION: ${{ needs.risk-assessment.outputs.description }}
