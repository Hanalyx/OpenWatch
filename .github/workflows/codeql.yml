name: CodeQL Security Analysis

# Pull requests are scanned before they merge, and main is scanned daily
# instead of on every push. A release tag is scanned too: release gate Q2
# (release/gates.toml) requires a passing "Analyze Code (javascript)" check run
# on the tagged commit, and that commit no longer gets a push-to-main scan.
# Spec release-ci-gates C-17.
on:
  pull_request:
    branches: [ main, develop ]
  push:
    tags: [ 'v*' ]
  schedule:
    - cron: '30 1 * * *'  # Daily at 01:30 UTC, on the default branch
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]  # python removed: Python tree archived to OWAR. TS/JS covers frontend/.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Prototype mockups are not shipped code; their inline JS produces
          # noise alerts (unused vars, demo origin checks). Exclude them so
          # CodeQL only scans the real frontend/ + scripts.
          config: |
            paths-ignore:
              - docs/engineering/prototypes

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
