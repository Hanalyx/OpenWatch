name: CodeQL Security Analysis

# Pull requests are scanned before they merge, and main is scanned daily
# instead of on every push. A release tag is scanned too: release gate Q2
# (release/gates.toml) requires a passing "Analyze Code (javascript)" check run
# on the tagged commit, and that commit no longer gets a push-to-main scan.
# Spec release-ci-gates C-17.
on:
  pull_request:
    branches: [ main, develop ]
  push:
    tags: [ 'v*' ]
  schedule:
    - cron: '30 7 * * *'  # Daily at 07:30 UTC (02:30 EST, 03:30 EDT), on the default branch
  workflow_dispatch:

# One run per pull request: a new push cancels the run for the older head
# (CI assessment 2026-10-03, recommendation 4). Every other event (a push to
# main, a tag, a schedule, a manual run) gets a group of its own, so none is
# ever canceled or replaced. A group shared with cancel-in-progress false
# would still replace a pending run, which would drop main or tag evidence.
# release-ci-gates C-23.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]  # python removed: Python tree archived to OWAR. TS/JS covers frontend/.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Prototype mockups are not shipped code; their inline JS produces
          # noise alerts (unused vars, demo origin checks). Exclude them so
          # CodeQL only scans the real frontend/ + scripts.
          config: |
            paths-ignore:
              - docs/engineering/prototypes

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
