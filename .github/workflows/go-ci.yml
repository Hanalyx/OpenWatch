# Pre-merge gates for OpenWatch (repo root).
#
# Runs: make vet, make lint (staticcheck + gosec + ...), make vuln
# (govulncheck), the `go test -race -json` run (data races + full
# integration suite against a Postgres service container, AND the JSON
# specter ingests; every package once, in two invocations so that
# internal/server runs alone, CP bugs/OW-066), and `specter sync` (spec
# validation + strict AC coverage).
#
# Job layout (release-ci-gates C-16). The two test invocations run in two
# jobs at the same time, each with its own PostgreSQL service, so the gate
# takes about as long as the slower one instead of their sum:
#
#   changes        detects Go-relevant paths once; the others read its output
#   checks         everything except internal/server: tidy, generated code,
#                  vet, lint, vuln, the Specter gate, the race tests of every
#                  other package, vitest
#   server-tests   internal/server alone under -race, with its own budget
#   docs-tests     the documentation path (C-18): packaging/tests alone,
#                  without native builds, for a change that touches no code,
#                  spec, tooling or CI path. Targeted validation, not full
#                  coverage.
#   full-evidence  "Full test evidence": the release gates' evidence (C-19).
#                  Runs only on the full path and succeeds only if every
#                  full-path job did. Skipped on the documentation path.
#   gates          "Quality + security gates", the only required check. It
#                  needs all four, always runs, and fails unless each needed
#                  job ended the way the change requires. It also runs every
#                  scripts/test_*.py; specter ingest and sync over both test
#                  streams on the full path; and, on the documentation path,
#                  a check of that job's results and a partial ingest that
#                  rejects failed criteria without claiming coverage.
#
# The required check must stay meaningful. GitHub treats a job skipped
# because a dependency failed as passing a required check, so the gates job
# runs under `if: always()` and reads every needed job's result itself rather
# than relying on `needs:` to stop it.
#
# Spec: specs/release/ci-gates.spec.yaml.

name: Go CI

# Triggers on every push/PR to main. The changes job selects the full
# pipeline or the documentation path, and the gates job reports "Quality +
# security gates" on every change either way. This avoids the "missing
# required check" bootstrap problem described in .github/BRANCH_MANAGEMENT.md
# under Troubleshooting.
on:
  push:
    branches: [main]
    # A release tag runs the full pipeline on the exact commit it names, so
    # the release gates read full test evidence from that commit even when
    # its own change was documentation-only (release-ci-gates C-19).
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Go-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.paths.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Selects one of two paths for this change (release-ci-gates C-18):
      #
      #   go=true   the full pipeline: every test, full Specter ingest and the
      #             coverage thresholds. Any change to code, specs, tooling or
      #             CI, and any mixed change.
      #   go=false  the documentation path: targeted validation by the tests
      #             that read documents (packaging/tests, the Python checks).
      #             Only a change that touches nothing in the pattern below.
      #
      # It fails closed. An unknown event, an unusable base, a failed diff,
      # an empty change list or a failed match selects the full pipeline, so
      # an error can never produce a passing skip. --no-renames lists both
      # sides of a rename and every deleted path, so moving a code file into
      # docs/ still selects the full pipeline.
      #
      # The two pin files govern gates this job validates through
      # packaging/tests. A pin-only change used to match nothing here, skip
      # the Go suite, and report green having checked nothing: PR #839 merged
      # that way and left main red on AC-11. Keep them in this pattern;
      # release-ci-gates AC-16 reads it from this file and fails if either is
      # removed.
      #
      # The match reads a here-string, not a pipe: under -o pipefail a writer
      # killed by SIGPIPE after `grep -q` exits early would turn a match into
      # a failure.
      - id: paths
        name: Detect Go-relevant changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          full() {
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Full pipeline: $1"
            exit 0
          }
          # A release tag always takes the full pipeline (C-19). The empty
          # push base below would select it too; this states it.
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            full "release tag '$REF_NAME'"
          fi
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD"; range="$PR_BASE...$PR_HEAD" ;;
            push)         base="$PUSH_BEFORE"; head="$PUSH_AFTER"; range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *)            full "event '$EVENT' has no change range" ;;
          esac
          if [ -z "$base" ] || [ -z "$head" ] || [ -z "${base//0/}" ]; then
            full "no usable base for '$range'"
          fi
          if ! changed=$(git diff --name-only --no-renames "$range"); then
            full "git diff failed for '$range'"
          fi
          if [ -z "$changed" ]; then
            full "no changed paths listed for '$range'"
          fi
          echo "Changed paths:"
          printf '  %s\n' $changed
          if grep -qE '^(cmd/|internal/|api/|frontend/|specs/|configs/|audit/|auth/|license/|packaging/|scripts/|release/|go\.mod|go\.sum|Makefile|specter\.yaml|sqlc\.yaml|\.golangci\.yml|\.specter-version$|\.doc-style-version$|THIRD-PARTY-NOTICES\.md$|\.github/(workflows|scripts|actions)/)' <<<"$changed"; then
            full "a code, spec, tooling or CI path changed"
          else
            rc=$?
          fi
          if [ "$rc" -ne 1 ]; then
            full "the path match failed (grep exit $rc)"
          fi
          echo "go=false" >> "$GITHUB_OUTPUT"
          echo "Documentation path: targeted validation by the tests that read documents."

  checks:
    name: Vet, lint, vuln, Specter gate and race tests (all but internal/server)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Explicit budget (CP bugs/OW-066), not the 360-minute platform default:
    # the race tests can run to their 900 s per-package ceiling, and the rest
    # of the job (build, vet, lint, vuln, specter gate, vitest, upload) has
    # measured at 5 to 8 minutes. 45 minutes covers both with margin and
    # still fails a job that has wedged.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openwatch
          POSTGRES_PASSWORD: openwatch_ci
          POSTGRES_DB: openwatch_go_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        shell: bash

    env:
      OPENWATCH_TEST_DSN: postgres://openwatch:openwatch_ci@127.0.0.1:5432/openwatch_go_test?sslmode=disable
      # Spec system-supply-chain C-03 / AC-05: pin every go command in
      # this workflow to read-only module resolution so a typo in
      # go.mod or an out-of-band fetch attempt fails the build instead
      # of silently mutating the lockfile.
      GOFLAGS: -mod=readonly
      # Test-DB isolation guard: CI's openwatch_go_test name already
      # ends in _test so the runtime guard accepts it without bypass.
      OPENWATCH_TEST_DSN_ALLOW_NONTEST: "no"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum

      # Cache the from-source golangci-lint binary so we don't rebuild it
      # (~1-3 min) on every run. Keyed on the lint version + Go toolchain:
      # the binary MUST match the runner's Go (the prebuilt v1.64.8 was
      # built with Go 1.24 and refuses Go 1.25+ configs), so a toolchain
      # bump invalidates the cache and triggers a fresh build.
      - name: Cache golangci-lint binary
        id: cache-golangci-bin
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-bin-v1.64.8-go1.26.6-${{ runner.os }}

      - name: Set up golangci-lint
        if: steps.cache-golangci-bin.outputs.cache-hit != 'true'
        # Build from source against the runner's Go toolchain (see cache
        # key rationale above). Only runs on a cache miss.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      # Cache golangci-lint's own analysis cache so `make lint` reuses
      # prior results and only re-lints changed packages. restore-keys
      # falls back to the newest partial cache when no exact hit.
      - name: Cache golangci-lint analysis cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-cache-${{ runner.os }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            golangci-cache-${{ runner.os }}-

      - name: golangci-lint version
        run: golangci-lint --version

      - name: Set up specter
        # The version is DERIVED from the tracked .specter-version file, never
        # written here. An earlier revision declared it in `env:` and then
        # compared the two, which detects drift but is still two places to
        # edit; scripts/specter-gate.py reads the same file and refuses to run
        # against any other build.
        run: |
          SPECTER_VERSION="$(tr -d '[:space:]' < .specter-version)"
          if [ -z "$SPECTER_VERSION" ]; then
            echo "::error::.specter-version is missing or empty"
            exit 1
          fi
          echo "Installing specter $SPECTER_VERSION (from .specter-version)"
          curl -fsSL "https://github.com/Hanalyx/specter/releases/download/v${SPECTER_VERSION}/specter_${SPECTER_VERSION}_linux_amd64.tar.gz" \
              -o /tmp/specter.tar.gz
          tar -xzf /tmp/specter.tar.gz -C /tmp specter
          install -m 0755 /tmp/specter /usr/local/bin/specter
          specter --version

      # Spec system-supply-chain C-04 / AC-06: every PR re-runs
      # `go mod tidy` and refuses to merge if go.mod / go.sum have
      # drifted. Catches stale dependency declarations + accidental
      # indirect-to-direct promotions.
      # GOFLAGS=-mod=readonly (AC-05) is unset for THIS step because
      # `go mod tidy` mutates go.mod/go.sum by design; readonly would
      # block it. Drift is detected via the follow-up `git diff` instead.
      - name: go mod tidy + diff
        env:
          GOFLAGS: ""
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod / go.sum drifted from 'go mod tidy' output. Run 'go mod tidy' locally and commit.";
            exit 1;
          }

      # OpenAPI-first drift guard (Go half): the committed server stubs must
      # match api/openapi.yaml. Without this, an OpenAPI edit that is not
      # regenerated lands silently — the stubs compile but no longer reflect the
      # contract. Cheap (no Node), so it runs early. The frontend schema.d.ts
      # half is checked after Node is set up, below.
      - name: Verify generated Go API stubs are in sync
        run: |
          make generate-api
          git diff --exit-code -- internal/server/api/server.gen.go || {
            echo "::error::internal/server/api/server.gen.go drifted from api/openapi.yaml. Run 'make generate-api' locally and commit.";
            exit 1;
          }

      - name: make vet
        run: make vet

      - name: make lint
        run: make lint

      - name: make vuln
        run: make vuln

      # Node and the frontend install move AHEAD of the Specter gate because
      # the gate asks Vitest for the real collected test titles rather than
      # guessing them from source. The vitest run further down reuses this
      # same install; nothing is installed twice.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify third-party notices and license texts
        run: make license-bundle

      # The Specter gate: pinned version, zero annotation ERRORS and WARNINGS
      # (info is not blocking), and 100% structural coverage. The policy lives in
      # scripts/specter-gate.py, which `make spec-check` also runs, so the
      # local and CI gates cannot drift into different rules. Spec
      # release-ci-gates C-07 / AC-11.
      #
      # Two things this replaced, and why. The old steps grepped specter's
      # TEXT output ('error \[' and a coverage table shape); a formatting
      # change upstream turns such a grep into a gate that matches nothing
      # and reports success. And the old comment claimed the pinned build
      # could exit 0 with annotation errors present. Re-measured on v0.15
      # before deleting that claim: a planted unknown @spec produces
      # error [unknown_spec_ref] and exit 1, and a planted unknown @ac
      # produces error [unknown_ac_ref] and exit 1.
      #
      # Severity is not a safe filter here. v0.15 deliberately leaves
      # unreachable_annotation_unknown at WARNING, and `specter check --test`
      # exits 0 with warnings present, so neither the exit code nor --strict
      # is sufficient on its own. The gate rejects any nonzero error or
      # warning count AND a nonzero exit status, printing what it rejected.
      # It runs under -S so its standard-library-only claim is enforced.
      #
      # The baseline this was measured against, stated once so the numbers
      # are not mixed: 277 warnings, being 130 unreachable_annotation, 102
      # unreachable_annotation_unknown and 45 domain_tier_conflict. Under
      # --strict the first and third became errors, giving 175 errors and
      # 102 warnings of the SAME 277. The 232 reachability annotations
      # repaired are the first two kinds.
      - name: specter gate (annotations + structural coverage)
        run: python3 -S scripts/specter-gate.py

      # Single race run of every package except internal/server that BOTH
      # detects data races and emits the JSON specter ingests — replacing the previous two end-to-end passes
      # (`make test-race` + a separate non-race `go test -json`), which ran
      # the whole serial DB-bound suite twice. Coverage is unaffected: the
      # only `//go:build !race` test file holds constants (with a `race`
      # twin), so every test still compiles+runs under -race, and the perf
      # budgets are non-gating (internal/perftest.Budgetf). Timeout raised
      # to 600s because race instrumentation slows the hot DB packages.
      - name: go test (race + json), every package except internal/server
        # OPENWATCH_PACKAGING_BUILD=1 opts the native package-build + runtime-boot
        # tests into this run so their AC coverage is enforced in CI; a plain
        # local `go test ./...` skips them (they take minutes and write into
        # dist/). See packaging/tests/package_test.go:requirePackagingBuild.
        env:
          OPENWATCH_PACKAGING_BUILD: "1"
        run: |
          set +e
          # Point the Kensa variable-catalog tests at the real rule corpus that
          # ships inside the kensa module, so api-system-scan-config/AC-08 runs
          # here instead of skipping (100% outcome coverage requires it).
          export OPENWATCH_KENSA_RULES_DIR="$(go list -m -f '{{.Dir}}' github.com/Hanalyx/kensa)/rules"
          # -timeout is per package. Two invocations in two jobs, every
          # package exactly once (CP bugs/OW-066). internal/server is the
          # database-heavy suite:
          # on the hosted runner it ran 794 s on main and timed out at 900 s on
          # two PRs with no failing test, the same tests simply running 27% to
          # 48% slower while sharing the PostgreSQL service with three sibling
          # packages under -p 4. Phase 1 runs everything else under the shared
          # 900 s ceiling, so a hang anywhere else still fails at 15 minutes.
          # Phase 2 (the server-tests job) runs internal/server alone under
          # 1800 s, at the same time as this one, against its own service.
          # Isolation on its own measured 885 s (run 35635263290): the same tests at the same
          # per-test speed as the contended base, so the budget is what closes
          # the margin. 1800 s is sized from evidence, base 794 s times the
          # worst observed slowdown 1.63 is 1294 s, and doubles the time to
          # detect a hang in this one package, which the founder accepted.
          # Each job fails on its own exit status and the gates job requires
          # both, so a green phase 2 never masks a red phase 1. Both JSON
          # streams reach specter ingest and the artifact upload.
          ALL=$(go list ./...)
          # The gates job checks at run time that the two streams together
          # report exactly these packages, each once (check-test-streams.py).
          printf '%s\n' "$ALL" > /tmp/go-packages.txt
          OTHERS=$(printf '%s\n' "$ALL" | grep -v '^github.com/Hanalyx/openwatch/internal/server$')
          # The arithmetic has to close, or a package could be tested twice
          # or not at all without anyone noticing. internal/server runs in
          # the server-tests job, which tests exactly that one package.
          if [ "$(printf '%s\n' "$ALL" | wc -l)" -ne $(( $(printf '%s\n' "$OTHERS" | wc -l) + 1 )) ]; then
            echo "::error::package split does not close: internal/server must be exactly one package of $(printf '%s\n' "$ALL" | wc -l)"
            exit 1
          fi
          # shellcheck disable=SC2086
          go test -race -json -timeout 900s -p 4 $OTHERS > /tmp/go-test.json
          EXIT1=$?
          [ "$EXIT1" -ne 0 ] && bash scripts/go-test-report.sh "every package except internal/server" /tmp/go-test.json
          echo "go test exit $EXIT1"
          [ "$EXIT1" -eq 0 ]

      # Frontend Vitest run for specter ingest. The specs/frontend/ specs
      # reference tests in frontend/tests/pages/*. Without these JUnit
      # results, those specs report 0% coverage and fail the threshold
      # gate even though the tests pass. Vitest emits JUnit XML at
      # /tmp/vitest-junit.xml which specter ingest reads alongside the Go
      # test results.
      - name: frontend vitest (junit) for specter ingest
        working-directory: frontend
        run: |
          set +e
          npx vitest run --reporter=junit --outputFile=/tmp/vitest-junit.xml --reporter=default
          EXIT=$?
          # Record the exit code but DON'T fail here: the frontend API type
          # check below still runs, and the JUnit file is kept for the gates
          # job, whose specter ingest and sync report which ACs the failures
          # left uncovered. The "Enforce frontend tests passed" step below
          # turns a non-zero result into a hard failure of this job.
          echo "$EXIT" > /tmp/vitest-exit
          if [ "$EXIT" -ne 0 ]; then
            echo "::warning::Vitest reported test failures — the gates job's specter coverage shows affected ACs; this job fails at the enforcement step."
          fi

      # OpenAPI-first drift guard (frontend half): the committed client types
      # must match api/openapi.yaml. Runs here because the vitest step above has
      # already installed frontend node_modules (openapi-typescript).
      - name: Verify generated frontend API types are in sync
        working-directory: frontend
        run: |
          npm run api:types
          cd .. && git diff --exit-code -- frontend/src/api/schema.d.ts || {
            echo "::error::frontend/src/api/schema.d.ts drifted from api/openapi.yaml. Run 'npm run api:types' in frontend/ and commit.";
            exit 1;
          }

      # Hard frontend-test gate. Vitest failures are deferred above so the
      # JUnit results still reach specter in the gates job; this step makes a
      # real frontend test failure fail this job, and so the required check. A frontend
      # regression that does not happen to map to a spec AC would otherwise
      # slip through (specter only gates annotated ACs), so this is the
      # backstop that keeps `npm test` authoritative in CI.
      - name: Enforce frontend tests passed
        run: |
          EXIT=$(cat /tmp/vitest-exit 2>/dev/null || echo 1)
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::Frontend vitest suite failed (exit $EXIT). See the 'frontend vitest' step above."
            exit "$EXIT"
          fi
          echo "frontend vitest suite passed"

      # Keep this job's results for the gates job on every outcome, so a
      # failure still leaves its JSON for specter ingest and the upload.
      - name: keep test results for the gates job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ci-checks-results
          path: |
            /tmp/go-test.json
            /tmp/vitest-junit.xml
            /tmp/go-packages.txt
          if-no-files-found: error
          retention-days: 1

  server-tests:
    name: Race tests (internal/server)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The package's own 1800 s -timeout plus setup, with margin.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openwatch
          POSTGRES_PASSWORD: openwatch_ci
          POSTGRES_DB: openwatch_go_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        shell: bash

    env:
      OPENWATCH_TEST_DSN: postgres://openwatch:openwatch_ci@127.0.0.1:5432/openwatch_go_test?sslmode=disable
      # Spec system-supply-chain C-03 / AC-05: pin every go command in
      # this workflow to read-only module resolution so a typo in
      # go.mod or an out-of-band fetch attempt fails the build instead
      # of silently mutating the lockfile.
      GOFLAGS: -mod=readonly
      # Test-DB isolation guard: CI's openwatch_go_test name already
      # ends in _test so the runtime guard accepts it without bypass.
      OPENWATCH_TEST_DSN_ALLOW_NONTEST: "no"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum

      # The embedded spec and the SPA stub the package compiles against.
      # Both are gitignored, so a fresh checkout has neither.
      - name: Stage the embedded files
        run: make internal/server/openapi_embed.yaml internal/server/spa/index.html

      # internal/server alone, at the same time as the checks job (CP
      # bugs/OW-066 for why it runs alone). The 1800 s budget and its
      # derivation are in the checks job's test step; this is the same
      # invocation it used to run as phase 2 of that step.
      - name: go test (race + json), internal/server
        run: |
          set +e
          export OPENWATCH_KENSA_RULES_DIR="$(go list -m -f '{{.Dir}}' github.com/Hanalyx/kensa)/rules"
          go test -race -json -timeout 1800s ./internal/server/ > /tmp/go-test-server.json
          EXIT2=$?
          [ "$EXIT2" -ne 0 ] && bash scripts/go-test-report.sh "internal/server" /tmp/go-test-server.json
          echo "go test exit $EXIT2"
          [ "$EXIT2" -eq 0 ]

      - name: keep test results for the gates job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ci-server-results
          path: /tmp/go-test-server.json
          if-no-files-found: error
          retention-days: 1

  # The documentation path (release-ci-gates C-18). A change that touches no
  # code, spec, tooling or CI path still changes inputs that tests read:
  # CHANGELOG.md, README.md, SECURITY.md, the guides and runbooks,
  # release/gates.toml and the other documents packaging/tests opens. This
  # job runs that whole package with its documented prerequisites and no
  # native package builds. It is TARGETED validation, not full coverage;
  # the full pipeline stays responsible for that. No PostgreSQL: it enables
  # no test here, since every database test also needs a native build, and
  # an unexpected database skip fails scripts/check-doc-stream.py.
  docs-tests:
    name: Documentation validation (packaging tests, partial)
    needs: changes
    if: needs.changes.outputs.go == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      GOFLAGS: -mod=readonly

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum

      # The embedded spec and the SPA stub the package compiles against.
      - name: Stage the embedded files
        run: make internal/server/openapi_embed.yaml internal/server/spa/index.html

      # The whole package, never a list of test names. Native builds stay
      # off (OPENWATCH_PACKAGING_BUILD unset), and so does the database; the
      # tests that need either skip with a fixed message, which the gates
      # job checks against the permitted set.
      - name: go test (race + json), packaging/tests, documentation path
        run: |
          set +e
          unset OPENWATCH_PACKAGING_BUILD OPENWATCH_TEST_DSN
          export OPENWATCH_KENSA_RULES_DIR="$(go list -m -f '{{.Dir}}' github.com/Hanalyx/kensa)/rules"
          go test -race -count=1 -json -timeout 900s ./packaging/tests/ > /tmp/go-test-docs.json
          EXIT=$?
          [ "$EXIT" -ne 0 ] && bash scripts/go-test-report.sh "packaging/tests (documentation path)" /tmp/go-test-docs.json
          echo "go test exit $EXIT"
          [ "$EXIT" -eq 0 ]

      - name: keep test results for the gates job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ci-docs-results
          path: /tmp/go-test-docs.json
          if-no-files-found: error
          retention-days: 1

  gates:
    name: Quality + security gates
    needs: [changes, checks, server-tests, docs-tests]
    # always(): this is the only required check, and GitHub counts a job that
    # was skipped because a dependency failed as passing one. Running always
    # and checking every needed result below is what makes a red test job
    # turn this check red.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The release readiness checker decides go/no-go for a candidate, so its
      # own guards have to hold: evidence tied to an artifact digest goes
      # stale when the bits change, an unreadable checksum list fails closed,
      # and an agent cannot satisfy a gate that requires a human observer.
      # Stdlib only and no network, so this runs unconditionally and fast.
      # -S disables site packages. The checker is standard library only by
      # design (see release-status.py's header), and this runner happens to
      # have PyYAML installed, so without -S an accidental third-party import
      # would pass here and fail on a runner that does not.
      #
      # Every scripts/test_*.py runs here, on both paths, found by glob so a
      # new script cannot be left out (release-ci-gates AC-32). Finding none
      # is a failure, and so is any script that fails; every script runs
      # before the step reports.
      - name: Python test scripts
        run: |
          shopt -s nullglob
          scripts=(scripts/test_*.py)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no scripts/test_*.py found; the Python checks did not run"
            exit 1
          fi
          failed=0
          for s in "${scripts[@]}"; do
            echo "::group::$s"
            if ! python3 -S "$s"; then
              echo "::error::$s failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          echo "ran ${#scripts[@]} Python test scripts"
          [ "$failed" -eq 0 ]

      - name: Set up specter
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.go == 'false'
        # The version is DERIVED from the tracked .specter-version file, never
        # written here. An earlier revision declared it in `env:` and then
        # compared the two, which detects drift but is still two places to
        # edit; scripts/specter-gate.py reads the same file and refuses to run
        # against any other build.
        run: |
          SPECTER_VERSION="$(tr -d '[:space:]' < .specter-version)"
          if [ -z "$SPECTER_VERSION" ]; then
            echo "::error::.specter-version is missing or empty"
            exit 1
          fi
          echo "Installing specter $SPECTER_VERSION (from .specter-version)"
          curl -fsSL "https://github.com/Hanalyx/specter/releases/download/v${SPECTER_VERSION}/specter_${SPECTER_VERSION}_linux_amd64.tar.gz" \
              -o /tmp/specter.tar.gz
          tar -xzf /tmp/specter.tar.gz -C /tmp specter
          install -m 0755 /tmp/specter /usr/local/bin/specter
          specter --version

      # Each stream is fetched by its exact name, so an absent artifact
      # fails the step; a pattern that matches nothing would not.
      - name: fetch the checks job's results
        if: needs.changes.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          name: go-ci-checks-results
          path: /tmp

      - name: fetch the server-tests job's results
        if: needs.changes.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          name: go-ci-server-results
          path: /tmp

      # specter ingest refuses a missing file or malformed JUnit, but accepts
      # an empty or malformed go test JSON file and ingests nothing from it.
      # This checks every file before ingest, and that the two streams
      # together report every package exactly once.
      - name: check the test streams
        if: needs.changes.outputs.go == 'true'
        run: >-
          python3 -S scripts/check-test-streams.py
          --packages /tmp/go-packages.txt
          --others /tmp/go-test.json
          --server /tmp/go-test-server.json
          --junit /tmp/vitest-junit.xml

      - name: specter ingest
        if: needs.changes.outputs.go == 'true'
        run: specter ingest --go-test /tmp/go-test.json --go-test /tmp/go-test-server.json --junit /tmp/vitest-junit.xml

      - name: specter sync (AC coverage thresholds)
        if: needs.changes.outputs.go == 'true'
        # --tests '**/*' broadens default discovery to include .test.tsx
        # files. Specter's `sync` coverage phase does not honor
        # settings.tests_glob in specter.yaml (the `coverage` subcommand
        # does — known specter quirk). The annotation walker still
        # filters on @spec / @ac, so non-test files in the broad glob
        # are skipped at parse time.
        run: specter sync --tests '**/*'

      - name: upload specter artifacts
        if: always() && needs.changes.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: specter-results
          path: |
            .specter-results.json
            /tmp/go-test.json
            /tmp/go-test-server.json
            /tmp/vitest-junit.xml
          retention-days: 7


      # The documentation path (release-ci-gates C-18). Its results are
      # partial by construction: packaging/tests only, no native builds. They
      # are checked as results, not as an upload, then ingested into a FRESH
      # Specter output and checked for failed criteria. specter sync is not
      # run on them: the coverage thresholds are global, and partial results
      # would fail them while proving nothing about the rest.
      - name: fetch the documentation job's results
        if: needs.changes.outputs.go == 'false'
        uses: actions/download-artifact@v4
        with:
          name: go-ci-docs-results
          path: /tmp

      - name: check the documentation stream
        if: needs.changes.outputs.go == 'false'
        run: python3 -S scripts/check-doc-stream.py --stream /tmp/go-test-docs.json

      - name: specter ingest (documentation path, partial)
        if: needs.changes.outputs.go == 'false'
        run: |
          rm -f .specter-results.json
          if [ -e .specter-results.json ]; then
            echo "::error::could not remove an earlier .specter-results.json"
            exit 1
          fi
          since="$(date +%s.%N)"
          specter ingest --go-test /tmp/go-test-docs.json
          python3 -S scripts/check-specter-partial.py --results .specter-results.json --stream /tmp/go-test-docs.json --since "$since"
          {
            echo "### Documentation path: partial validation"
            echo ""
            echo "Only packaging/tests ran, without native package builds. Failed criteria are rejected; coverage thresholds are not evaluated here."
            echo "Full test and coverage enforcement runs on code, spec, tooling and CI changes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload partial specter artifacts
        if: always() && needs.changes.outputs.go == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: specter-results-partial
          path: |
            .specter-results.json
            /tmp/go-test-docs.json
          retention-days: 7

      # The verdict. A Go change needs both full-path test jobs to have
      # succeeded and the documentation job skipped; any other change needs
      # the documentation job to have succeeded and both full-path jobs
      # skipped. Anything else (failure, cancellation, a skip on the path
      # that should run, an unset or unknown verdict) fails the required
      # check.
      - name: require every needed job
        if: always()
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          CHECKS: ${{ needs.checks.result }}
          SERVER: ${{ needs.server-tests.result }}
          DOCS: ${{ needs.docs-tests.result }}
        run: |
          echo "changes=$CHANGES go=$GO checks=$CHECKS server-tests=$SERVER docs-tests=$DOCS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::path detection did not succeed ($CHANGES)"
            exit 1
          fi
          case "$GO" in
            true)  want_full=success; want_docs=skipped ;;
            false) want_full=skipped; want_docs=success ;;
            *)     echo "::error::path detection produced no verdict (go='$GO')"; exit 1 ;;
          esac
          if [ "$CHECKS" != "$want_full" ] || [ "$SERVER" != "$want_full" ] || [ "$DOCS" != "$want_docs" ]; then
            echo "::error::with go=$GO want checks=$want_full server-tests=$want_full docs-tests=$want_docs; got checks=$CHECKS server-tests=$SERVER docs-tests=$DOCS"
            exit 1
          fi
          echo "all needed jobs ended as required"

  # Release evidence (release-ci-gates C-19, CP bugs/OW-086 tracks B and C).
  # The release gates do not read "Quality + security gates": that check also
  # passes on the documentation path, where the full suite is skipped. They
  # read this job, which exists only to say that the FULL pipeline ran on this
  # commit and every part of it succeeded. On the documentation path it is
  # skipped, and a skipped job is not evidence. It runs under always() so a
  # failed or cancelled dependency makes it fail rather than skip quietly.
  full-evidence:
    name: Full test evidence
    needs: [changes, checks, server-tests, docs-tests, gates]
    if: always() && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: require the whole full pipeline
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          CHECKS: ${{ needs.checks.result }}
          SERVER: ${{ needs.server-tests.result }}
          DOCS: ${{ needs.docs-tests.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          echo "changes=$CHANGES go=$GO checks=$CHECKS server-tests=$SERVER docs-tests=$DOCS gates=$GATES"
          bad=0
          want() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', want '$3'; this commit has no full test evidence"
              bad=1
            fi
          }
          want changes "$CHANGES" success
          want go "$GO" true
          want checks "$CHECKS" success
          want server-tests "$SERVER" success
          want docs-tests "$DOCS" skipped
          want gates "$GATES" success
          [ "$bad" -eq 0 ]
          echo "full test evidence: every full-path job succeeded on ${GITHUB_SHA}"

  # Hanalyx documentation style gate. Runs as its own job on purpose: the
  # full-path test jobs above are skipped on documentation-only changes, so
  # a step inside them would be skipped exactly when documentation is what
  # changed. Enforces the prohibited list from the Context Plane at
  # dev/DEVELOPER_DOCUMENTATION_STYLE_GUIDE: em dashes, emojis, AI speak,
  # US English spelling, and a per-file reading level.
  # Shared implementation: dev/tools/doc-style-check. The adopted version is
  # pinned in .doc-style-version, and scripts/doc-style-gate.py refuses to scan
  # with a checker that disagrees with it. That pin is the only place the number
  # lives; this job deliberately carries none, because the comment here that
  # once named a version was two releases out of date and nothing caught it.
  # Provenance and the local edits are recorded in the checker's own header,
  # which is replaced wholesale on every upgrade and so cannot drift from it.
  doc-style:
    name: Doc Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The selftest runs first so a broken checker fails as a broken checker
      # rather than as a clean run. A gate nobody has watched fail is not
      # known to work.
      - name: Checker selftest
        run: python3 -S scripts/check-doc-style.py --selftest
      # Runs the Make target, not its own copy of the command. A workflow that
      # rebuilds the invocation is a second policy wearing the first one's name,
      # and it is how this job came to check only changed files while the
      # contract claimed the tree was clean.
      - name: Check the tracked tree against the style guide
        run: make docs-style
