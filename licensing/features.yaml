# OpenWatch License Feature Registry
#
# Source of truth for license feature ids. `go generate ./internal/license/...`
# produces internal/license/features.gen.go from this file.

version: 1

features:
  - id: compliance_check
    tier: free
    description: Run compliance scans against hosts (core capability)
    introduced: "1.0.0"

  - id: audit_query
    tier: enterprise
    description: Saved and ad-hoc audit query DSL via POST /audit/events:query
    introduced: "1.0.0"

  - id: audit_export
    tier: enterprise
    description: Fleet-scale audit export as signed bundles. Per-host audit export is free core
    introduced: "1.0.0"

  - id: temporal_queries
    tier: enterprise
    description: Point-in-time compliance posture queries, drift forecasts, historical reconstruction from the transaction log
    introduced: "1.0.0"

  - id: remediation_execution
    tier: enterprise
    description: Bulk / fleet-wide manual remediation - apply many rules at once across a host selection (single-rule manual remediation is free core)
    introduced: "1.0.0"

  - id: remediation_auto
    tier: enterprise
    description: Policy-driven and scheduled auto-remediation across the fleet (severity routing, canary, guardrails, circuit breaker)
    introduced: "1.0.0"

  - id: structured_exceptions
    tier: enterprise
    description: Fleet-scale exception workflow with multi-stage approval and policy enforcement. Per-host exceptions are free core
    introduced: "1.0.0"

  - id: priority_updates
    tier: enterprise
    description: Early access to Kensa rule updates and framework mappings
    introduced: "1.0.0"

  - id: compliance_attestation
    tier: enterprise
    description: Fleet-wide signed attestation reports and the fleet OSCAL SAR export
    introduced: "1.0.0"

  - id: sso_saml
    tier: free
    description: SAML 2.0 single sign-on integration
    introduced: "1.0.0"

  - id: fido2_mfa
    tier: free
    description: FIDO2 / WebAuthn second factor for user authentication
    introduced: "1.0.0"

  - id: premium_diagnostics
    tier: enterprise
    description: Premium diagnostic endpoints (Stage 0 demo and future operator tooling)
    introduced: "1.0.0"

# Deprecated feature IDs retained for backwards compatibility on old licenses.
# Existing licenses including these continue to validate; new licenses should
# not include them. Build fails if any source emits a deprecated id.
deprecated_features: []
