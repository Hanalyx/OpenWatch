# Accepted documentation defects for gate D1 (release-ci-gates C-22).
#
# A D1 verdict is "accurate" or the review fails, with one narrow exception:
# a document the release captain has explicitly accepted as defective for ONE
# candidate. Each record binds the acceptance to that candidate's tag and
# commit, to the exact blob of one document, to the named findings, and to the
# pull requests that fix them on main. The reviewer may then record that
# document as "accepted-defect", never as "accurate", and only if nothing else
# in it is wrong.
#
# This file holds the v0.8.4 records and nothing else. Adding a record for any
# other candidate, document or defect is a new policy amendment, reviewed as
# such; packaging/tests enforces that.

