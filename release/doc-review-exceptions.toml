# Accepted documentation defects for gate D1 (release-ci-gates C-22).
#
# This file is tracked and public, so it carries the TECHNICAL SCOPE only:
# the candidate's tag and commit, one document path and its exact blob at that
# commit, the defect descriptions, and the public pull requests that fix them
# on main. It does not carry the acceptance, its date or who accepted it.
# Those are internal: the release captain's acceptance is recorded in the D1
# attestation as a [[defect_acceptance]] entry naming the record's id, and the
# checker accepts a document as "accepted-defect" only when both agree. Such a
# document is never "accurate".
#
# This file holds the two v0.8.4 records (release-ci-gates 1.26.0) and the two
# v0.8.6 records (1.32.0), and nothing else. A record for any other candidate,
# document or defect is a new policy amendment, reviewed as such;
# packaging/tests enforces that.

[[exception]]
id = "v0.8.4-branch-management-ci-paths"
candidate_tag = "v0.8.4"
commit = "474d9af26e457fc6a47b5475fab87394433a687b"  # pragma: allowlist secret
path = ".github/BRANCH_MANAGEMENT.md"
blob = "e64a6d9179d69698aa58db6393b43f13c13af5e7"  # pragma: allowlist secret
findings = [
  "Lines 206 to 207: \"All of these must pass for the single required check (`Quality + security gates`) to go green\" is false for a documentation-only change, which goes green on the documentation path without vet, lint, vuln, the race suite, Vitest or specter sync.",
  "Lines 13 to 15: describes go-ci as building and testing the Go module without mentioning the documentation path.",
  "Line 232: states that specter sync gates 100% coverage without saying it runs on the full path only.",
]
fixes = ["#930 (7caf1c2b6623d277ee774be1e01a59b52ac9237f)"]

[[exception]]
id = "v0.8.4-workflows-readme-ci-paths"
candidate_tag = "v0.8.4"
commit = "474d9af26e457fc6a47b5475fab87394433a687b"  # pragma: allowlist secret
path = ".github/workflows/README.md"
blob = "bc96f6b1dcad3bbaadd0d99946994b4980a95494"  # pragma: allowlist secret
findings = [
  "Lines 32 to 34: \"A path-detection step short-circuits to success for doc/meta-only changes\" is false since #922: a documentation-only change runs the packaging Go tests, the Python checks and a partial Specter ingest, and the required check fails if any of them fails.",
  "Lines 18 and 32 to 33: the triggers omit the v* tag trigger added in #925.",
  "Lines 36 to 54: describes the race tests as two invocations in one job with one PostgreSQL service; since #909 they are two parallel jobs, each with its own service.",
  "The Full test evidence job (#925), which the release gates read, is not mentioned.",
]
fixes = ["#931 (e8b4c96050dd69c77c819c4958f74148a2115174)"]

[[exception]]
id = "v0.8.6-contributing-cosign-roles"
candidate_tag = "v0.8.6"
commit = "904c69731d8c69d872aaec310d6d5c5f7461615b"  # pragma: allowlist secret
path = "CONTRIBUTING.md"
blob = "a69ab7804232a32ba26f66b202304fb3afa12aa3"  # pragma: allowlist secret
findings = [
  "Lines 333 to 334: \"`GPG_PRIVATE_KEY` and `GPG_PASSPHRASE` sign the checksums, `COSIGN_PRIVATE_KEY` and `COSIGN_PASSWORD` sign the packages\" reverses the roles. GPG signs every package and SHA256SUMS; cosign, only when its key is configured, signs SHA256SUMS and nothing else.",
]
fixes = ["#971"]

[[exception]]
id = "v0.8.6-releasing-cosign-claims"
candidate_tag = "v0.8.6"
commit = "904c69731d8c69d872aaec310d6d5c5f7461615b"  # pragma: allowlist secret
path = "docs/runbooks/RELEASING.md"
blob = "edc006de07bf880723602454fc70648b30472921"  # pragma: allowlist secret
findings = [
  "Line 29: lists \"`SHA256SUMS` (GPG `.asc` + cosign `.sig`)\" among the outputs of every v* tag. release.yml signs with cosign only when COSIGN_PRIVATE_KEY is set, and no release, v0.8.6 included, has carried SHA256SUMS.cosign.sig.",
  "Line 565: the signing-layers table says SHA256SUMS is signed by GPG and cosign, and tells operators to run `cosign verify-blob --key cosign.pub`. No cosign public key is published, so no operator can run that check.",
]
fixes = ["#971"]
