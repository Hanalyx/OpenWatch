spec:
  id: api-reports
  title: Reports library - immutable, signed, point-in-time compliance artifacts (four kinds)
  version: "1.19.0"
  status: approved
  tier: 2

  context:
    system: openwatch
    feature: A library of immutable compliance reports across four kinds, each computed from one point-in-time database snapshot, frozen as content-addressed JSON, signed when a signer is wired, and served through kind-specific rendered faces
    description: >
      A report is a point-in-time, immutable compliance artifact. There are
      FOUR kinds: executive, attestation, exception and remediation.

      DERIVED, THEN FROZEN (load-bearing): Generate computes the kind's
      content from data that already exists and writes it once. Every read
      behind one Generate runs in a SINGLE repeatable-read, read-only
      database snapshot, so the score, the coverage block, the top-failing
      list and the provenance all describe the same fleet at the same
      instant; data_as_of is that snapshot's own timestamp. The row is
      WRITE-ONCE and is never recomputed.

      SCORE-BEARING VERSUS READ MODEL: executive and attestation compute a
      fleet score and carry the full provenance envelope with
      artifact_class score_bearing. The score is the canonical nullable
      score_pct: the EQUAL-HOST MEAN of the in-scope hosts' scores, to one
      decimal, null when no host produced a verdict, so an unscanned fleet
      stays distinguishable from a fully failing one. Exception and
      remediation aggregate no scan set, so they are signed READ MODELS:
      artifact_class read_model, corpus_identity_status not_applicable, and
      no score or contributor count at all. An artifact_class that
      contradicts its kind is rejected.

      CONTENT IS A WIRE CONTRACT: a renderer reads the frozen JSON by exact
      key. For the executive kind those are score_pct, host_count,
      passing_rules, failing_rules, critical_issues, top_failing_rules,
      coverage and provenance. score_pct encodes as JSON null when
      unevaluated (not 0, not omitted) and top_failing_rules always
      serializes as a list (never JSON null), ordered most-failing first
      and capped at a small leadership-facing limit.

      CONTENT-ADDRESSED AND SIGNED: each row carries a content_sha256 over
      its canonical JSON, and when a signer is wired Generate adds an
      Ed25519 signature over that address with the signing key id. Given
      the canonical JSON face and a TRUSTED copy of the public key, a
      verifier can then check the artifact with no server-side verification
      operation. Establishing trust in that key is an operational
      responsibility outside this report format. The TRUST ANCHOR is the
      COMPLETE key: either the full base64 public_key, or the lowercase hex
      SHA-256 of the decoded 32-byte key. key_id is NOT an anchor; see C-11.
      GET /api/v1/reports/signing-key is a convenience for fetching the key,
      not a root of trust. A server that served a replacement artifact could
      serve a matching signature and public key with it, so a key taken from
      the same server proves only internal consistency.

      FACES ARE KIND-SPECIFIC. Executive renders json and pdf. Attestation
      renders json, pdf, csv and oscal_sar. Exception and remediation each
      render json, pdf and csv. A face that does not apply to a kind is
      refused. Attestation bulk faces may render ASYNCHRONOUSLY when a
      worker is wired; lazy synchronous export remains the correctness
      fallback, so a face is always obtainable.

      STORAGE SHAPE: a report row carries a title and scope_label derived
      from its kind and scope, the kind, data_as_of, generated_by (the
      calling principal's id, or "scheduler" for a scheduled run), the
      format, the JSON content, content_sha256, the optional signature and
      signing key id, and created_at. The library lists newest first.

      SCOPING: Generate accepts an optional scope. group_id narrows to a
      group's resolved active members, framework applies the compliance
      lens, and period_days sets the look-back window for the time-windowed
      remediation kind. An absent body means all hosts and all frameworks.

      RBAC: the read endpoints require host:read; generate requires
      host:write. Anonymous callers are rejected on every route. Scheduled
      generation is a separate authenticated internal path that records
      "scheduler", not an anonymous request. Handlers map report.ErrNotFound
      to 404 (reports.not_found).

      Endpoints:
        GET  /api/v1/reports                  - list the library, newest first (host:read)
        POST /api/v1/reports:generate         - generate a report of any kind (host:write)
        GET  /api/v1/reports/{id}             - fetch one report with its stored content (host:read)
        GET  /api/v1/reports/{id}/export      - stream a rendered face as an attachment (host:read)
        GET  /api/v1/reports/frameworks       - the fleet framework catalog for the scope picker (host:read)
        GET  /api/v1/reports/signing-key      - the public signing key, for offline verification

      HISTORY, not current scope: the initial release contained only the
      executive JSON artifact. Later approved versions added content
      addressing, Ed25519 signing, the export faces, and the attestation,
      exception and remediation kinds. Release history belongs in
      CHANGELOG.md; the constraints below are the current contract.

    related_specs:
      - api-groups
      - api-host-compliance
      - system-rbac
      - system-report-schedule
      - system-compliance-scoring

  objective:
    summary: >
      A correct, auditable reports library across four kinds, each computed
      once from the authoritative tables inside one database snapshot,
      frozen as content-addressed JSON, signed for tamper-evidence when a
      signer is wired, rendered through kind-specific faces, and served
      behind a host:read view / host:write generate RBAC bar.
    scope:
      includes:
        - report_snapshots and report_faces plus the internal/report service
        - Generate / List / Get / Export over all four kinds (executive, attestation, exception, remediation)
        - 'The HTTP surface with its RBAC bars: list, fetch, generate, export, the framework catalog, and the signing-key endpoint'
        - One repeatable-read read-only snapshot per Generate, covering group resolution, every content read, and the sampling timestamp
        - Score-bearing content (executive, attestation) carrying the canonical nullable score_pct, equal-host aggregation and the full provenance envelope
        - Read-model content (exception, remediation) carrying the read-model provenance shape and no score
        - Content addressing (content_sha256) and Ed25519 signing, with offline verification from the canonical JSON face and the signing key
        - Kind-specific faces, and the asynchronous rendering path for attestation bulk faces with lazy export as the correctness fallback
        - Group, framework and remediation look-back scoping
      excludes:
        # Audited against the code and the registered specs on 2026-09-07.
        # An entry is kept only where the capability is genuinely absent or
        # is owned by another approved spec.
        - The OSCAL POA&M face (open-findings milestones). Not implemented; the fleet OSCAL SAR face ships per C-14
        - The Templates gallery (prototype templates beyond the four kinds). Still deferred, see internal/report/types.go
        - Retention sweeps for report_snapshots and report_faces. Both tables are recorded StateUndecided in internal/retention/policy.go, so the decision is owned there rather than here
        - An explicit host-set scope (an arbitrary list of host ids). Scoping is by group, framework and look-back window only
        - Scheduled generation and email delivery, which are IMPLEMENTED and owned by system-report-schedule. This is a boundary, not an absence

  constraints:
    - id: C-01
      description: >-
        The frozen executive content is a JSON wire contract: it
        serializes the exact keys score_pct, host_count,
        passing_rules, failing_rules, critical_issues, top_failing_rules,
        coverage (v1.2.0, an object with hosts_total, hosts_fresh,
        hosts_stale, hosts_unreachable), and provenance; score_pct encodes
        as JSON null when nothing is evaluated (not 0, not omitted); a
        newly generated artifact MUST NOT carry compliance_pct;
        top_failing_rules always serializes as a list (never JSON null),
        ordered most-failing first and capped at the small
        leadership-facing limit.
      type: technical
      enforcement: error
    - id: C-02
      description: >-
        score_pct is the equal-host mean of the in-scope hosts' scores,
        each host being passing over (passing + failing), rendered to one
        decimal and null (never 0) when no host has been evaluated, so an
        unscanned fleet is distinguishable from a fully failing one.
        Amended 2026-09-03: it was compliance_pct, a pooled whole percent
        over every rule outcome in scope, which weighted a host by how many
        rules it carried and could never equal the one-decimal score every
        other surface reports.
      type: technical
      enforcement: error
    - id: C-03
      description: >-
        Each kind has a fixed identity: executive (title "Fleet Compliance
        - Executive Summary", small top-failing embed limit) and, as of
        v1.7.0 (Phase B1), attestation (title "Framework Attestation"). The
        generate request's kind defaults to executive when omitted; an
        unknown kind is rejected (report.ErrInvalidKind -> 400
        reports.invalid_kind). format is 'json'. scope_label is derived from
        the report's scope (v1.1.0) and defaults to "All hosts" for an
        unscoped report. The library lists newest first by created_at.
      type: technical
      enforcement: error
    - id: C-04
      description: >-
        Generate computes the executive content from the authoritative
        posture tables and freezes it: passing_rules, failing_rules, and
        critical_issues come from host_rule_state (failing rows of critical
        severity for critical_issues); host_count is the active (deleted_at
        IS NULL) host count; top_failing_rules lists the rules failing on
        the most hosts, ordered by failing host count then rule id. The row
        is write-once - data_as_of is the sampling instant, generated_by is
        the supplied actor, and the row is never recomputed thereafter. The
        row lives in report_snapshots (v1.3.0; renamed from reports).
      type: technical
      enforcement: error
    - id: C-05
      description: >-
        List returns every report ordered by created_at descending (newest
        first); Get returns one report by id or report.ErrNotFound, which
        the handler maps to 404 reports.not_found. Two generations yield
        two distinct immutable rows (no in-place update).
      type: technical
      enforcement: error
    - id: C-06
      description: >-
        RBAC: every read route requires host:read. That is list, fetch,
        export, the framework catalog and the signing-key endpoint, which is
        the whole read surface at this version. POST
        /api/v1/reports:generate requires host:write. Anonymous callers are rejected on every route
        (auth.EnforcePermission with auth.HostRead or auth.HostWrite). A
        host:read-only caller is 403 on generate. generated_by records the
        calling principal's id. A successful generate emits a
        report.generated audit event (actor, report id, kind, scope_label).

        generated_by FAILS CLOSED. It is part of the signed artifact, so an
        authorized request that carries no principal MUST generate nothing
        rather than record a placeholder: a fabricated actor cannot be
        detected or corrected by any later reader of the artifact.

        Corrected 2026-09-07. This constraint said generated_by records
        'system' when the request is anonymous, and that the wire surfaces
        no signing, PDF or OSCAL fields. Both were stale: an anonymous
        generate never reaches the actor lookup because the permission bar
        rejects it first, and signing, PDF and OSCAL SAR all ship under
        C-11, C-15 and C-14. Scheduled generation is a separate
        authenticated internal path that records "scheduler".
      type: security
      enforcement: error
    - id: C-07
      description: >-
        v1.1.0 - Generate accepts an optional scope {group_id?,
        framework?}; an empty body generates the all-hosts, all-frameworks
        summary (the v1.0.0 behavior). group_id scopes the posture to that
        group's member hosts - manual groups via group_members, auto groups
        via hosts.os_family == match_family (resolved through the group
        service) - so host_count and every rule count reflect only those
        hosts; an empty group yields zero counts (distinct from unscoped).
        framework applies the same lens as the fleet rollup, counting only
        host_rule_state rows whose framework_refs contain the key
        (framework_refs ? key). The resolved scope (group_id, the group's
        display name frozen at generation time, framework) is stored on the
        row and echoed on the wire, and scope_label is derived as
        "<group name or All hosts>" optionally suffixed with " . <FRAMEWORK
        family>" (the family is the key's leading token, uppercased). An
        unknown group_id surfaces group.ErrNotFound, which the handler maps
        to 400 reports.invalid_scope; a malformed body maps to 400
        reports.invalid_request.
      type: technical
      enforcement: error
    - id: C-08
      description: >-
        v1.2.0 - Generate computes a coverage block over the same in-scope
        active hosts and freezes it on the content, so a reader can tell how
        much of the fleet the numbers actually reflect (the staleness
        disclosure / coverage caveat). hosts_total is the active host count
        in scope (host_count is derived from it, not queried twice);
        hosts_fresh counts hosts whose newest host_rule_state.last_checked_at
        is within the freshness window (24h); hosts_stale counts the rest
        (older-than-window OR never scanned), so hosts_fresh + hosts_stale ==
        hosts_total; hosts_unreachable counts in-scope hosts whose
        host_liveness.reachability_status is 'unreachable' (a host with no
        liveness row is unknown, NOT unreachable). Coverage respects the
        group scope (C-07) the same way the posture counts do.
      type: technical
      enforcement: error
    - id: C-09
      description: >-
        v1.3.0 - Snapshots are content-addressed. Generate stores a
        content_sha256 on the report_snapshots row: the hex SHA-256 of the
        canonical (service-marshaled) content - the exact bytes stored in
        content. Identical content yields an identical hash (content
        addressing), so two snapshots of an unchanged fleet share a
        content_sha256 while remaining distinct rows (distinct ids); a
        posture change changes the hash. content_sha256 is the stable
        identity the Ed25519 signature (C-11) signs over. The report_faces
        table is created for later rendered projections (PDF/CSV/OSCAL) but
        the executive JSON remains the canonical snapshot content, not a
        face row. content_sha256 is exposed on the Report wire.
      type: technical
      enforcement: error
    - id: C-10
      description: >-
        v1.4.0 - GET /api/v1/reports/{id}/export streams a rendered FACE of
        the report as a downloadable attachment (Content-Disposition
        attachment with a derived filename). format=pdf (default) renders a
        BOUNDED one-page executive PDF via the pure-Go go-pdf/fpdf core
        fonts (header + a fixed posture block + the coverage caveat, shown
        only when some host is stale/unreachable + the small top-failing
        list) - O(1) pages regardless of fleet size, never the full
        per-host/per-rule evidence; format=json returns the CANONICAL
        content (v1.5.0: re-marshaled so its bytes reproduce content_sha256
        byte-for-byte, since the stored jsonb is Postgres-normalized - this
        makes the snapshot offline-verifiable, sha256(json face) ==
        content_sha256). The PDF is rendered lazily on first request and
        cached in report_faces keyed by (snapshot_id, face) with status
        'ready', the byte size, and a blob_sha256 content address; a repeat
        export re-streams the cached bytes rather than re-rendering. RBAC:
        host:read. An unknown id is 404 reports.not_found; an unknown
        format is 400 reports.invalid_format (report.ErrInvalidFace).
        v1.7.0: faces are KIND-scoped - csv (the attestation evidence
        extract, C-13) is attestation-only; requesting a face that does not
        apply to the report's kind is ErrInvalidFace (400). The json face
        applies to any kind (canonical content). v1.9.0: the pdf face is
        KIND-DISPATCHED, not executive-only - it renders the executive
        summary PDF (C-10) for an executive report and the bounded
        attestation cover PDF (C-15) for an attestation report.
      type: technical
      enforcement: error
    - id: C-11
      description: >-
        v1.5.0 - Report snapshots are Ed25519-signed for tamper-evidence.
        When a signer is wired, Generate signs the snapshot's content
        address with a domain-separated payload ("openwatch/report-snapshot
        /v1\n" + content_sha256) and stores the signature + the signing key
        id on the row; the Report wire
        exposes signature (base64) + signing_key_id (a service with no
        signer leaves them null). The signing key is a 32-byte raw Ed25519
        seed loaded from a config path (never stored in the DB), with an
        EPHEMERAL per-boot key when unconfigured (development; the
        signing-key endpoint reports ephemeral=true). GET
        /api/v1/reports/signing-key (host:read) returns the public key
        {key_id, algorithm: ed25519, public_key (base64), ephemeral} so a
        holder verifies a report's signature offline: reconstruct the
        domain-separated payload from content_sha256 and Ed25519-verify
        against the published key; re-hashing the canonical json face
        (C-10) confirms the content matches the signed hash. The endpoint is
        503 when no signer is wired.

        key_id AND signing_key_id ARE CORRELATION IDENTIFIERS, NOT AUTHENTICITY
        ANCHORS. Both are the first 8 bytes of SHA-256 over the public key, so
        64 bits. They exist to match a report to a served key and to name a key
        in logs and operator records. 64 bits is inside reach of a collision
        search, so a party who can grind keys can present a DIFFERENT public key
        carrying the SAME key_id. Neither field may be documented, rendered or
        recorded as the value an operator compares to establish authenticity.
        The anchor is the complete key, or the full lowercase hex SHA-256 of the
        decoded 32-byte key (C-10).
      type: security
      enforcement: error
    - id: C-12
      description: >-
        v1.6.0 (Phase B0) - GET /api/v1/reports/frameworks (host:read)
        returns the fleet framework catalog: the distinct framework_refs
        keys present anywhere in host_rule_state, each with the count of
        DISTINCT rules mapped to it, ordered by count descending then key
        ascending. It backs the report scope picker's framework lens (the
        lens deferred in A1 for lack of a catalog) and the later
        attestation kind's framework selection. Response shape
        {frameworks: [{framework, rule_count}]} (an empty array when the
        fleet has no scanned rules); anonymous callers are rejected.
      type: technical
      enforcement: error
    - id: C-13
      description: >-
        v1.7.0 (Phase B1) - The attestation kind is the auditor/GRC bulk
        evidence path. Generate (kind=attestation) FREEZES which completed
        scan attests each in-scope active host - the latest as of generation
        time - as the snapshot's AttestationContent {framework, hosts_total,
        hosts_attested, attested:[{host_id, scan_id, scanned_at}], rollup};
        it does NOT copy the bulk rows. Because scan_results are immutable,
        the snapshot is point-in-time while staying small (inline JSONB, no
        blob needed). v1.11.0: the headline compliance rollup is FROZEN into
        the content at generation time - rollup {score_pct, total_checks,
        passing, failing, skipped, errored, top_failing, provenance} -
        computed once by aggregate queries over the frozen scans
        (framework-lensed), so it is part of the signed content and the
        in-app view, the PDF cover, and the signature all show the same
        numbers (the PDF reads the frozen rollup; a pre-rollup snapshot is
        recomputed on the fly for back-compat). The CSV face (C-10)
        reconstructs one row per (host, rule)
        from those frozen scans' scan_results - hostname, ip, os, rule_id,
        status, severity, framework_refs, evidence_sha256, scanned_at -
        applying the snapshot's framework lens (framework_refs ? key) to
        narrow the rows (not which hosts are attested). Each cell is
        csvSafe-guarded (CWE-1236); the export is capped at a large row
        limit with a trailing disclosure row when truncated. The CSV is
        cached in report_faces like the PDF. Signing (C-11) applies the same
        way (the AttestationContent is the signed canonical content).
      type: technical
      enforcement: error
    - id: C-14
      description: >-
        v1.8.0 (Phase B2) - The attestation kind also renders a fleet OSCAL
        SAR face (format=oscal_sar, attestation-only, a face that does not
        apply to executive is ErrInvalidFace/400 per C-10). It is a SINGLE
        OSCAL 1.0.6 assessment-results document assembled from the frozen
        scans' scan_results: one result whose findings + observations carry
        one entry per (host, rule), the finding target state "satisfied"
        only for a pass (else "not-satisfied"), the host as an
        inventory-item subject (a deterministic v5 uuid), and the reviewed
        controls aggregated as framework-prefixed control-id tokens (so
        digit-leading native ids like CIS "1.1" stay valid OSCAL tokens),
        narrowed by the snapshot's framework lens. Evidence is REFERENCED by
        sha256 in back-matter (an rlink with a SHA-256 hash), never inlined
        as base64 - the bytes stay in scan_evidence - so a 100-host x
        500-rule attestation does not become the 1000-page problem in OSCAL
        form. Every uuid is a deterministic v5 derived from the snapshot id
        (and host/rule), and every timestamp comes from the frozen snapshot,
        so the document is byte-deterministic and cached in report_faces
        (face oscal_sar, status 'ready') like the other faces; the assembly
        is bounded by the same row cap as the CSV (a metadata prop discloses
        truncation). The OSCAL version stays 1.0.6 to match the per-scan
        emitter (Kensa-controlled).
      type: technical
      enforcement: error
    - id: C-15
      description: >-
        v1.9.0 (Phase B3b) - The attestation kind also renders a BOUNDED PDF
        cover face (format=pdf is kind-dispatched per C-10; for an
        attestation it renders the attestation cover, for an executive the
        executive summary). Like the executive PDF it is O(1) pages
        regardless of fleet size: a methodology note, the aggregate
        attestation coverage (hosts attested of in-scope) + framework rollup
        (compliance %, checks evaluated, pass/fail/skipped/error counts), a
        SAMPLED top-failing list (the rules failing on the most hosts,
        capped), and a footer carrying the snapshot content hash + signing
        status as the pointer to the bulk faces - never the per-(host, rule)
        rows. The rollup is computed by aggregate queries over the frozen
        scans (counts by status; top failing by distinct failing host),
        applying the snapshot's framework lens; compliance is passing /
        (passing + failing) rounded half up, null when nothing was
        evaluated. A host with no completed scan is disclosed as not
        attested. The PDF is rendered via the pure-Go go-pdf/fpdf core fonts
        (airgap-safe) and cached in report_faces (face pdf, status 'ready')
        like the other faces.
      type: technical
      enforcement: error
    - id: C-16
      description: >-
        v1.10.0 (Phase B3a) - Attestation bulk faces render ASYNCHRONOUSLY.
        When async rendering is enabled (WithAsyncRender, set in production
        where a worker drains the queue), Generate(kind=attestation) marks
        the bulk faces (csv, oscal_sar, pdf) as report_faces rows with status
        'pending' and enqueues a report.render job, then returns immediately
        (the executive summary stays synchronous - it is a tiny rollup). A
        RenderProcessor registered on the in-process worker claims the job,
        renders each applicable face via Export (flipping its row 'pending'
        -> 'ready'; a render error marks that face 'failed' and fails the job
        for retry), completes the job, and publishes an eventbus.ReportReady
        event (kind report.ready) carrying the snapshot id, report kind, the
        rendered faces, and the generating principal - the first producer of
        the in-app notification bell. Async rendering is an
        optimization/notification path, NOT a correctness gate: Export
        remains the lazy fallback, so a download that arrives before the job
        runs still renders the face inline. Enqueue failures are logged and
        do not fail Generate. The new event is registered in
        eventbus.AllEventKinds (system-event-bus closed set).
      type: technical
      enforcement: error
    - id: C-17
      description: >-
        v1.12.0 (Phase C1) - The exception kind is the Compliance/GRC
        Exception Register: a POINT-IN-TIME read-model of compliance waivers
        (compliance_exceptions), title "Exception Register", admitted by the
        report_snapshots.kind CHECK (migration 0044). Generate
        (kind=exception) freezes an ExceptionContent {summary, exceptions[]}
        scoped to the in-scope hosts: summary is an exact aggregate by state
        (total, active, requested, approved, rejected, revoked, expired,
        expiring_soon) where active = approved AND (no expiry OR expiry in
        the future) and expiring_soon = active with an expiry within 30 days;
        exceptions[] is one row per waiver (host, rule_id, status, reason,
        requester + reviewer usernames, requested_at/reviewed_at/expires_at,
        active), capped, requester/reviewer resolved to usernames. The CSV
        face is the full register (one row per waiver, csvSafe-guarded); the
        PDF face is the bounded one-page summary (counts + a sampled
        soonest-expiring list); the JSON face is the canonical content; pdf
        and csv are kind-dispatched to the exception renderers, and oscal_sar
        is ErrInvalidFace for the exception kind. Signing (C-11) applies (the
        ExceptionContent is the signed canonical content).
      type: technical
      enforcement: error
    - id: C-18
      description: >-
        v1.13.0 (Phase C2) - The remediation kind is the Operations
        Remediation Activity report: a read-model of remediation requests
        over a LOOK-BACK WINDOW, title "Remediation Activity", admitted by
        the report_snapshots.kind CHECK (migration 0045). The generate
        request's period_days (1..365, default 30, clamped) sets the window;
        Generate (kind=remediation) resolves [from, to) = [now - period_days,
        now] and freezes a RemediationContent {period_from, period_to,
        summary, activities[]} over remediation_requests filtered on
        requested_at and scoped to the in-scope hosts. summary is an exact
        aggregate by outcome (total, executed, rolled_back, failed, rejected,
        pending = pending_approval|approved|dry_run_complete|executing);
        activities[] is one capped row per request (host, rule, status,
        mechanism, requester + reviewer usernames, requested_at/reviewed_at).
        The CSV face is the full activity log (csvSafe-guarded); the PDF face
        is the bounded one-page summary (counts + a recent-activity sample);
        the JSON face is the canonical content; pdf/csv are kind-dispatched
        and oscal_sar is ErrInvalidFace for the kind. Signing (C-11) applies.
      type: technical
      enforcement: error

    - id: C-19
      description: >
        Report tiering gates on the report KIND, never on scope. An absent
        scope body means all hosts and all frameworks, so a scope-based gate
        would gate the default executive summary, which is the everyday free
        artifact. Only kind `attestation` is licensed
        (`compliance_attestation`); it is the sole producer of the fleet OSCAL
        SAR face. The gate is enforced at generation, at export (on the stored
        kind), at schedule creation, and at scheduled fire time.
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: >-
        The executive content marshals to the exact wire keys (score_pct,
        host_count, passing_rules, failing_rules, critical_issues,
        top_failing_rules, coverage - itself an object with hosts_total,
        hosts_fresh, hosts_stale, hosts_unreachable - and provenance); a
        never-evaluated fleet encodes score_pct as JSON null (not 0, not
        omitted); an explicitly empty top-failing slice serializes as []
        (never JSON null) and a populated one preserves the service's
        most-failing first order.

        Amended 2026-09-03. The key was compliance_pct, a POOLED whole
        percent: passing over every rule outcome in scope, so a host with 700
        rules outvoted one with 50, and a whole number could never equal the
        one-decimal score every other surface reports. A newly generated
        artifact MUST NOT carry compliance_pct at all. The field survives only
        as a decode-only reader for artifacts signed before this change, which
        are identified by carrying no artifact_class and are never rewritten
        (system-compliance-scoring AC-34).
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: >-
        score_pct is the equal-host mean of the in-scope hosts' scores,
        rendered to one decimal, and null (not 0) when no host produced a
        verdict, so the document distinguishes an unscanned fleet from a fully
        failing one.

        Amended 2026-09-03 with AC-01. The formula and the type both changed:
        a pooled whole percent became a nullable one-decimal equal-host mean,
        owned by internal/compliance rather than computed here
        (system-compliance-scoring C-14).
      priority: critical
      references_constraints: [C-02]
    - id: AC-03
      description: >-
        The fixed executive identity is pinned: the title "Fleet Compliance
        - Executive Summary", kind 'executive', the default (unscoped)
        scope_label "All hosts", and the small top-failing embed cap are
        stable constants the library and any later signing depend on.
      priority: high
      references_constraints: [C-03]
    - id: AC-04
      description: >-
        Generate, over seeded host_rule_state and hosts, samples the live
        posture and freezes it: passing_rules and failing_rules match the
        pass and fail row counts, critical_issues counts the failing rows
        of critical severity, score_pct is the one-decimal equal-host mean
        of the per-host scores, host_count is the active host count
        (soft-deleted hosts excluded), and top_failing_rules leads with the
        rule failing on the most hosts. The stored row carries the fixed
        title/scope/kind/format, the supplied generated_by, and a
        data_as_of at the sampling instant.
      priority: critical
      references_constraints: [C-04, C-06]
    - id: AC-05
      description: >-
        Generate over a fleet with hosts but no evaluated rule_state rows
        reports null score_pct (never scanned, not 0%), zero pass and
        fail and critical counts, the active host_count, and an empty
        (non-null) top_failing_rules list, so the document and any later
        renderer never see a JSON null slice.
      priority: high
      references_constraints: [C-01, C-02]
    - id: AC-06
      description: >-
        List returns reports newest first by created_at and an empty list
        before any generation; Get fetches the matching report by id and
        round-trips its generated_by; an unknown id returns ErrNotFound.
        Two generations yield two distinct immutable rows ordered by
        creation time (reports are never recomputed in place).
      priority: high
      references_constraints: [C-05]
    - id: AC-07
      description: >-
        v1.1.0, amended v1.19.0 - scope_label is derived from the resolved
        scope: scopeLabel({}) = "All hosts"; a framework-only scope yields
        "All hosts . <label>"; a group-only scope yields the group name; a
        group+framework scope yields "<group> . <label>". v1.19.0 (D-2 S-7,
        system-compliance-lens C-08): <label> is Kensa's label for the lens
        key (cis_rhel9 -> "CIS (RHEL 9)", nist_800_171 -> "NIST SP 800-171
        Rev 2", cmmc_l2 -> "CMMC Level 2"), an id Kensa does not know is shown
        as it is, and the empty key adds nothing. The v1.1.0 rule shortened the
        key to its first token upper-cased, so nist_800_53 and nist_800_171
        both read "NIST".
      priority: high
      references_constraints: [C-07]
    - id: AC-08
      description: >-
        v1.1.0 - A group-scoped Generate computes the posture over only the
        group's member hosts: the stored/echoed scope carries group_id and
        the group's display name, scope_label is the group name, and
        host_count plus the pass/fail/critical counts and top_failing_rules
        reflect the in-group host alone (an out-of-group host's rows do not
        inflate them). An unknown group_id returns group.ErrNotFound (which
        the handler maps to a 400 invalid-scope).
      priority: critical
      references_constraints: [C-07]
    - id: AC-09
      description: >-
        v1.1.0 - A framework-scoped Generate counts only host_rule_state
        rows whose framework_refs contain the lens key (framework_refs ?
        key): the echoed scope carries the framework, scope_label carries
        the key's label ("All hosts . CIS (RHEL 9)" for cis_rhel9, v1.19.0),
        and a critical fail tagged only to a
        different framework is excluded from passing_rules, failing_rules,
        critical_issues, and top_failing_rules.
      priority: high
      references_constraints: [C-07]
    - id: AC-10
      description: >-
        v1.2.0 - Generate freezes a coverage block. Over a fleet of a fresh
        host (a host_rule_state check within 24h, reachable), a stale host
        (a check older than 24h), and a never-scanned + unreachable host,
        coverage reads hosts_total 3, hosts_fresh 1, hosts_stale 2 (the
        old-check host plus the never-scanned host), and hosts_unreachable 1
        (the host_liveness 'unreachable' host); a host with no liveness row
        is not counted unreachable, and host_count equals coverage
        hosts_total. An all-fresh fleet reads hosts_stale 0 and an
        all-unscanned fleet reads hosts_fresh 0 / hosts_stale == hosts_total.
      priority: high
      references_constraints: [C-08]
    - id: AC-11
      description: >-
        v1.3.0 - Generate stores a content-addressed snapshot:
        content_sha256 is a 64-char hex string; two generations over an
        unchanged fleet share the same content_sha256 while being distinct
        rows (distinct ids); seeding a new failing rule (a posture change)
        before a third generation yields a different content_sha256.
      priority: high
      references_constraints: [C-09]
    - id: AC-12
      description: >-
        v1.4.0 - renderExecutivePDF emits a structurally valid, non-trivial
        PDF from a report + its executive content: the bytes start with the
        %PDF- magic header and contain the %%EOF trailer, and the document
        is a single page (bounded by construction). Pure unit test (no DB).
      priority: high
      references_constraints: [C-10]
    - id: AC-13
      description: >-
        v1.4.0 - Export serves the json face as CANONICAL content (media
        application/json) whose sha256 equals content_sha256 (v1.5.0), and
        the pdf face as a rendered application/pdf document. The first pdf
        export writes a report_faces row (status 'ready', a 64-char
        blob_sha256, size_bytes == the byte length); a second pdf export
        re-streams the identical cached bytes. An unknown face returns
        ErrInvalidFace (handler 400 reports.invalid_format) and an unknown
        id returns ErrNotFound (handler 404).
      priority: high
      references_constraints: [C-10]
    - id: AC-14
      description: >-
        v1.5.0 - The signer signs a content address (Ed25519, domain
        separated) and VerifySignature confirms it with the public key; a
        tampered content address or the wrong key fails. An empty key path
        yields an ephemeral signer (Ephemeral() true); a 32-byte seed file
        loads a stable, non-ephemeral key (same seed -> same key id); a
        wrong-size seed errors. Pure unit test.
      priority: critical
      references_constraints: [C-11]
    - id: AC-15
      description: >-
        v1.5.0 - Generate with a wired signer stores an Ed25519 signature +
        signing_key_id that verify over the snapshot's content_sha256 (and
        survive a Get round-trip); a service with no signer leaves signature
        and signing_key_id null.
      priority: critical
      references_constraints: [C-11]
    - id: AC-16
      description: >-
        v1.5.0 - End to end over the API: POST /reports:generate (host:write)
        returns a report whose wire carries content_sha256, signature
        (base64), and signing_key_id. GET /api/v1/reports/signing-key
        (host:read) returns {key_id == the report's signing_key_id,
        algorithm "ed25519", public_key (base64), ephemeral true under the
        test's per-boot key}; decoding the public key and the signature and
        reconstructing the domain-separated payload from content_sha256
        Ed25519-verifies the report's signature. An anonymous caller is
        rejected (401/403) on the signing-key endpoint.
      priority: high
      references_constraints: [C-11]
    - id: AC-17
      description: >-
        v1.6.0 - Frameworks returns the distinct framework_refs keys in the
        fleet counted by DISTINCT rule_id (not row), ordered by count desc
        then key asc. Over a seeded fleet (cis on r1 across two hosts + r3,
        stig on r2, nist on r3) it returns cis (2 distinct rules), nist (1),
        stig (1) in that order.
      priority: high
      references_constraints: [C-12]
    - id: AC-18
      description: >-
        v1.6.0 - GET /api/v1/reports/frameworks (host:read) returns 200 with
        a {frameworks:[{framework,rule_count}]} body (a non-null array, empty
        when no rules are scanned); an anonymous caller is rejected
        (401/403).
      priority: high
      references_constraints: [C-12]
    - id: AC-19
      description: >-
        v1.7.0 - Generate(kind=attestation) over a host with a completed
        scan + two scan_results (r1 cis, r2 cis+stig) produces a signed
        attestation snapshot (kind=attestation, title "Framework
        Attestation") whose AttestationContent has hosts_total 1,
        hosts_attested 1, and the frozen scan id. Its csv face is text/csv
        with the header + an r1 and r2 row, cached as a report_faces 'ready'
        row; a framework=stig-scoped attestation's csv contains r2 but not
        r1. csv is ErrInvalidFace on an executive (pdf is kind-dispatched
        and valid for both kinds, see AC-21); an unknown kind is
        ErrInvalidKind.
      priority: critical
      references_constraints: [C-13]
    - id: AC-20
      description: >-
        v1.8.0 - Export(oscal_sar) on an attestation snapshot returns
        application/json that unmarshals as an OSCAL assessment-results with
        oscal-version "1.0.6" and one result: its findings + observations
        carry one entry per (host, rule), the r1 (pass) finding state is
        "satisfied" and the r2 (fail) state "not-satisfied", and the
        reviewed controls include the framework-prefixed tokens
        (cis_rhel9_v2.0.0-1.1, cis_rhel9_v2.0.0-1.2, stig_rhel9_v2r7-V-1).
        A scan_result whose evidence is content-addressed yields exactly one
        back-matter resource with a single SHA-256 rlink hash equal to that
        evidence sha256 (no base64 inlined), and the host's observation
        references it by href (#resource-uuid). The face is cached
        (report_faces oscal_sar 'ready') and a re-export is byte-identical
        (deterministic). A framework=stig-scoped attestation's SAR has only
        the r2 finding and only the stig control token. oscal_sar is
        ErrInvalidFace on an executive report.
      priority: high
      references_constraints: [C-14]
    - id: AC-21
      description: >-
        v1.9.0 - computeAttestationRollup over two hosts (h1 r1 pass/r2 fail,
        h2 r1 fail/r2 fail) returns total 4, pass 1, fail 3, compliance 25,
        and a top-failing list led by r2 (2 failing hosts) then r1 (1); a
        framework=stig lens narrows it to total 2 / fail 2. Export(pdf) on
        the attestation returns application/pdf bytes starting with the
        %PDF magic, cached as a report_faces 'ready' row (face pdf) and
        re-served byte-identical from cache on a second export.
      priority: high
      references_constraints: [C-15]
    - id: AC-22
      description: >-
        v1.10.0 - With async rendering enabled, Generate(kind=attestation)
        leaves the three bulk faces (csv, oscal_sar, pdf) as report_faces
        rows with status 'pending' and enqueues a report.render job. After a
        RenderProcessor processes the dequeued job: every bulk face row is
        'ready', the job is 'completed', and a single eventbus.ReportReady
        event is published carrying the snapshot id, kind "attestation", the
        three rendered faces, and the generating principal.
      priority: high
      references_constraints: [C-16]
    - id: AC-23
      description: >-
        v1.12.0 - Generate(kind=exception) over a host with five waivers
        (approved+expiring-soon, approved no-expiry, requested, expired,
        revoked) produces a signed Exception Register (kind=exception, title
        "Exception Register") whose ExceptionContent summary is total 5 /
        active 2 / requested 1 / approved 2 / revoked 1 / expired 1 /
        expiring_soon 1, with five register rows. Its csv face is text/csv
        with the register header + all five rule rows; its pdf face is real
        %PDF bytes; oscal_sar is ErrInvalidFace for the exception kind.
      priority: high
      references_constraints: [C-17]
    - id: AC-24
      description: >-
        v1.13.0 - Generate(kind=remediation, period_days=30) over a host with
        five requests (executed -5d, rolled_back -10d, failed -3d, rejected
        -40d, pending -1d) produces a signed Remediation Activity (title
        "Remediation Activity") whose RemediationContent summary is total 4 /
        executed 1 / rolled_back 1 / failed 1 / rejected 0 / pending 1 (the
        -40d request is outside the 30-day window) with four activity rows
        and a ~30-day period. Its csv face is text/csv with the activity-log
        header and r1/r2/r3/r5 but not r4; its pdf face is real %PDF bytes;
        oscal_sar is ErrInvalidFace for the remediation kind.
      priority: high
      references_constraints: [C-18]
    - id: AC-25
      description: >
        The auditor-facing compliance artifact is licensed; observing your own
        posture is not. Generating a report of kind `attestation` requires the
        `compliance_attestation` feature and returns 402 without it. Exporting
        an existing attestation report is gated on the STORED report's kind, so
        a report generated while licensed does not stay exportable afterwards;
        this matters because report.FaceOSCALSAR is attestation-only, making
        that face the exact artifact being monetized. Creating a report
        schedule of kind `attestation` is gated, and the dispatcher re-checks
        the licence at FIRE time and skips rather than generating, so a lapsed
        licence stops the timer instead of minting the paid artifact
        indefinitely. Everything else stays free at every scope: the
        `executive` kind, per-scan and per-host OSCAL
        (`/scans/{id}/oscal`, `/scans/{id}/rules/{ruleId}/oscal`), the signing
        key, report listing, and report read.
      priority: critical
      references_constraints: [C-19]
    - id: AC-26
      description: >-
        v1.17.0 - Report attribution is real or absent, never invented.
        generated_by records the authenticated principal's OWN id, compared
        exactly. An anonymous caller is rejected before any artifact exists.
        An authorized request that somehow carries no principal fails and
        generates nothing, rather than recording a placeholder actor into
        content that is about to be signed. Scheduled generation is a
        separate authenticated internal path and keeps its explicit
        "scheduler" actor.

        Every case is observed AT THE PRODUCTION CALL SITE: the HTTP cases
        drive PostReportGenerate, and the scheduler case drives
        Dispatcher.Tick with a generator that captures the actor it is
        handed. Asserting against the helper, or against the constant the
        dispatcher is supposed to pass, would leave a regression at either
        call site undetected.
      priority: critical
      references_constraints: [C-06, C-11]
      inputs:
        # Each row drives one exercised case: which identity is presented,
        # through which production entry point, and what it must produce.
        cases:
          - caller: authenticated
            identity: role_principal
            through: PostReportGenerate
            expect_status: 201
            expect_actor: caller_principal_id
          - caller: anonymous
            identity: none
            through: PostReportGenerate
            expect_status: 401
            expect_actor: none
          - caller: authorized_without_principal
            identity: empty_id_with_role
            through: PostReportGenerate
            expect_status: 500
            expect_actor: none
          - caller: scheduler
            through: Dispatcher.Tick
            expect_actor: scheduler
            expect_generate_calls: 1
        forbidden_actor: system
      expected_output:
        artifacts_created_by_rejected_cases: 0
        artifacts_attributed_to_forbidden_actor: 0
    - id: AC-27
      description: >-
        v1.19.0 (D-2 S-7) - attestations scoped to nist_800_171 and to
        nist_800_53 differ in their signed content (framework is the exact key)
        and in scope_label ("All hosts . NIST SP 800-171 Rev 2", "All hosts .
        NIST 800-53") and export filename. A report whose stored scope_label is
        the pre-v1.19.0 "All hosts . NIST" keeps that label on read and in its
        export filename, its JSON face still hashes to content_sha256, and its
        signature still verifies: no artifact is relabeled or re-signed.
      priority: critical
      references_constraints: [C-07]
