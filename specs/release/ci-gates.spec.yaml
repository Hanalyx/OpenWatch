    - id: AC-14
      description: >-
        The documentation boundary is proved with `git check-ignore` over CANDIDATE paths that do not
        exist, so the answer comes from the ignore rules rather than from what happens to be tracked
        already. Three sets are driven: documentation that must be visible, root-only artifacts that
        must stay ignored at the root, and secret file names that must stay ignored at every depth
        beneath the tracked documentation tree.

        The check-ignore answer is read from the EXIT STATUS, not from whether `-v` printed a line. A
        negated pattern prints too, so a `!` rule read as a match reports the opposite of the truth.

        Two files are then PLANTED and removed under a guaranteed cleanup: a nested guide, which
        `git status --short` must see, and a private key beside it, which git must ignore. The probe
        paths and the planted paths are distinct from anything committed.

        The old unanchored patterns must not return: each is asserted absent from `.gitignore` as a
        bare line, so re-adding `*_REPORT.md` without its leading `/` fails.

        The anchored set is declared EXACTLY rather than counted or synthesized. `anchored_rules` lists
        every leading-slash rule with a concrete root probe, and the multiset read out of `.gitignore`
        must equal the multiset in the fixture: a rule deleted, a rule added without declaring it, a
        rule duplicated, and a rule de-anchored all fail, and a swap that keeps the total unchanged
        fails too. A self-derived floor could not catch any of those, which is why it is gone.

        Each root probe is still run through `git check-ignore`, so the declaration is checked against
        behavior rather than against itself.

        Nested probes carry their EXPECTED visibility rather than assuming it. Most are visible,
        which is the point of anchoring. `/dist/` is not, because a separate depth-wide rule ignores
        it everywhere and should; that exception is recorded in the fixture with its reason instead of
        being silently omitted. Every filename family anchored in `5e12c4ff` has a nested probe:
        analysis, complete, fix, implementation, phase, report, status, summary, tracking,
        verification, assessment, the test script and JSON shapes, and the screenshot names.

        Reachability is scanned over tracked contributor and workflow documentation. A line naming an
        ignored path passes only when it also says the path is unavailable, or when the exact line is
        allowlisted. Each allowlist entry must exist and must still name an ignored path, so a stale
        exemption fails rather than widening.
