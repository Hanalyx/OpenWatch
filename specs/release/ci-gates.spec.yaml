    - id: AC-15
      description: >-
        The documentation-review gate exists, blocks, and rests on candidate-bound
        evidence. `release/gates.toml` carries exactly one blocking gate whose evidence
        kind is the documentation review and which requires a human observer. The checker
        enumerates the candidate from `git ls-tree -r -z`, includes root and nested
        Markdown and the `.github`, `.claude` and `scripts` paths, and excludes
        non-Markdown, ignored and untracked files. Clean matching evidence passes. Each of
        these fails with a diagnostic naming the cause: a document added, removed or
        edited since the review; a duplicated blob that cannot be called a rename; a wrong
        tag, commit, artifact digest, stored blob or manifest digest; an agent identity; a
        verdict that is not `accurate`; and a missing, extra, duplicate or malformed
        reviewed entry. A stale attestation whose filename sorts later does not hide a
        valid candidate-bound one, and two that both bind are reported as ambiguous. A
        tracked path that is not valid UTF-8 is an ERROR. Every top-level scalar the
        evaluator reads is type-checked, an identity that is empty or whitespace-only is
        refused, the `-agent` test applies to the TRIMMED identity so trailing whitespace
        cannot carry an agent past it, and a malformed scalar type produces a verdict
        rather than a traceback. The skeleton generator leaves every verdict `pending`,
        writes no human identity, and escapes every control character TOML forbids, so a
        path Git permits round-trips through `tomllib` unchanged.

        THE TRACKED RUNBOOK IS PART OF THIS CONTRACT. `docs/runbooks/RELEASING.md` MUST
        carry the D1 procedure, and it MUST invoke the real
        `scripts/doc-review-skeleton.py` and `scripts/release-status.py` rather than
        describe them. It MUST resolve the candidate commit explicitly from the tag
        (`git rev-list -n 1`) and generate the skeleton for that commit, never for a
        branch name or for whatever HEAD happens to be. It MUST keep the attestation
        untracked while the decision is open and commit it only after publication, so
        the audit commit cannot change what was released. The GA stage MUST cut its tag
        with the same version-derived block as a candidate, from the final-version
        commit, and MUST publish through `scripts/release-publish.py` rather than by
        any command that could rebuild or re-upload (C-14). Removing the skeleton
        command, the explicit commit resolution, or the publish-script invocation MUST
        fail.
      priority: critical
      references_constraints: [C-11]
    - id: AC-16
      description: >-
        The production Go-relevance filter in `.github/workflows/go-ci.yml` selects the validating
        path for a pin-only change. The test extracts the `grep -qE` pattern from the "Detect
        Go-relevant changes" step, compiles that pattern and no other, and asserts that a change
        set consisting solely of `.specter-version` matches, that one consisting solely of
        `.doc-style-version` matches, and that a documentation-only change such as `README.md`
        does not. The pattern is anchored at line start, as `grep` applies it. Removing either pin
        file from the production filter MUST fail this criterion.
      priority: critical
      references_constraints: [C-12]
    - id: AC-17
      description: >-
        The fixture-isolation helper places its copy outside the repository. A copy made from the
        repository root resolves to a path that is not beneath that root, carries `go.mod` and the
        requested directories at their relative paths, and a file planted in the copy does not
        appear in the checkout. Bound in the helper's own tests, so a change that moved the copy
        inside the tree would fail before any guard depended on it.
      priority: high
      references_constraints: [C-13]
    - id: AC-18
      description: >-
        `release.yml` drafts a GA candidate, publishes a pre-release at once, and refuses to
        rebuild. The publish step's `draft` input is true exactly when the tag carries no
        pre-release hyphen and `prerelease` is true exactly when it does. A step that runs
        `packaging/check-no-existing-release.sh` precedes the package build. Run with a
        stubbed `gh`, that script exits 0 when no release names the tag or the release
        carries no assets, exits non-zero when a draft or a published release already
        carries assets, and exits non-zero when the release list cannot be read.
      priority: critical
      references_constraints: [C-14]
    - id: AC-19
      description: >-
        The evaluator verifies a draft's bytes. A draft release is found through the
        releases listing and its state is reported. With every asset downloaded and hashed,
        matching bytes PASS; one changed byte FAILs naming the asset; a manifested asset
        absent from the release FAILs; a package or SBOM on the release but absent from the
        manifest FAILs; an unreadable manifest is ERROR; no release is MISSING. The
        signature check reads gpg's machine status: GOODSIG by a key in `security/KEYS`
        passes naming the signer; BADSIG, NO_PUBKEY, an expired or revoked key, and a zero
        exit without GOODSIG each FAIL; a missing `SHA256SUMS.asc` FAILs before any
        download. A real detached signature made with a throwaway key verifies against
        that key's export and fails after the manifest is tampered.
      priority: critical
      references_constraints: [C-14]
    - id: AC-20
      description: >-
        Publication is the flip and nothing else. With the evaluator's GitHub access
        replaced by an in-memory release: no release, an already published release, and
        a NO-GO verdict are each refused with nothing changed, `--yes` included; a dry run
        flips nothing; GO with `--yes` issues exactly one request carrying only
        `draft=false`, after which the same asset ids are public; an asset or manifest
        replaced between the verdict and the flip is refused with the draft intact; a
        change observed after the flip is reported as a distinct CHANGED outcome, not as
        success; and no call the script makes uploads, deletes or dispatches a workflow.
      priority: critical
      references_constraints: [C-14]
    - id: AC-21
      description: >-
        Nothing is inherited. A release candidate's documentation review and fleet
        attestations evaluate STALE against the GA tag, commit and digests; a GA
        candidate's own review and attestations evaluate STALE against a replacement
        candidate's commit and digests; and the evaluator's source carries no promotion
        flag, inherited-verdict field or carry-forward function.
      priority: critical
      references_constraints: [C-14]
