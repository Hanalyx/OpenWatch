spec:
  id: release-ci-gates
  title: CI quality + security gates
  version: "1.17.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Mandatory pre-merge gates
    description: >
      Every PR against the Go rebuild must pass a fixed set of gates
      before merge: format/vet, lint (staticcheck + gosec + others via
      golangci-lint), known-CVE scan (govulncheck), race-detector test
      suite, and full Specter strict coverage. The gates live in the
      Makefile so they're runnable locally and in CI so they block
      merges. A single `make check` target chains them so contributors
      have one command to run before pushing.
    related_specs:
      - release-stage-0-signoff
      - system-correlation

  objective:
    summary: >
      Make quality and security gates the same shape locally and in CI,
      so "passes on my machine" implies "passes on main." Tool drift
      between developer machines and CI is the failure mode that this
      spec exists to prevent.
    scope:
      includes:
        - "Makefile targets: vet, lint, vuln, test-race, check"
        - GitHub Actions workflow scoped to app/** with the same gates
        - A spec-and-test contract on each gate
      excludes:
        - Test coverage minimums (handled by Specter strict mode)
        - Mutation testing
        - Container image scanning (Stage 2 when we ship containers)

  constraints:
    - id: C-01
      description: make vet MUST invoke `go vet ./...` and exit non-zero on any suspicious-construct finding
      type: technical
      enforcement: error
    - id: C-02
      description: make lint MUST invoke golangci-lint with staticcheck + gosec + govet + ineffassign + unused + errcheck + revive + forbidigo enabled
      type: technical
      enforcement: error
    - id: C-03
      description: make vuln MUST invoke govulncheck ./... and exit non-zero on any known CVE in dependencies or the standard library that is reachable from openwatch's call graph
      type: security
      enforcement: error
    - id: C-04
      description: make test-race MUST invoke `go test -race ./...` and exit non-zero on any detected data race
      type: security
      enforcement: error
    - id: C-05
      description: make check MUST chain vet → lint → vuln → test-race in that order; first failure aborts the chain
      type: technical
      enforcement: error
    - id: C-06
      description: GitHub Actions workflow .github/workflows/go-ci.yml MUST run on every PR/push to main (no paths filter) and produce the "Quality + security gates" status check. For changes touching app/** it MUST execute make check + specter sync against a Postgres service container; for changes that do not touch app/** the job MUST short-circuit to success so the required status check is always present
      type: technical
      enforcement: error

    - id: C-07
      description: >-
        The Specter gate MUST pin an exact version in ONE tracked file, MUST reject every ERROR and WARNING
        annotation diagnostic, and MUST be the SAME implementation locally and in CI. Info diagnostics are
        not blocking.

        Severity is not a safe filter for the rest: v0.15 leaves unreachable_annotation_unknown at warning,
        and `specter check --test` exits 0 with warnings present, so a gate keyed on the exit code or on
        --strict alone passes with an annotation that names no reachable test. The exit status MUST still
        be checked alongside the reported counts, because a run that fails while printing a zeroed summary
        would otherwise be read as clean.

        Structural coverage MUST stay at 100% and outcome coverage MUST stay at the manifest threshold with
        every tier at 100.
      type: technical
      enforcement: error
    - id: C-08
      description: >-
        The documentation style gate MUST be ONE shared invocation behind a single Make target, and that
        SAME target MUST run locally, in pre-commit, and in CI. A caller that rebuilds the command itself
        is a second policy wearing the first one's name.

        The gate MUST check every tracked file of a type the checker supports, not only the files
        `--changed` selects. `--changed` resolves a commit RANGE, `{base}...HEAD`, and falls back to the
        index only when that range is empty, so it never reads the working tree. A pre-commit hook keyed on
        it is vacuous at exactly the moment it is supposed to fire: the files being committed are the files
        it cannot see. This is not hypothetical. A `--changed` run reported 182 files clean while eleven
        edited files carrying a real violation sat unread (Context Plane bugs/OW-027, upstream SP-HP-030).

        The checker supports fifteen tracked extensions, source comments included, so the gate is not a
        Markdown gate and MUST NOT be described as one.

        The checker is a SHARED tool, refetched whole on an upgrade, so the gate MUST pin the adopted
        version in ONE tracked file and MUST compare it against the version the checker reports BEFORE
        scanning anything. A missing, empty, malformed or mismatched pin MUST fail, never skip. No caller
        may repeat the version: a second literal is a second source of truth, and the one comment that
        carried a version named a release two behind what was running, while four already-fixed defects
        stayed live here for a month.

        Scope boundary, stated so it is not mistaken for coverage: files git ignores are outside this gate.
        That includes the 18 extensionless roadmap documents under docs/engineering/roadmap, which the
        checker cannot select because it walks tracked paths by extension. They remain taxonomy debt in the
        Context Plane inventory and are NOT enforced by CI.

        A reading-level exemption MAY cap a named file that is not continuous prose, and MUST cap ONLY that
        file and ONLY the reading level. Every other rule stays binding inside an exempt file, and no other
        path inherits its cap.
      type: technical
      enforcement: error
    - id: C-09
      description: >-
        The shipped compliance-score semantics and the report-verification trust boundary MUST be
        documented in TRACKED, reachable operator documentation, and those statements MUST be
        testable against the published files rather than reviewed by reading.

        Scoring. The published text MUST state that score_pct is nullable and that absence means no
        rule produced a pass or fail verdict, which is not zero; that a genuine zero is a scored
        result; that the formula is passing over passing plus failing, so a skipped, inapplicable or
        errored rule enters neither side; that coverage is a separate axis carrying exactly the three
        contract statuses, with a percentage only under available; that a fleet or group score is an
        equal-host mean over scored hosts and never a pooled rule-row ratio, with unscored hosts
        excluded from the mean but still counted in participation; and that a mixed-formula day has
        no score and yields no delta, comparison or direction. Legacy compliance_pct and current
        score_pct MUST be described as not comparable. The complete envelope stays in OpenAPI; the
        guides MUST refer to it rather than duplicate evolving provenance fields.

        Verification. A TRACKED operator procedure MUST exist, be reachable from the documentation
        index, and be based on the current canonical JSON export. It MUST verify that the canonical
        bytes hash to content_sha256 and that the Ed25519 signature covers the domain-separated
        payload the approved contract defines, NOT the report bytes. It MUST name
        /api/v1/reports/signing-key and MUST NOT name the obsolete plural endpoint. It MUST state
        that a key fetched from the server that served the report proves internal consistency only,
        and that authenticity requires a TRUST ANCHOR obtained through an independently trusted
        channel. That anchor is the complete base64 public key, or the lowercase hex SHA-256 of the
        decoded 32-byte key. The short key_id and signing_key_id are 64-bit CORRELATION identifiers
        and MUST NOT be published as the value an operator compares to establish authenticity
        (api-reports C-11). Ephemeral keys and unsigned artifacts MUST be described accurately, and
        a committed example key MUST be labeled test-only, with its private seed described as
        derivable rather than secret.

        Every command in that procedure MUST be exercised against a PRODUCTION-GENERATED artifact.
        A hand-built fixture proves the example agrees with itself, which is the one thing nobody
        needs to know.
      type: technical
      enforcement: error
    - id: C-10
      description: >-
        The tracked documentation boundary MUST be reliable in both directions, and MUST be provable
        against candidate paths rather than against the files that happen to exist.

        VISIBILITY. A `.gitignore` pattern written for a repository-root artifact MUST be anchored
        with a leading `/`. Unanchored, it matches by BASENAME at every depth, so it hides files under
        docs/guides, docs/runbooks and docs/images without saying so; `git status` reports nothing
        about an ignored path. Seventy-four such patterns were anchored on 2026-09-11, among them the
        working-document families (`*_REPORT.md`, `*_SUMMARY.md`, `*_STATUS.md`, `*_VERIFICATION*.md`
        and nine more), the screenshot families, and `examples/`.

        SECURITY. Patterns that protect key material and credentials MUST stay UNANCHORED, so they
        keep matching at every depth INCLUDING inside tracked documentation. A per-file or per-
        directory re-include under docs MUST NOT be used to work around a naming collision: a
        `!docs/guides/examples/**` negation added on 2026-09-11 un-ignored `*private_key*`,
        `*credential*`, `*api_key*`, `*passwd*`, `*secret*` and `**/*.key` beneath that directory, so
        a private key dropped there would have been staged without complaint. Anchor the colliding
        pattern instead.

        REACHABILITY. Tracked contributor and workflow documentation MUST cite only paths a reader
        can open, or an explicitly named Context Plane record. Where an ignored path is named, the
        line MUST say it is unavailable. Pointing a reader at a gitignored file is a dead end that
        looks like a reference, and `docs/engineering/install_guide.md` was cited that way from the
        workflow README for months.
      type: technical
      enforcement: error
    - id: C-11
      description: >-
        A release candidate MUST carry a DOCUMENTATION REVIEW attestation bound to that
        candidate, and the gate MUST be blocking.

        SCOPE IS A PATH RULE. Every tracked blob whose path ends in `.md` at the candidate
        commit is in scope. There are NO directory exclusions: `.github`, `.claude` and
        `scripts/README.md` are documentation a reader can reach, so they are reviewed like
        any other. NO CORPUS COUNT APPEARS IN THIS CONTRACT. A count is a reading of one
        commit that has to be edited on every addition and fails nothing when it is not.
        Counts belong in a generated skeleton and in the checker's own result line, where
        they are derived from the tree in hand.

        ENUMERATION IS FROM THE COMMIT. `git ls-tree -r -z <commit>`, filtered to blob
        entries whose path ends in the exact suffix `.md`, with raw path BYTES preserved
        through sorting. Not the working tree and not the index, because neither is what
        ships. A path that is not valid UTF-8 MUST fail with a clear ERROR rather than be
        mangled: a TOML string is UTF-8, so such a path cannot be written into an
        attestation and read back as itself.

        THE ATTESTATION MUST CARRY kind, tag, commit, artifact identity and digest, human
        identity and date, docs_sha256, and reviewed entries. Each reviewed entry carries
        EXACTLY path, blob and verdict. Every verdict MUST be `accurate`; a defect or any
        other value is NO-GO, because no waiver mechanism is approved and a gate that
        accepts a recorded defect is a gate that records defects rather than one that
        stops them.

        THE REVIEW MUST DESCRIBE THIS TREE. The reviewed set MUST equal the candidate set
        exactly, with no missing, extra or duplicate path, and the stored blob for every
        path MUST equal the candidate's. Canonical bytes are `path NUL blob NUL verdict
        NUL` ordered by raw path bytes, and docs_sha256 over those bytes MUST be recomputed
        and compared. NUL delimiting rather than newline because a newline is legal in a
        git path, and a newline-delimited manifest cannot tell one path containing a
        newline from two paths.

        BINDING IS TO THE CANDIDATE ON THREE AXES: attested tag, attested commit, and an
        artifact digest present in the SHA256SUMS on the candidate's release, draft or
        published. Freshness here
        means reviewed against THESE bytes, never reviewed recently.

        SELECTION IS BY BINDING, NEVER BY FILENAME ORDER. Where several documentation
        attestations exist, the one that binds to this candidate is the evidence, so a
        stale file whose name sorts later cannot hide a valid one. Two attestations binding
        to the same candidate are an ambiguity to REPORT, not a tie to break.

        DIAGNOSTICS MUST NAME added, removed and edited paths. A rename MAY be reported
        ONLY for an unambiguous one-to-one identical-blob move; anything else stays an add
        plus a remove, because a blob appearing twice cannot say which path became which.
        Missing or unreadable candidate inputs MUST fail closed.

        A HUMAN MUST ATTEST, AND MUST BE NAMED. `performed_by` and `artifact` MUST be
        nonempty, an identity ending in `-agent` is refused, and `performed_at` MUST be a
        valid ISO calendar date that is not in the future. `artifact` and
        `artifact_sha256` are ONE fact and MUST match as an exact pair in the candidate's
        SHA256SUMS, at selection as well as at final evaluation: a digest present under a
        different filename means the reviewer held an artifact other than the one they
        named. An unreadable SHA256SUMS MUST return ERROR through the whole selection
        path, never STALE, because nothing could be compared rather than the evidence
        describing another candidate. A generator MAY produce an unsigned skeleton with
        every verdict `pending`, and MUST NOT fill in a human identity or a verdict.

        THE GATE MUST CITE THIS CONTRACT. The gate entry MUST carry `spec` and `ac`
        naming the criterion it rests on, so a reader of `release/gates.toml` can reach
        the rule and a reader of the rule can find its gate.
      type: technical
      enforcement: error
    - id: C-12
      description: >-
        A change to a PINNED GATE VERSION FILE MUST select the CI path that validates the pin.

        Two tracked files pin the version of a gate this contract depends on: `.specter-version`
        (C-07, AC-11) and `.doc-style-version` (C-08, AC-12). Each pin is asserted against its
        contract fixture by `packaging/tests`, which runs inside the Go suite. The Go CI job selects
        that suite with a job-level path filter, and a change that matches nothing in the filter
        skips the suite and reports success.

        On 2026-09-14 a pull request that changed only `.specter-version` reported "Quality +
        security gates" green in 32 seconds, having skipped 19 of 26 steps including
        `go test -race ./...`, and merged with the fixture still naming the previous version.
        `main` was red on AC-11 from that merge until this repair. The workflow-level `on:` block
        carries no `paths` filter, so the job always starts; the job-level step is the ONLY
        selection point, and it is the one this constraint governs.

        Both pin files MUST match the production filter. A regression test MUST read that filter
        out of the workflow file itself and prove a pin-only change selects the validating path,
        so that removing either pin from the filter fails the test. The test MUST NOT carry its own
        copy of the filter: a duplicate can pass while the real one drifts, which is the failure
        this constraint exists to prevent.
      type: technical
      enforcement: error
    - id: C-13
      description: >-
        A test MUST NOT write a fixture into the checkout. The Go suite runs its packages in
        parallel, and any test that walks the repository can list a file another test planted
        and then fail to open it once it is removed. That is not hypothetical: a
        documentation-only pull request with zero Go files went red on 2026-09-14 when the
        retention sweeper guard's tree walk raced a fixture the skip-reason guard had planted in
        `internal/compliance/` (CP bugs/OW-036).

        A guard that must prove its detector can see a planted reader plants it in a PRIVATE COPY
        under `t.TempDir()`, outside the repository, and runs the detector against the copy. The
        clean scan still runs against the real tree; the copy is only for the mutation. The walker
        is NOT changed to tolerate a vanished file, because that would hide the next test that
        writes into the tree instead of surfacing it.
      type: technical
      enforcement: error
    - id: C-14
      description: >-
        A GA release is a DISTINCT final-version commit, built ONCE into a DRAFT, verified as
        a whole against that exact build, and published without rebuilding. Decided by the
        founder on 2026-09-14 for v0.8 (option C in CP bugs/OW-037): a commit carrying
        `X.Y.Z-rc.N` cannot satisfy a `vX.Y.Z` tag (release-package-build C-14), so GA is a
        new commit, and a new commit and new artifacts carry NO evidence forward. Nothing is
        inherited from any release candidate: no promotion flag, no carried verdict, no
        per-blob reuse of a documentation review.

        THE FINAL-VERSION COMMIT sets `VERSION="X.Y.Z"` in `packaging/version.env`, the README
        version phrase and the newest CHANGELOG heading `[X.Y.Z] <codename> (<date>)`, where
        the date is the INTENDED PUBLICATION DATE, and is prepared through review and merged.
        The tag is cut from it by the same version-derived block a candidate uses.

        BUILT ONCE INTO A DRAFT. For a bare tag `release.yml` MUST publish the assets into a
        draft release, and MUST REFUSE TO BUILD any tag for which a release, draft or
        published, already carries assets, so no re-run or dispatch can replace the bytes
        the evidence describes while the tag looks unchanged.

        VERIFIED AGAINST THOSE BYTES. The evaluator MUST read the draft (the releases list,
        because the tag endpoint never returns a draft), MUST download every asset the
        manifest names and hash it against SHA256SUMS, MUST report a package or SBOM on the
        release that the manifest omits, and MUST verify SHA256SUMS.asc against
        `security/KEYS` in a throwaway keyring, reading only gpg's machine status. Fresh
        F1, F2, F3, H1 and a full D1 are performed by the founder against the GA tag, commit
        and digests. The evaluator MUST report the release state (draft, pre-release,
        published) with its verdict.

        PUBLISHED ONLY ON GO AND ONLY BY THE FLIP. `scripts/release-publish.py` MUST refuse
        unless the release exists, is a draft and carries assets; MUST refuse on any verdict
        but GO; MUST record every asset id, name and size and the manifest bytes; MUST
        re-read and refuse if any of that changed; MUST change nothing but the `draft` flag;
        and MUST re-read afterward and report, as a distinct outcome, a published release
        that differs from what was verified. It MUST NOT upload, delete, rename, rebuild or
        tag. Running it with `--yes` is the founder's separate authorization, and GO is a
        precondition of it, not a substitute for it.

        A CHANGED CANDIDATE INVALIDATES ITS EVIDENCE. Any change to the commit the tag names
        or to any asset makes every attestation naming the old commit or old digests STALE,
        by the existing binding rules. A changed intended publication date is such a
        change. An unpublished GA candidate is REPLACED, never patched in place: the draft
        is deleted, its tag is deleted (nothing was ever published under it), a new
        final-version commit is prepared through review, and the tag is cut again. A
        published release is never rebuilt.
      type: technical
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: make vet target exists and runs `go vet ./...` against the full module.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: make lint target exists and runs golangci-lint; the lint config enables staticcheck, gosec, govet, errcheck, unused, ineffassign, revive, and forbidigo.
      priority: critical
      references_constraints: [C-02]
    - id: AC-03
      description: make vuln target exists and runs govulncheck ./...; auto-installs govulncheck via `go install` if absent.
      priority: critical
      references_constraints: [C-03]
    - id: AC-04
      description: make test-race target exists and runs `go test -race ./...`.
      priority: critical
      references_constraints: [C-04]
    - id: AC-05
      description: make check target chains vet, lint, vuln, test-race in that exact order; depends on each as prerequisites so any failure aborts the chain.
      priority: critical
      references_constraints: [C-05]
    - id: AC-06
      description: make help lists every gate target (vet, lint, vuln, test-race, check) with one-line descriptions so contributors discover them without reading the Makefile.
      priority: high
    - id: AC-07
      description: .github/workflows/go-ci.yml exists, triggers on every PR/push to main without a paths filter, references the Go source paths (cmd/, internal/, ...) in a path-detection step, and gates the heavy gate steps (Go setup, lint, vuln, the race+coverage test run, specter) on that step so non-Go PRs short-circuit to success while still reporting the required "Quality + security gates" status check.
      priority: critical
      references_constraints: [C-06]
    - id: AC-08
      description: The workflow defines a Postgres service container with the same credentials and DB name the test suite expects.
      priority: critical
      references_constraints: [C-06]
    - id: AC-09
      description: The workflow executes (in order) make vet, make lint, make vuln, a single race-detector + JSON test run (`go test -race -json`, which both detects data races and feeds specter ingest — replacing the former separate `make test-race` + non-race json passes), and specter sync — each as its own step so a failure pinpoints which gate broke.
      priority: critical
      references_constraints: [C-06]
    - id: AC-10
      description: The workflow runs on both push to main and pull_request targeting main; uses `set -e` semantics so any step's non-zero exit fails the job.
      priority: high
    - id: AC-11
      description: >-
        One shared gate enforces the Specter contract, and `make spec-check` and the workflow both invoke it,
        so the two cannot drift into different policies. The gate reads the pinned version from a single
        tracked file, refuses to run against any other Specter build, fails on a NONZERO WARNING COUNT as
        well as on errors, and asserts 100% structural coverage.

        It reads the JSON summary AND the process exit code, because neither alone is sufficient.
        `specter check --test` returned 0 against 277 warnings on this tree, of which 232 were reachability
        and 45 were domain-tier conflicts; `--strict` promoted 175 of those 277 to errors and left the 102
        unreachable_annotation_unknown at warning. A gate reading only the exit code passes the first case,
        and a gate reading only the summary passes a failed run that prints zeroed counters.

        The gate prints the diagnostics it rejected. A gate that reports only a count tells a reader that
        something is wrong without telling them what.

        It also checks the exit status, not only the summary, and both callers invoke it under `python3 -S`
        so that its standard-library-only claim is enforced rather than asserted. The workflow DERIVES the
        version from the pin file instead of declaring its own copy: comparing two literals detects drift
        but still leaves two places to edit.
      inputs:
        pin_file: .specter-version
        pinned_version: 0.15.1
        shared_gate: scripts/specter-gate.py
        # Each caller names the file inspected and the exact invocation it must
        # contain, so the fixture drives the check instead of describing it.
        callers:
          - path: Makefile
            invocation: 'python3 -S scripts/specter-gate.py'
            kind: recipe
          - path: .github/workflows/go-ci.yml
            invocation: 'python3 -S scripts/specter-gate.py'
            kind: run_step
        # The policy is severity-based and deliberately KIND-INDEPENDENT: any
        # error or warning fails, whatever its kind. An earlier fixture listed
        # four kinds, which read like a contract and drove nothing.
        rejected_severities:
          - error
          - warning
        nonblocking_severities:
          - info
        structural_coverage_pct: 100
        # A caller must run the WHOLE gate. `--only` exists so the gate's own
        # guards can drive one stage against a stubbed specter; a caller using
        # it would be running a subset and calling it the gate.
        forbidden_in_callers: '--only'
      expected_output:
        both_callers_invoke_the_same_gate: true
        gate_reads_the_json_summary: true
        warnings_are_rejected_not_only_errors: true
        version_pin_is_read_from_one_file: true
        diagnostics_are_printed_not_just_counted: true
        exit_status_is_checked_alongside_the_summary: true
        gate_runs_with_site_packages_disabled: true
      priority: critical
      references_constraints: [C-07]
    - id: AC-12
      description: >-
        One shared documentation style gate exists as a Make target, and the Makefile, the CI workflow and
        the pre-commit configuration all reach the full tracked tree through it. The target checks every
        tracked supported file by default, so no caller has to remember a flag to get the real gate.

        Each caller is bound to the target rather than to a copy of its command: the workflow runs the Make
        target instead of reconstructing the checker invocation, and the pre-commit hook runs it with
        `pass_filenames: false` so a staged-file list cannot narrow it back down to the vacuous case.

        Every invocation uses `python3 -S`, so the checker's standard-library-only claim is enforced rather
        than asserted, the same way the Specter gate is.

        The binding is behavioral, not textual. The gate is exercised against a throwaway Git repository
        holding a clean tracked file, a tracked violation nobody is editing, a newly staged violation, and a
        violation inside a source-code comment. The tracked violation nobody is editing is the case that
        separates this gate from the old one: `--changed` passes it and `--all` does not.

        The version pin is bound against a COPY of the gate rather than by reading its source: the pin
        missing, empty, malformed, or naming a version the checker does not report must each fail, and the
        passing case must fail when either side is changed alone. No caller may carry the version, checked
        over code lines with comments stripped, because every caller explains the pin in prose.

        Key identity is bound by DERIVATION. The identifier is `ed25519-` plus the first 16 lowercase
        hex characters of SHA-256 over the decoded 32-byte key, and both the key response's key_id and
        the report's signing_key_id must equal it. Comparing the two published values with each other
        is not sufficient and is tested as insufficient: a bundle carrying the SAME fabricated
        identifier in both places must fail.

        The signed and unsigned states are bound as a PAIR. signature and signing_key_id are both
        present or both absent; one without the other is malformed metadata and fails distinctly from
        both. An unsigned artifact must verify with the report and its metadata alone, reaching the
        unsigned exit rather than a usage error or a missing-file error, and a signed one must still
        require the key.

        The reading-level exemption is bound as a SCOPE, not as a value. The exempt form passes at its
        recorded cap; prose of the same grade at any other path fails; and an em dash, an emoji, AI speak
        or a British spelling inside the exempt file still fails, because the cap covers the reading level
        and nothing else.
      inputs:
        checker: scripts/check-doc-style.py
        shared_gate: scripts/doc-style-gate.py
        pin_file: .doc-style-version
        pinned_version: '6'
        make_target: docs-style
        precommit_hook_id: doc-style
        default_mode: '--all'
        interpreter_flag: '-S'
        # The exempt file and its cap, so the guard drives on the fixture rather
        # than on a literal copied into the test.
        reading_exempt_path: .github/pull_request_template.md
        reading_exempt_cap: '12.1'
        callers:
          - path: Makefile
            invocation: 'python3 -S scripts/doc-style-gate.py'
            kind: recipe
          - path: .github/workflows/go-ci.yml
            invocation: 'make docs-style'
            kind: run_step
          - path: .pre-commit-config.yaml
            invocation: 'make docs-style'
            kind: hook
        # The mode the gate must NOT fall back to. Named so the check drives on
        # it instead of describing it.
        forbidden_in_callers: '--changed'
        # Ignored paths are out of scope by construction, not by oversight.
        excluded_from_gate: docs/engineering/roadmap
      expected_output:
        every_caller_reaches_the_same_make_target: true
        default_mode_is_the_full_tracked_tree: true
        precommit_hook_ignores_passed_filenames: true
        pin_is_read_from_one_file: true
        checker_version_is_compared_before_scanning: true
        no_caller_repeats_the_version: true
        exemption_is_reading_level_only: true
        unchanged_tracked_violation_is_caught: true
        staged_violation_is_caught: true
        source_comment_violation_is_caught: true
        clean_tree_passes: true
        gate_runs_with_site_packages_disabled: true
      priority: critical
      references_constraints: [C-08]
    - id: AC-13
      description: >-
        The score semantics and the verification trust boundary are published, tracked and reachable,
        and the published procedure is executed rather than read.

        The example script is run against an artifact produced by the report service's own Generate
        and Export calls, and it passes. Then each input is mutated independently and each must fail
        for its own reason: the content, the declared hash, the signature, the payload prefix, and the
        trusted key. The payload mutations include the two shapes a reader is most likely to try,
        the bare hash with no domain tag and the canonical JSON itself, because a procedure that
        accepted either would be verifying something other than what was signed.

        The scan set is DISCOVERED from directory ROOTS, not from a hand-maintained list of path globs.
        The earlier list named `docs/*.md`, `docs/guides/*.md` and `docs/guides/runbooks/*.md`, and it
        omitted `docs/runbooks/` entirely, so `RELEASING.md` was never scanned and the documents
        moved into that directory would have left the scan silently while the gate stayed green.

        The defect was the MISSING ROOT, not the glob depth. A plain git pathspec `*` matches `/`, so
        those globs already recursed; only `:(glob)` magic limits a pathspec to one level. Both
        properties are bound below, because either can break the scan: a root that is not listed, and a
        walk that stops at depth one.

        Today's document count is NOT the guard. A count changes for legitimate reasons and would have
        to be edited on every move, which makes it an editing chore rather than a check.

        Required statements are matched in the published files. Forbidden claims are matched over EVERY
        line, with no negation heuristic: a line that reads as a forbidden claim fails unless it is
        allowlisted by exact path and exact text. Each allowlist entry must EXIST in its file and must
        itself match a forbidden pattern, so an exemption that outlived the sentence it covered fails
        instead of sitting there. The earlier negation skip was removed because it excused any line
        carrying a negation word, including one that denied a claim in its first half and made a
        stronger one in its second.
      inputs:
        # Recursive roots. Every tracked Markdown document beneath these is
        # scanned, at any depth.
        scan_roots:
          - docs/guides
          - docs/runbooks
        scan_index: docs/README.md
        # Named members the discovered set must contain. RELEASING.md is listed
        # because dropping the second root would otherwise go unnoticed.
        required_members:
          - docs/README.md
          - docs/runbooks/RELEASING.md
        # Planted behaviorally, with intent-to-add so tracked-file discovery
        # sees them, then removed. A nested document proves recursion; a claim
        # in each root proves both roots are actually scanned.
        nested_probe: docs/runbooks/examples/ac13-probe/NESTED_GUIDE.md
        claim_probes:
          - docs/guides/ac13-claim-probe.md
          - docs/runbooks/ac13-claim-probe.md
        claim_probe_text: 'Fetching the signing-key endpoint proves authenticity of the report.'
        verification_guide: docs/runbooks/REPORT_VERIFICATION.md
        scoring_guide: docs/guides/SCANNING_AND_COMPLIANCE.md
        api_guide: docs/guides/API_GUIDE.md
        index: docs/README.md
        example_script: docs/runbooks/examples/report-verification/verify.sh
        fixture_dir: docs/runbooks/examples/report-verification
        counterexample_dir: docs/runbooks/examples/report-verification/counterexample
        unsigned_dir: docs/runbooks/examples/report-verification/unsigned
        trusted_anchor_file: docs/runbooks/examples/report-verification/trusted-key.sha256
        signing_key_file: signing-key.json
        # The exact shape of the published key document. Enforced field by
        # field because this file is the one excluded from secret scanning.
        signing_key_fields:
          - key_id
          - algorithm
          - public_key
          - ephemeral
        signing_key_algorithm: ed25519
        signing_key_bytes: 32
        key_id_prefix: ed25519-
        # key_id is `ed25519-` plus the first 16 lowercase hex characters of
        # SHA-256 over the decoded public key. Stated here so the test DERIVES
        # it rather than trusting the published value.
        key_id_hex_chars: 16
        signing_key_endpoint: /api/v1/reports/signing-key
        obsolete_endpoint: /api/signing/public-keys
        signing_domain: 'openwatch/report-snapshot/v1'
        coverage_statuses:
          - available
          - unavailable_unclassified_skips
          - unavailable_no_outcomes
        # Each entry names the file and a literal that must appear in it, so the
        # fixture drives the check instead of describing it.
        required_statements:
          - doc: scoring_guide
            contains: 'passing / (passing + failing)'
          - doc: scoring_guide
            contains: 'A missing score is not a zero'
          - doc: scoring_guide
            contains: 'equal-host mean'
          - doc: scoring_guide
            contains: 'not comparable'
          - doc: scoring_guide
            contains: 'A mixed day carries no score'
          - doc: api_guide
            contains: 'Do not coerce `null` to `0`'
          - doc: verification_guide
            contains: 'proves consistency, not authenticity'
          - doc: verification_guide
            contains: 'independently trusted'
          - doc: verification_guide
            contains: 'correlation identifiers, not anchors'
          - doc: verification_guide
            contains: 'test-only, and its private half is'
        forbidden_claims:
          - id: absent_score_is_zero
            pattern: '(?i)(missing|absent|no)\s+score[^.\n]{0,40}\b(is|as|equals?)\b[^.\n]{0,12}\b(0|zero)\b'
          - id: skipped_counts_as_failure
            pattern: '(?i)skipped[^.\n]{0,60}(count|treated|scored)[^.\n]{0,20}(as|toward)[^.\n]{0,20}fail'
          - id: old_pooled_formula
            pattern: 'passed_rules\s*/\s*total_rules'
          - id: pooled_fleet_arithmetic
            pattern: '(?i)pooled[^.\n]{0,30}(fleet|aggregate|score)'
          - id: same_server_key_proves_authenticity
            pattern: '(?i)signing-key[^.\n]{0,60}(proves|confirms|establishes)[^.\n]{0,20}authentic'
          - id: obsolete_signing_endpoint
            pattern: '/api/signing/public-keys'
          - id: key_id_as_authenticity_anchor
            pattern: '(?i)(\bkey_?id\b[^.\n]{0,70}\b(fingerprint|anchors?|authenticity|authentic)\b|\b(fingerprint|anchors?|authenticity)\b[^.\n]{0,70}\bkey_?id\b)'
