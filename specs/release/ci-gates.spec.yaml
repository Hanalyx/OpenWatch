spec:
  id: release-ci-gates
  title: CI quality + security gates
  version: "1.2.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Mandatory pre-merge gates
    description: >
      Every PR against the Go rebuild must pass a fixed set of gates
      before merge: format/vet, lint (staticcheck + gosec + others via
      golangci-lint), known-CVE scan (govulncheck), race-detector test
      suite, and full Specter strict coverage. The gates live in the
      Makefile so they're runnable locally and in CI so they block
      merges. A single `make check` target chains them so contributors
      have one command to run before pushing.
    related_specs:
      - release-stage-0-signoff
      - system-correlation

  objective:
    summary: >
      Make quality and security gates the same shape locally and in CI,
      so "passes on my machine" implies "passes on main." Tool drift
      between developer machines and CI is the failure mode that this
      spec exists to prevent.
    scope:
      includes:
        - "Makefile targets: vet, lint, vuln, test-race, check"
        - GitHub Actions workflow scoped to app/** with the same gates
        - A spec-and-test contract on each gate
      excludes:
        - Test coverage minimums (handled by Specter strict mode)
        - Mutation testing
        - Container image scanning (Stage 2 when we ship containers)

  constraints:
    - id: C-01
      description: make vet MUST invoke `go vet ./...` and exit non-zero on any suspicious-construct finding
      type: technical
      enforcement: error
    - id: C-02
      description: make lint MUST invoke golangci-lint with staticcheck + gosec + govet + ineffassign + unused + errcheck + revive + forbidigo enabled
      type: technical
      enforcement: error
    - id: C-03
      description: make vuln MUST invoke govulncheck ./... and exit non-zero on any known CVE in dependencies or the standard library that is reachable from openwatch's call graph
      type: security
      enforcement: error
    - id: C-04
      description: make test-race MUST invoke `go test -race ./...` and exit non-zero on any detected data race
      type: security
      enforcement: error
    - id: C-05
      description: make check MUST chain vet → lint → vuln → test-race in that order; first failure aborts the chain
      type: technical
      enforcement: error
    - id: C-06
      description: GitHub Actions workflow .github/workflows/go-ci.yml MUST run on every PR/push to main (no paths filter) and produce the "Quality + security gates" status check. For changes touching app/** it MUST execute make check + specter sync against a Postgres service container; for changes that do not touch app/** the job MUST short-circuit to success so the required status check is always present
      type: technical
      enforcement: error

    - id: C-07
      description: >-
        The Specter gate MUST pin an exact version, MUST reject every annotation diagnostic at ANY severity,
        and MUST be the SAME implementation locally and in CI. Severity is not a safe filter: v0.15 leaves
        unreachable_annotation_unknown at warning, and `specter check --test` exits 0 with warnings present,
        so a gate keyed on the exit code or on --strict alone passes with an annotation that names no
        reachable test. Structural coverage MUST stay at 100% and outcome coverage MUST stay at the
        manifest threshold with every tier at 100.
      type: technical
      enforcement: error
  acceptance_criteria:
    - id: AC-01
      description: make vet target exists and runs `go vet ./...` against the full module.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: make lint target exists and runs golangci-lint; the lint config enables staticcheck, gosec, govet, errcheck, unused, ineffassign, revive, and forbidigo.
      priority: critical
      references_constraints: [C-02]
    - id: AC-03
      description: make vuln target exists and runs govulncheck ./...; auto-installs govulncheck via `go install` if absent.
      priority: critical
      references_constraints: [C-03]
    - id: AC-04
      description: make test-race target exists and runs `go test -race ./...`.
      priority: critical
      references_constraints: [C-04]
    - id: AC-05
      description: make check target chains vet, lint, vuln, test-race in that exact order; depends on each as prerequisites so any failure aborts the chain.
      priority: critical
      references_constraints: [C-05]
    - id: AC-06
      description: make help lists every gate target (vet, lint, vuln, test-race, check) with one-line descriptions so contributors discover them without reading the Makefile.
      priority: high
    - id: AC-07
      description: .github/workflows/go-ci.yml exists, triggers on every PR/push to main without a paths filter, references the Go source paths (cmd/, internal/, ...) in a path-detection step, and gates the heavy gate steps (Go setup, lint, vuln, the race+coverage test run, specter) on that step so non-Go PRs short-circuit to success while still reporting the required "Quality + security gates" status check.
      priority: critical
      references_constraints: [C-06]
    - id: AC-08
      description: The workflow defines a Postgres service container with the same credentials and DB name the test suite expects.
      priority: critical
      references_constraints: [C-06]
    - id: AC-09
      description: The workflow executes (in order) make vet, make lint, make vuln, a single race-detector + JSON test run (`go test -race -json`, which both detects data races and feeds specter ingest — replacing the former separate `make test-race` + non-race json passes), and specter sync — each as its own step so a failure pinpoints which gate broke.
      priority: critical
      references_constraints: [C-06]
    - id: AC-10
      description: The workflow runs on both push to main and pull_request targeting main; uses `set -e` semantics so any step's non-zero exit fails the job.
      priority: high
    - id: AC-11
      description: >-
        One shared gate enforces the Specter contract, and `make spec-check` and the workflow both invoke it,
        so the two cannot drift into different policies. The gate reads the pinned version from a single
        tracked file, refuses to run against any other Specter build, fails on a NONZERO WARNING COUNT as
        well as on errors, and asserts 100% structural coverage.

        It keys on the JSON summary rather than on the process exit code. `specter check --test` returned 0
        against 232 warnings on this tree, and `--strict` promotes only two of the three kinds, leaving 102
        unreachable_annotation_unknown at warning. Either signal alone would have reported a clean gate over
        annotations that name no reachable test.

        The gate prints the diagnostics it rejected. A gate that reports only a count tells a reader that
        something is wrong without telling them what.
      inputs:
        pin_file: .specter-version
        pinned_version: 0.15.0
        shared_gate: scripts/specter-gate.py
        callers:
          - Makefile spec-check
          - .github/workflows/go-ci.yml
        rejected_severities:
          - error
          - warning
        rejected_kinds:
          - unreachable_annotation
          - unreachable_annotation_unknown
          - unknown_spec
          - unknown_ac
        structural_coverage_pct: 100
      expected_output:
        both_callers_invoke_the_same_gate: true
        gate_keys_on_json_summary_not_exit_code: true
        warnings_are_rejected_not_only_errors: true
        version_pin_is_read_from_one_file: true
        diagnostics_are_printed_not_just_counted: true
      priority: critical
      references_constraints: [C-07]
