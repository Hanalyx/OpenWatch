spec:
  id: release-ci-gates
  title: CI quality + security gates
  version: "1.6.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Mandatory pre-merge gates
    description: >
      Every PR against the Go rebuild must pass a fixed set of gates
      before merge: format/vet, lint (staticcheck + gosec + others via
      golangci-lint), known-CVE scan (govulncheck), race-detector test
      suite, and full Specter strict coverage. The gates live in the
      Makefile so they're runnable locally and in CI so they block
      merges. A single `make check` target chains them so contributors
      have one command to run before pushing.
    related_specs:
      - release-stage-0-signoff
      - system-correlation

  objective:
    summary: >
      Make quality and security gates the same shape locally and in CI,
      so "passes on my machine" implies "passes on main." Tool drift
      between developer machines and CI is the failure mode that this
      spec exists to prevent.
    scope:
      includes:
        - "Makefile targets: vet, lint, vuln, test-race, check"
        - GitHub Actions workflow scoped to app/** with the same gates
        - A spec-and-test contract on each gate
      excludes:
        - Test coverage minimums (handled by Specter strict mode)
        - Mutation testing
        - Container image scanning (Stage 2 when we ship containers)

  constraints:
    - id: C-01
      description: make vet MUST invoke `go vet ./...` and exit non-zero on any suspicious-construct finding
      type: technical
      enforcement: error
    - id: C-02
      description: make lint MUST invoke golangci-lint with staticcheck + gosec + govet + ineffassign + unused + errcheck + revive + forbidigo enabled
      type: technical
      enforcement: error
    - id: C-03
      description: make vuln MUST invoke govulncheck ./... and exit non-zero on any known CVE in dependencies or the standard library that is reachable from openwatch's call graph
      type: security
      enforcement: error
    - id: C-04
      description: make test-race MUST invoke `go test -race ./...` and exit non-zero on any detected data race
      type: security
      enforcement: error
    - id: C-05
      description: make check MUST chain vet → lint → vuln → test-race in that order; first failure aborts the chain
      type: technical
      enforcement: error
    - id: C-06
      description: GitHub Actions workflow .github/workflows/go-ci.yml MUST run on every PR/push to main (no paths filter) and produce the "Quality + security gates" status check. For changes touching app/** it MUST execute make check + specter sync against a Postgres service container; for changes that do not touch app/** the job MUST short-circuit to success so the required status check is always present
      type: technical
      enforcement: error

    - id: C-07
      description: >-
        The Specter gate MUST pin an exact version in ONE tracked file, MUST reject every ERROR and WARNING
        annotation diagnostic, and MUST be the SAME implementation locally and in CI. Info diagnostics are
        not blocking.

        Severity is not a safe filter for the rest: v0.15 leaves unreachable_annotation_unknown at warning,
        and `specter check --test` exits 0 with warnings present, so a gate keyed on the exit code or on
        --strict alone passes with an annotation that names no reachable test. The exit status MUST still
        be checked alongside the reported counts, because a run that fails while printing a zeroed summary
        would otherwise be read as clean.

        Structural coverage MUST stay at 100% and outcome coverage MUST stay at the manifest threshold with
        every tier at 100.
      type: technical
      enforcement: error
    - id: C-08
      description: >-
        The documentation style gate MUST be ONE shared invocation behind a single Make target, and that
        SAME target MUST run locally, in pre-commit, and in CI. A caller that rebuilds the command itself
        is a second policy wearing the first one's name.

        The gate MUST check every tracked file of a type the checker supports, not only the files
        `--changed` selects. `--changed` resolves a commit RANGE, `{base}...HEAD`, and falls back to the
        index only when that range is empty, so it never reads the working tree. A pre-commit hook keyed on
        it is vacuous at exactly the moment it is supposed to fire: the files being committed are the files
        it cannot see. This is not hypothetical. A `--changed` run reported 182 files clean while eleven
        edited files carrying a real violation sat unread (Context Plane bugs/OW-027, upstream SP-HP-030).

        The checker supports fifteen tracked extensions, source comments included, so the gate is not a
        Markdown gate and MUST NOT be described as one.

        The checker is a SHARED tool, refetched whole on an upgrade, so the gate MUST pin the adopted
        version in ONE tracked file and MUST compare it against the version the checker reports BEFORE
        scanning anything. A missing, empty, malformed or mismatched pin MUST fail, never skip. No caller
        may repeat the version: a second literal is a second source of truth, and the one comment that
        carried a version named a release two behind what was running, while four already-fixed defects
        stayed live here for a month.

        Scope boundary, stated so it is not mistaken for coverage: files git ignores are outside this gate.
        That includes the 18 extensionless roadmap documents under docs/engineering/roadmap, which the
        checker cannot select because it walks tracked paths by extension. They remain taxonomy debt in the
        Context Plane inventory and are NOT enforced by CI.

        A reading-level exemption MAY cap a named file that is not continuous prose, and MUST cap ONLY that
        file and ONLY the reading level. Every other rule stays binding inside an exempt file, and no other
        path inherits its cap.
      type: technical
      enforcement: error
  acceptance_criteria:
    - id: AC-01
      description: make vet target exists and runs `go vet ./...` against the full module.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: make lint target exists and runs golangci-lint; the lint config enables staticcheck, gosec, govet, errcheck, unused, ineffassign, revive, and forbidigo.
      priority: critical
      references_constraints: [C-02]
    - id: AC-03
      description: make vuln target exists and runs govulncheck ./...; auto-installs govulncheck via `go install` if absent.
      priority: critical
      references_constraints: [C-03]
    - id: AC-04
      description: make test-race target exists and runs `go test -race ./...`.
      priority: critical
      references_constraints: [C-04]
    - id: AC-05
      description: make check target chains vet, lint, vuln, test-race in that exact order; depends on each as prerequisites so any failure aborts the chain.
      priority: critical
      references_constraints: [C-05]
    - id: AC-06
      description: make help lists every gate target (vet, lint, vuln, test-race, check) with one-line descriptions so contributors discover them without reading the Makefile.
      priority: high
    - id: AC-07
      description: .github/workflows/go-ci.yml exists, triggers on every PR/push to main without a paths filter, references the Go source paths (cmd/, internal/, ...) in a path-detection step, and gates the heavy gate steps (Go setup, lint, vuln, the race+coverage test run, specter) on that step so non-Go PRs short-circuit to success while still reporting the required "Quality + security gates" status check.
      priority: critical
      references_constraints: [C-06]
    - id: AC-08
      description: The workflow defines a Postgres service container with the same credentials and DB name the test suite expects.
      priority: critical
      references_constraints: [C-06]
    - id: AC-09
      description: The workflow executes (in order) make vet, make lint, make vuln, a single race-detector + JSON test run (`go test -race -json`, which both detects data races and feeds specter ingest — replacing the former separate `make test-race` + non-race json passes), and specter sync — each as its own step so a failure pinpoints which gate broke.
      priority: critical
      references_constraints: [C-06]
    - id: AC-10
      description: The workflow runs on both push to main and pull_request targeting main; uses `set -e` semantics so any step's non-zero exit fails the job.
      priority: high
    - id: AC-11
      description: >-
        One shared gate enforces the Specter contract, and `make spec-check` and the workflow both invoke it,
        so the two cannot drift into different policies. The gate reads the pinned version from a single
        tracked file, refuses to run against any other Specter build, fails on a NONZERO WARNING COUNT as
        well as on errors, and asserts 100% structural coverage.

        It reads the JSON summary AND the process exit code, because neither alone is sufficient.
        `specter check --test` returned 0 against 277 warnings on this tree, of which 232 were reachability
        and 45 were domain-tier conflicts; `--strict` promoted 175 of those 277 to errors and left the 102
        unreachable_annotation_unknown at warning. A gate reading only the exit code passes the first case,
        and a gate reading only the summary passes a failed run that prints zeroed counters.

        The gate prints the diagnostics it rejected. A gate that reports only a count tells a reader that
        something is wrong without telling them what.

        It also checks the exit status, not only the summary, and both callers invoke it under `python3 -S`
        so that its standard-library-only claim is enforced rather than asserted. The workflow DERIVES the
        version from the pin file instead of declaring its own copy: comparing two literals detects drift
        but still leaves two places to edit.
      inputs:
        pin_file: .specter-version
        pinned_version: 0.15.0
        shared_gate: scripts/specter-gate.py
        # Each caller names the file inspected and the exact invocation it must
        # contain, so the fixture drives the check instead of describing it.
        callers:
          - path: Makefile
            invocation: 'python3 -S scripts/specter-gate.py'
            kind: recipe
          - path: .github/workflows/go-ci.yml
            invocation: 'python3 -S scripts/specter-gate.py'
            kind: run_step
        # The policy is severity-based and deliberately KIND-INDEPENDENT: any
        # error or warning fails, whatever its kind. An earlier fixture listed
        # four kinds, which read like a contract and drove nothing.
        rejected_severities:
          - error
          - warning
        nonblocking_severities:
          - info
        structural_coverage_pct: 100
        # A caller must run the WHOLE gate. `--only` exists so the gate's own
        # guards can drive one stage against a stubbed specter; a caller using
        # it would be running a subset and calling it the gate.
        forbidden_in_callers: '--only'
      expected_output:
        both_callers_invoke_the_same_gate: true
        gate_reads_the_json_summary: true
        warnings_are_rejected_not_only_errors: true
        version_pin_is_read_from_one_file: true
        diagnostics_are_printed_not_just_counted: true
        exit_status_is_checked_alongside_the_summary: true
        gate_runs_with_site_packages_disabled: true
      priority: critical
      references_constraints: [C-07]
    - id: AC-12
      description: >-
        One shared documentation style gate exists as a Make target, and the Makefile, the CI workflow and
        the pre-commit configuration all reach the full tracked tree through it. The target checks every
        tracked supported file by default, so no caller has to remember a flag to get the real gate.

        Each caller is bound to the target rather than to a copy of its command: the workflow runs the Make
        target instead of reconstructing the checker invocation, and the pre-commit hook runs it with
        `pass_filenames: false` so a staged-file list cannot narrow it back down to the vacuous case.

        Every invocation uses `python3 -S`, so the checker's standard-library-only claim is enforced rather
        than asserted, the same way the Specter gate is.

        The binding is behavioral, not textual. The gate is exercised against a throwaway Git repository
        holding a clean tracked file, a tracked violation nobody is editing, a newly staged violation, and a
        violation inside a source-code comment. The tracked violation nobody is editing is the case that
        separates this gate from the old one: `--changed` passes it and `--all` does not.

        The version pin is bound against a COPY of the gate rather than by reading its source: the pin
        missing, empty, malformed, or naming a version the checker does not report must each fail, and the
        passing case must fail when either side is changed alone. No caller may carry the version, checked
        over code lines with comments stripped, because every caller explains the pin in prose.

        The reading-level exemption is bound as a SCOPE, not as a value. The exempt form passes at its
        recorded cap; prose of the same grade at any other path fails; and an em dash, an emoji, AI speak
        or a British spelling inside the exempt file still fails, because the cap covers the reading level
        and nothing else.
      inputs:
        checker: scripts/check-doc-style.py
        shared_gate: scripts/doc-style-gate.py
        pin_file: .doc-style-version
        pinned_version: '6'
        make_target: docs-style
        precommit_hook_id: doc-style
        default_mode: '--all'
        interpreter_flag: '-S'
        # The exempt file and its cap, so the guard drives on the fixture rather
        # than on a literal copied into the test.
        reading_exempt_path: .github/pull_request_template.md
        reading_exempt_cap: '12.1'
        callers:
          - path: Makefile
            invocation: 'python3 -S scripts/doc-style-gate.py'
            kind: recipe
          - path: .github/workflows/go-ci.yml
            invocation: 'make docs-style'
            kind: run_step
          - path: .pre-commit-config.yaml
            invocation: 'make docs-style'
            kind: hook
        # The mode the gate must NOT fall back to. Named so the check drives on
        # it instead of describing it.
        forbidden_in_callers: '--changed'
        # Ignored paths are out of scope by construction, not by oversight.
        excluded_from_gate: docs/engineering/roadmap
      expected_output:
        every_caller_reaches_the_same_make_target: true
        default_mode_is_the_full_tracked_tree: true
        precommit_hook_ignores_passed_filenames: true
        pin_is_read_from_one_file: true
        checker_version_is_compared_before_scanning: true
        no_caller_repeats_the_version: true
        exemption_is_reading_level_only: true
        unchanged_tracked_violation_is_caught: true
        staged_violation_is_caught: true
        source_comment_violation_is_caught: true
        clean_tree_passes: true
        gate_runs_with_site_packages_disabled: true
      priority: critical
      references_constraints: [C-08]
