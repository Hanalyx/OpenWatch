spec:
  id: release-packets
  title: F1, F3 and D1 evidence packets for the release captain
  version: "1.0.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Evidence packets for the release's human gates
    description: >
      For v0.8.4 the F1 and F3 attestation drafts were written by hand from
      ad hoc database and API reads on the fleet server, and the D1 skeleton
      was generated by hand from a clean clone. scripts/release_packets.py
      prepares all three. F1 reads, read-only, the records of the scan the
      release captain ran from the UI; F3 reads the scan variables the
      server resolves; both run a maintained script from
      release/prep/packets/ on the server through the capture library and
      verify the fetched capture. D1 runs scripts/doc-review-skeleton.py from
      a clean checker commit through the capture library. Each writes a packet
      and an attestation skeleton bound to the candidate, with every human
      field blank. The tool records no verdict.
    related_specs:
      - release-preparation
      - release-evidence-capture
      - release-ci-gates
      - release-upgrade-steps
      - system-scan-runs

  objective:
    summary: >
      The captain receives, for F1, F3 and D1, the evidence and a skeleton
      bound to the candidate's artifact, prepared by a maintained tool, with
      nothing decided on their behalf.
    scope:
      includes:
        - scripts/release_packets.py and release/prep/packets/*.sh
      excludes:
        - Running a scan, changing a setting, or any other change to a server
        - Filling, signing or judging any attestation, verdict or confirmation
        - F2 (release-preparation) and H1

  constraints:
    - id: C-01
      description: >-
        The server scripts are read-only. Every database read runs through
        one helper as the service account, in a read-only transaction that
        stops at the first error, with the scan id bound as a psql variable
        and never written into the SQL. They start, stop or restart no
        service, install nothing, and use no pipe. Every section runs and is
        required, and the script exits 1 naming each failed section.
      type: security
      enforcement: error
    - id: C-02
      description: >-
        F1 refuses a scan id that is not a lower-case UUID before any contact.
        It accepts the readings only when the scan completed, has result rows
        whose counts by status equal the run's own counts, and has exactly one
        scan.queued and one scan.completed event and no scan.failed event,
        bound to the scan by its id and by the run's correlation id, never by
        a time window. When this evidence directory holds a
        scripts/release_upgrade.py Step 8 capture for the server, it must
        verify from the same machine and end in MATCH, and the scan must have
        been queued after it finished.
      type: security
      enforcement: error
    - id: C-03
      description: >-
        F3 reads the token only from an absolute path to a root-only file on
        the server holding an owk_ token, only after that check passed in the
        same run, and passes it to curl through a private file; it is never
        printed or sent from the workstation. The response must be HTTP 200
        and a ScanVariablesResponse whose every variable has each required
        field with its schema type, and it must list at least one variable.
      type: security
      enforcement: error
    - id: C-04
      description: >-
        Every packet and skeleton is written only from a verified capture
        that exited 0 and recorded no failed section, and is never
        overwritten; a capture is never taken twice under one name. The
        skeleton carries the gate's kind, the candidate tag and commit, and
        the artifact's digest read from exactly one line of the given
        SHA256SUMS, with that file's own digest. performed_by, performed_at,
        captain_confirmation and observed are empty. Server-derived text is
        labeled as derived and names the capture and its stdout digest.
      type: security
      enforcement: error
    - id: C-05
      description: >-
        D1 runs the skeleton generator only from a checkout with no tracked
        changes and names its commit. The skeleton written is byte-identical
        to the capture's stdout. It is refused, and no skeleton or packet is
        written, when the generator fails, lists no document, or produces a
        performed_by, a performed_at or any verdict other than pending.
      type: security
      enforcement: error
    - id: C-06
      description: >-
        Every capture and transfer has an explicit positive timeout, and the
        tool refuses to run before any contact when one is missing.
      type: technical
      enforcement: error
    - id: C-07
      description: >-
        F1 and F3 write a packet only for a server running the candidate. Both
        the installed binary (openwatch --version) and the running service
        (GET /api/v1/version, answering 200 with a VersionResponse) must
        report the candidate's version and a commit of 7 to 40 lower-case hex
        characters that the candidate commit starts with, and the two must
        agree. Missing, malformed or mismatched identity is refused with every
        problem named, the raw capture kept and no packet or skeleton written.
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: >-
        F1 on a completed scan writes F1-PACKET.md and a skeleton of kind
        fleet-scan whose artifact digest and checksum-list digest match the
        given SHA256SUMS, whose human fields are empty, and whose server
        records cite the capture's stdout digest and the run and row counts.
        Every database read sets read-only, stops on error and receives the
        scan id as a variable that does not appear in its SQL. A Step 8 MATCH
        capture that finished before the scan is recorded in the packet.
      priority: critical
      references_constraints: [C-01, C-02, C-04]
    - id: AC-02
      description: >-
        F1 writes no packet or skeleton and exits 1 for: a malformed or
        upper-case scan id or one with trailing text, with no contact and no
        evidence directory; an artifact listed zero or two times, or a name
        that is not a file name, with no contact; records the consistency
        reading rejects (counts differ, scan running, no completed event, no
        such scan), keeping the raw capture; a failed query, where every
        section still runs and the script itself exits 1; a scan queued before
        the Step 8 capture finished; and a Step 8 capture without MATCH. A
        second run is refused, and an existing packet is never overwritten.
      priority: critical
      references_constraints: [C-01, C-02, C-04]
    - id: AC-03
      description: >-
        F3 writes a packet and a skeleton of kind fleet-scan-variables with
        empty human fields, reporting the count, configure_me and overridden
        totals, and the names added and removed against a prior list when
        given. It fails for an empty list, a body off the schema, a non-JSON
        body, a non-200 status, and a field of the wrong type, by the schema
        check's own message. A token file that is not root-only fails before
        curl is called for the variables; a relative token path is refused
        before contact; the token appears in no evidence file.
      priority: critical
      references_constraints: [C-03, C-04]
    - id: AC-04
      description: >-
        D1 from a clean commit writes a skeleton byte-identical to the
        capture's stdout with every verdict pending and performed_by empty,
        and a packet naming the checker commit, the capture digest and the
        counts to review and inherited. A checkout with tracked changes is
        refused before any capture. A generator output with a verdict, a
        performed_by or no documents is refused with its raw capture kept and
        no skeleton or packet written; a failed generator writes no packet; a
        second run is refused.
      priority: critical
      references_constraints: [C-05]
    - id: AC-05
      description: >-
        Every capture carries its declared timeout, and the server's own
        capture records the read timeout. A zero timeout of any kind is
        refused before contact. The server scripts contain no service,
        package, dump or data-changing SQL command and no pipe, run psql only
        through the read-only helper, and remove only their private
        temporary directory.
      priority: critical
      references_constraints: [C-01, C-06]
    - id: AC-07
      description: >-
        For both F1 and F3, with no packet or skeleton written and the raw
        capture kept and verifying: an older release (0.8.3 at 79f18f78) is
        refused; the candidate's version from another commit is refused; a
        candidate binary behind a service still reporting the older release is
        refused as a disagreement; a commit of "unknown" or of 4 characters, a
        version body without openwatch and commit strings, a body that is not
        JSON, and a binary that does not report one version and one commit
        are each refused; a version endpoint answering 503 fails its section.
        A full 40-character commit is accepted, and the skeleton's server
        records state the version and commit.
      priority: critical
      references_constraints: [C-07]
    - id: AC-06
      description: >-
        Run unchanged against the migrated schema (scan id bound as a
        parameter), the F1 SQL reads one scan's run row, its counts by status
        and its skip reasons, and binds exactly that scan's queued, started
        and completed events, excluding another scan's events on the same host
        in the same minutes and this correlation id's event for another host.
        The consistency reading answers "consistent", and names each fault:
        no such scan, a running scan, counts that differ, no result rows, a
        scan.failed event, and no completed event.
      priority: critical
      references_constraints: [C-02]
