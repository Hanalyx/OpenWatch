spec:
  id: system-api-tokens
  title: API service-account tokens — hashed store + bearer authentication
  version: "1.3.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: >-
      Long-lived API tokens let automation (CI, scripts) call the REST API
      without an interactive session. internal/apitoken owns the token
      store and the AuthenticateToken adapter the identity binder uses to
      resolve an owk_-prefixed bearer value to an auth.Identity.
    description: >-
      A token is 32 bytes of crypto/rand, base64url-encoded behind the
      auth.APITokenPrefix ("owk_"). Only its SHA-256 hash is persisted —
      high entropy makes a fast hash safe (no brute-force surface) and
      enables an indexed lookup on the auth path. The raw token is returned
      to the operator exactly once, at creation. A token carries a role;
      its effective permissions are that role's, re-evaluated by the RBAC
      middleware on every request, so a later role change applies and a
      revoked token stops working immediately.
    related_specs:
      - api-tokens
      - system-auth-identity
      - system-rbac

  objective:
    summary: >-
      Lock the hashed-at-rest store, the once-only secret return, the
      reject-revoked/expired/unknown authentication, and the binder routing
      of owk_ bearer values.
    scope:
      includes:
        - "api_tokens migration 0032 (token_hash unique, role FK RESTRICT, partial live-token index)"
        - "Create returns the raw secret once; only the SHA-256 hash is stored"
        - "AuthenticateToken: reject unknown/revoked/expired; stamp last_used_at"
        - "identity.Binder routes auth.APITokenPrefix bearer values to the token authenticator"
        - "The token identity names its owner as the accountable user"
        - "Actor, accountable owner and effective permissions kept distinct for token callers"
        - "Self-service and notification-feed refusal for tokens"
      excludes:
        - "Per-token permission subsets (tokens are role-scoped)"
        - "Token rotation / expiry-warning jobs (follow-up)"

  constraints:
    - id: C-01
      description: >-
        The raw token MUST NOT be persisted: only its SHA-256 hash is
        stored (token_hash), and the raw value is returned exactly once
        from Create. The stored hash MUST NOT equal the raw token bytes.
      type: security
      enforcement: error
    - id: C-02
      description: >-
        AuthenticateToken MUST reject (ErrInvalidToken, anonymous identity)
        an unknown, revoked (revoked_at set), or expired (expires_at in the
        past) token, and a token whose owner may not authenticate (C-04).
        A successful authentication returns an auth.Identity
        carrying the token's role and its owner (C-05); permissions are NOT
        embedded (the RBAC middleware derives them from the role per
        request).
      type: security
      enforcement: error
    - id: C-04
      description: >-
        A service-account token MUST NOT authenticate while its owner is
        disabled or soft-deleted, and a token with no owner (created_by
        NULL) MUST NOT authenticate at all. The check runs at
        authentication time and is a check, not a revocation: a refusal
        writes nothing to the token row, including last_used_at, so
        re-enabling the owner restores the token, while a token revoked
        through Revoke stays revoked. Each refusal is recorded on
        auth.login.failure with its own reason, api_token_owner_disabled,
        api_token_owner_deleted or api_token_ownerless. This is P8 AC-95
        from bugs/doing/OW-062, and bugs/OW-071.
      type: security
      enforcement: error
    - id: C-05
      description: >-
        A successful authentication MUST set the identity's ID to the
        token's own id (the principal the audit trail names) and its UserID
        to the token's owner (api_tokens.created_by), so AccountableUser
        returns the owner. A users-referencing column written on behalf of a
        token caller takes AccountableUser, never ID. The session-cookie and
        Bearer-JWT arms of the binder set UserID to the signed-in user.
        bugs/OW-097.
      type: security
      enforcement: error
    - id: C-06
      description: >-
        A token acts as three distinct things, and each MUST be used for its
        own purpose. Its id (auth.Identity.ID) is the actor: audit events,
        signed job payloads and free-text "changed by" fields record the
        token. Its owner (AccountableUser) is the accountable user: every
        column that references users(id) (created_by, updated_by,
        granted_by, requested_by, reviewed_by, acknowledged_by, resolved_by)
        records the owner, never the token id. Every "acting on yourself"
        rule compares the owner: separation of duties (a request opened by
        the owner, through a session or any of the owner's tokens, cannot be
        reviewed by the owner, through a session or any of the owner's
        tokens), the self-disable lockout guard, and the self flag on a
        password reset. bugs/OW-098.
      type: security
      enforcement: error
    - id: C-07
      description: >-
        Endpoints that act on the calling user's own account or inbox MUST
        refuse an API token with 403 auth.api_token_not_allowed, before any
        side effect: GET and PATCH /auth/me, POST /auth/mfa:enroll, POST
        /auth/mfa:verify, POST /auth/password:change, GET and PATCH
        /users/me/preferences, GET /notifications/feed, POST
        /notifications/feed:read-all and POST
        /notifications/feed/{id}:read. A token is not that user. Resolving
        these to the owner would let a token change its owner's password or
        MFA, or read the owner's notifications. The identity says it is a
        token through auth.Identity.IsAPIToken, set only by
        AuthenticateToken; it is never inferred from ID and UserID
        differing. bugs/OW-098.
      type: security
      enforcement: error
    - id: C-08
      description: >-
        A token's permissions MUST come only from its own role. Recording
        the owner as the accountable user grants nothing. A token whose role
        lacks a permission is refused even when its owner holds it.
        bugs/OW-098.
      type: security
      enforcement: error
    - id: C-03
      description: >-
        The identity binder MUST route a Bearer value carrying
        auth.APITokenPrefix to the token authenticator (when configured)
        and treat all other bearer values as session JWTs. A rejected token
        falls through to anonymous (no panic, no JWT parse attempt).
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: Create returns a raw token beginning with auth.APITokenPrefix; the persisted token_hash equals sha256(raw) and does NOT contain the raw token bytes; the returned metadata carries the prefix but no secret.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: AuthenticateToken on the freshly created raw token, owned by an active user, returns an Identity with the token's role and a non-empty ID; the token's last_used_at is stamped after authentication.
      priority: critical
      references_constraints: [C-02]
    - id: AC-03
      description: AuthenticateToken returns ErrInvalidToken for an unknown token, for a revoked token (after Revoke), and for an expired token (expires_at in the past). Revoke is idempotent for an already-revoked or missing id.
      priority: critical
      references_constraints: [C-02]
    - id: AC-04
      description: "Source inspection — identity.Binder's resolveIdentity routes a Bearer value with auth.APITokenPrefix to cfg.tokenAuth.AuthenticateToken and only falls through to VerifyJWT for non-prefixed values; a token-auth error returns the anonymous identity with reason invalid_api_token."
      priority: critical
      references_constraints: [C-03]
    - id: AC-05
      description: List returns tokens newest-first with no secret material (no token_hash); Create with an empty name or unknown role_id returns ErrInvalidParams.
      priority: high
      references_constraints: [C-01]
    - id: AC-06
      description: >-
        An otherwise-valid token is refused while its owner is disabled or
        soft-deleted, and always when it has no owner; the refusal writes
        nothing to the token; re-enabling the owner restores the token; a
        revoked token stays revoked.
      priority: critical
      references_constraints: [C-02, C-04]
      inputs:
        initial_state: "An unexpired, non-revoked owk_ token created while its owner is active"
        operation: "Present the token as a Bearer credential to GET /api/v1/hosts, with its own correlation id"
        variants:
          - name: "Owner disabled"
            setup: "disabled_at set on the owner by direct update"
          - name: "Owner soft-deleted"
            setup: "deleted_at set on the owner by direct update"
          - name: "Ownerless"
            setup: "created_by set to NULL on the token by direct update"
          - name: "Active control"
            setup: "The owner is left active"
          - name: "Re-enable"
            setup: "Owner disabled through the users service, then enabled; a second token revoked through Revoke before the disable"
      expected_output:
        per_variant:
          Owner disabled: {status: 401, audit_reason: api_token_owner_disabled, token_row_written: false}
          Owner soft-deleted: {status: 401, audit_reason: api_token_owner_deleted, token_row_written: false}
          Ownerless: {status: 401, audit_reason: api_token_ownerless, token_row_written: false}
          Active control: {status: 200, last_used_at: "stamped"}
          Re-enable: {while_disabled: 401, after_enable: 200, revoked_token_after_enable: 401}
        audit_read_by: "The request's correlation id"
        cookies: "Not applicable; Bearer credential"
    - id: AC-07
      description: >-
        AuthenticateToken on a token created by an active user returns an
        Identity whose ID is the token's id and whose AccountableUser is
        (owner, true); the owner differs from the token id and is a users
        row.
      priority: critical
      references_constraints: [C-02, C-05]
    - id: AC-08
      description: >-
        With a real admin-role token created by the admin user, these writes
        succeed and record the owner, never the token id, in their
        users-referencing column: POST /hosts, POST /credentials, POST
        /credentials/{id}:clone, POST /users/{id}/roles:assign, PUT
        /auth-policy, POST /sso/providers, POST /tokens, POST
        /hosts/{id}/exceptions, POST /exceptions/{id}:approve and :reject,
        POST /remediation/requests, POST
        /remediation/requests/{rid}:approve, POST /alerts/{id}:acknowledge
        and :resolve, and POST /reports/schedules.
      priority: critical
      references_constraints: [C-06]
    - id: AC-09
      description: >-
        Separation of duties across a user's session and two of their
        tokens, for a user who holds both request and approve. An exception
        requested by token A cannot be approved by token B, by token A, or
        by the owner's session (409 exceptions.self_review). An exception the
        owner's session requested cannot be rejected by the owner's token. A
        remediation request opened by token A cannot be approved by token B
        or rejected by the owner's session (409 remediation.self_review).
        Each refused request leaves the status unchanged. An independent
        authorized user then approves each one, and is recorded as the
        reviewer.
      priority: critical
      references_constraints: [C-06]
    - id: AC-10
      description: >-
        A token cannot disable its own owner: POST /users/{owner}:disable
        with the owner's admin-role token answers 409
        users.cannot_disable_self, the owner stays enabled, and the token
        keeps working. A password reset of the owner by the owner's token is
        audited with detail self = true and the token as actor.
      priority: critical
      references_constraints: [C-06]
    - id: AC-11
      description: >-
        Each endpoint listed in C-07 answers 403 auth.api_token_not_allowed
        to a valid token and changes nothing for the owner: profile and
        preferences unchanged, no MFA secret, the owner's notification still
        unread, and no feed items returned. The owner's own session still
        reads /auth/me and its feed.
      priority: critical
      references_constraints: [C-07]
    - id: AC-12
      description: >-
        An ops_lead token owned by an admin is refused (403) for PUT
        /auth-policy, POST /credentials, POST /exceptions/{id}:approve,
        assigning the admin role, disabling a user, and minting an admin
        token, all of which its owner may do. Nothing those requests would
        change is changed. Within its own role the token succeeds.
      priority: critical
      references_constraints: [C-08]
    - id: AC-13
      description: >-
        Only the role foreign key is reported as the caller's bad input.
        Assigning an unknown role answers ErrUnknownRole, and an unknown SSO
        default role or token role answers ErrInvalidParams. A granted_by or
        created_by that is not a user is reported as neither, in the users,
        SSO and token stores.
      priority: high
      references_constraints: [C-06]
