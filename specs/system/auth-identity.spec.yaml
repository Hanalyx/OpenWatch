spec:
  id: system-auth-identity
  title: Auth identity primitives (password, session, JWT, MFA)
  version: "1.9.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Real identity surface (replaces Stage-0 X-Stub-Role shim)
    description: >
      The package internal/identity owns: password hashing (Argon2id),
      password-policy validation against NIST SP 800-63B (no forced
      rotation, no character-class rules, breach-corpus check, length
      is the signal), session token issue/verify/revoke with
      server-side persistence, RS256 JWT mint/verify/refresh, and TOTP
      MFA enrollment + challenge. The same users row backs both the
      session cookie path (browser sign-in) and the JWT bearer path
      (API consumers). Every primitive emits its expected audit event.
    related_specs:
      - system-rbac
      - system-audit-emission
      - system-correlation

  objective:
    summary: >
      Make identity binding real, lockable, and revocable. Every
      authenticated request resolves to a users row by either a session
      cookie or a JWT bearer; both paths share one password+MFA gate at
      login and the same revocation surface. Drift between the two
      paths is impossible because they consume the same Identity struct
      consumed by RequirePermission.
    scope:
      includes:
        - Argon2id password hashing (64 MiB / 3 iters / 1 lane)
        - NIST SP 800-63B password policy validator + breach corpus
        - sessions table + token mint/verify/revoke + 15-min inactivity + 12-hour absolute timeout
        - JWT (RS256) mint + verify + refresh rotation
        - TOTP MFA enrollment, challenge, and recovery codes
        - Identity binder middleware that reads either session cookie OR bearer JWT
      excludes:
        - "OIDC / SAML real flows (Slice A ships 402-stubs only; full flows are a follow-up slice)"
        - "WebAuthn / FIDO2 (fido2_mfa license feature; lands as second MFA method later)"
        - "API keys (no operator demand yet; deferred to Slice B if asked)"

  constraints:
    - id: C-01
      description: Password hashing MUST use Argon2id with parameters memory=64MiB, time=3, lanes=1
      type: security
      enforcement: error
    - id: C-02
      description: Password validation MUST reject the password if a SHA-1 prefix lookup hits the local breach corpus
      type: security
      enforcement: error
    - id: C-03
      description: Password validation MUST NOT enforce character-class rules (no mandatory upper/lower/digit/symbol mix) and MUST NOT force rotation; per NIST SP 800-63B
      type: security
      enforcement: error
    - id: C-04
      description: Password length MUST be 8-128 chars for regular users and 15-128 for users with the admin role
      type: security
      enforcement: error
    - id: C-05
      description: Session token MUST be cryptographically random (≥32 bytes); the token stored on the cookie/JSON is a presentation form that hashes to the DB row's primary key
      type: security
      enforcement: error
    - id: C-06
      description: >-
        The DEFAULT session inactivity timeout MUST be 15 minutes and the
        default absolute timeout MUST be 12 hours
        (identity.DefaultSessionInactivityWindow / DefaultSessionAbsoluteWindow).
        These windows are overridable at runtime by the workspace
        authentication policy (see system-auth-policy); when no policy is
        installed the defaults apply, preserving historical behaviour.
      type: security
      enforcement: error
    - id: C-07
      description: Refresh tokens MUST rotate on every use; the old refresh token MUST be revoked atomically with issuing the new one
      type: security
      enforcement: error
    - id: C-08
      description: JWT MUST be RS256-signed with the same key material that signs system tokens (separate keypair from license signing)
      type: security
      enforcement: error
    - id: C-09
      description: TOTP secrets MUST be 160-bit minimum, stored encrypted at rest using the credential DEK
      type: security
      enforcement: error
    - id: C-10
      description: TOTP verification MUST accept a ±1 step window (30s on either side) to handle clock drift; replay of the same OTP MUST be rejected within the window
      type: security
      enforcement: error
    - id: C-11
      description: >
        Identity binder MUST emit auth.login.failure with detail.reason
        populated on every rejected authentication attempt. Every reason any
        path records on that event MUST be declared in the event's
        detail_schema in audit/events.yaml. The emitter checks key names
        only, so an undeclared reason would pass silently; AC-80 checks the
        vocabulary against the source.
      type: security
      enforcement: error
    - id: C-12
      description: Identity binder MUST distinguish "credential presented but rejected" from "no credential presented"; rejected credentials MUST short-circuit with HTTP 401 (auth.session_invalid envelope) rather than fall through anonymously, so the frontend can trigger a refresh attempt. Truly-unauthenticated requests still flow through anonymously and are denied downstream by RBAC.
      type: security
      enforcement: error
    - id: C-13
      description: Browser login MUST also Set-Cookie an HttpOnly "openwatch_refresh" presentation token (7-day TTL) alongside the session cookie. The browser refresh path MUST NOT require JS access to refresh material; the cookie is server-trusted only.
      type: security
      enforcement: error
    - id: C-14
      description: POST /api/v1/auth/refresh-cookie MUST consume the openwatch_refresh cookie via the same ConsumeRefreshToken rotation contract as the body-token flow (C-07), Set-Cookie a new openwatch_session AND a new openwatch_refresh, and return 200 with the refreshed Identity. On missing/expired/revoked/reused refresh cookie it returns 401 and clears both cookies.
      type: security
      enforcement: error
    - id: C-15
      description: >-
        Password validation in PRODUCTION MUST run the breach-corpus check
        against a non-nil corpus. The pre-release bug was that every
        production users.NewService passed a nil corpus, silently disabling
        C-02. The default is an always-on embedded baseline of the most
        common compromised passwords (identity.DefaultBreachCorpus), so an
        air-gapped install rejects breached passwords with no external file;
        an operator may extend coverage with a full HIBP dump.
      type: security
      enforcement: error
    - id: C-28
      description: >-
        v1.4.0 (AUTH-1 b) — the session ABSOLUTE timeout MUST be a hard ceiling
        that the cookie-refresh path cannot reset. The original login's absolute
        deadline (login time + absolute window) is stamped on the refresh token
        at issue and carried UNCHANGED through every rotation. ConsumeRefreshToken
        MUST refuse (ErrRefreshSessionExpired) once now is past that deadline,
        even though the 7-day refresh window is still open; PostAuthRefreshCookie
        maps it to 401 + clears both cookies. A session re-minted by refresh MUST
        inherit the original deadline (IssueSessionWithAbsolute), never a fresh
        one. Refresh tokens issued before the migration carry no deadline and are
        exempt until they age out within 7 days.
      type: security
      enforcement: error
    - id: C-29
      description: >-
        v1.4.0 (AUTH-1 c) — the server idle window MUST track real user activity,
        not background HTTP traffic. VerifySession with WithoutSlide validates the
        session and enforces both deadlines but MUST NOT advance expires_at /
        last_seen. The identity binder passes WithoutSlide when the request
        carries the X-Background-Refresh marker (set by the SPA on background
        polls) OR targets the SSE events stream (/api/v1/events) — a long-lived
        subscription that reconnects through proxies and cannot send a custom
        header (EventSource), so without this exemption an open SPA would keep an
        unattended session alive forever. Fail-safe: an UNMARKED non-SSE request
        slides as before, so a client that does not send the header is unaffected
        (no premature logout).
      type: security
      enforcement: error

    - id: C-30
      description: >
        Login MUST NOT leak whether a username exists via response time. The
        password path deliberately costs Argon2id work; a lookup miss that
        skips it is measurably faster over a handful of requests, which turns
        login into a username-enumeration oracle. A miss MUST spend equivalent
        key-stretching work before answering. Logout MUST NOT report success it
        did not achieve: if the server cannot revoke the session or refresh
        token, it MUST say so rather than answer 204, because the client clears
        its cookies either way and the user would otherwise believe a
        credential is dead when it is still live.
      type: security
      enforcement: error

    - id: C-31
      description: >
        Both identity binders MUST enforce account state independently of
        revocation. The cookie arm and the session-JWT arm MUST each resolve
        the presented credential to a user id and refuse when that account is
        disabled, soft-deleted, or absent. Revoking credentials on disable is
        not a substitute: a credential issued during a disabled window is
        never revoked and would otherwise authenticate. The check MUST NOT be
        a side effect of another lookup. Role resolution today joins users on
        deleted_at IS NULL and so refuses a deleted account by accident, which
        reads as enforcement while checking nothing about disabled_at; an
        account-state refusal MUST be distinguishable from a user who simply
        holds no role.
      type: security
      enforcement: error
    - id: C-32
      description: >
        The binder MUST distinguish a credential it rejected from a credential
        it could not evaluate. A presented credential that is invalid,
        revoked, expired, or belongs to a disabled or deleted account is a
        client failure and answers 401. A failure to reach the database while
        evaluating it is an infrastructure failure and MUST answer 503 with
        server.error, never 401. Answering 401 for an infrastructure failure
        tells every signed-in browser its session ended, which turns a
        transient outage into a fleet-wide forced re-login and destroys the
        evidence that anything was wrong.
      type: security
      enforcement: error
    - id: C-34
      description: >
        Every interactive credential path that reads account state and then
        acts on it MUST serialize on the user row. The path MUST acquire
        SELECT 1 FROM users WHERE id = $1 FOR NO KEY UPDATE as the first
        statement of a single handler-owned transaction, then read or
        revalidate, then mutate, then commit. FOR NO KEY UPDATE rather than
        FOR UPDATE because 23 foreign keys reference users(id) and FOR UPDATE
        blocks every child insert. Helper functions on these paths MUST accept
        a transaction and MUST NOT own, commit, or roll back one, so a caller
        cannot be left with a partially committed issuance. Nothing may be
        reported to the client as issued before the transaction commits.
        The account-state mutations are on the same protocol, Enable
        included: it reads the account state under the lock to decide
        whether the call is a transition at all.
      type: technical
      enforcement: error
    - id: C-35
      description: >
        A validation that CONSUMES something MUST run inside the transaction
        that issues the credentials it authorizes. MFA one-time passwords are
        consumed by insertion into auth_mfa_otp_uses; performed on the pool
        before issuance, a later issuance failure burns the OTP and the user
        cannot retry with the code still on their screen. Consuming
        validations therefore commit with the issuance or not at all.
      type: technical
      enforcement: error
    - id: C-36
      description: >
        Revocation scopes MUST be named and applied deliberately.
        USER-WIDE INTERACTIVE revocation covers every session and every
        refresh family for one user and is what Disable, AdminResetPassword
        and SoftDelete MUST perform; revoking only sessions leaves the refresh
        family live and a disabled account can mint a working session from it.
        Enable MUST perform the same revocation when, and only when, it
        changes disabled_at from set to null, in the same transaction as that
        change: re-enabling requires a fresh sign-in, so no credential that
        existed while the account was disabled authenticates afterwards,
        including one no earlier revocation reached. Enable on an account
        that is not disabled changes nothing and revokes nothing.
        Service-account tokens are NOT interactive credentials and MUST NOT be
        touched by interactive revocation. No text describing these operations
        may claim they end all of an account's credentials.
      type: security
      enforcement: error
    - id: C-37
      description: >
        Serialization failures MUST be handled in a bounded, honest way. A
        transaction that fails with SQLSTATE 40P01 (deadlock) or 40001
        (serialization failure) MAY be retried by restarting the WHOLE
        transaction, at most three attempts in total and only within the
        request deadline. Any other error MUST NOT be retried. A commit whose
        outcome is UNKNOWN MUST NOT be retried and MUST NOT be reported as
        either success or failure: it answers 503 asserting neither result,
        and emits a structured record so the ambiguity is visible. Retrying an
        unknown commit can duplicate an issuance; reporting it as failure can
        tell a user a credential does not exist when it does.
        Classification MUST be by the error's MEANING, not by whether a
        SQLSTATE is present. The presence of a SQLSTATE is not evidence of a
        known result: the standard defines codes for exactly this situation,
        including 40003 statement_completion_unknown and 08007
        transaction_resolution_unknown, and class 08 reports a connection
        exception that for a commit leaves the caller knowing nothing. The
        uncertain set and the retryable set MUST stay disjoint, because a
        retry of an unknown commit is the duplication this constraint exists
        to prevent. Where classification is in doubt the implementation MUST
        report doubt: a truthful 503 costs a re-authentication, while false
        certainty costs a duplicated or disowned credential.
      type: technical
      enforcement: error

    - id: C-38
      description: >
        An access token MUST be bound to the session that issued it. The token
        carries that session's id as a `sid` claim, the refresh lineage carries
        it in refresh_tokens.session_id, and the binder MUST refuse a token
        whose bound session is revoked, expired or absent, and MUST refuse a
        token that carries no binding at all. Without this an access token is
        an independent bearer credential that outlives everything except its
        own expiry, which is why an administrative password reset left one
        working: the account stays enabled, so no account-state check reaches
        it. The evaluation MUST be a single read over sessions joined to
        users, and MUST refuse in this vocabulary: sid_absent, session_absent,
        session_owner_mismatch, session_revoked, session_absolute_expired,
        account_disabled, account_deleted, with session_lookup_failed
        answering 503. It MUST compare the session's user_id with the token's
        subject and refuse a mismatch: nothing legitimate produces a correctly
        signed token naming another user's session.
        The evaluation MUST NOT apply the session's IDLE window and MUST NOT
        slide it. The idle window tracks real user activity in a browser
        session; a Bearer request is not that, so expiring against it would
        cut off an actively calling client and sliding it would let a
        background caller keep a session alive forever. Bearer traffic is
        bounded by the session's ABSOLUTE deadline, evaluated with
        clock_timestamp() in the database so skew between the application and
        the database cannot change who is admitted.
        Revoking a session MUST make its descendants unusable: every refresh
        token attached to that session is revoked with it, and rotation MUST
        refuse a token whose linked session is revoked. A lineage does NOT
        keep one session id, because the cookie path rebinds each successor
        to the session it mints, so both rules are scoped to whatever session
        a token is attached to at the time. Logout MUST take the same
        per-user lock as the issuance paths so a concurrent rotation cannot
        produce a live successor attached to a session that is already gone.
        The refresh_tokens.session_id foreign key MUST NOT cascade on delete:
        a cascade would make deleting a session silently delete its refresh
        rows, destroying the record of what it held and changing retention
        behavior as a side effect. Service-account tokens are outside all of
        this.
        Credentials minted before this rule exists carry no binding and cannot
        be evaluated against it, so the migration that introduces it MUST
        revoke every live interactive session and refresh token rather than
        leave the guarantee silently false for up to seven days.
    - id: C-39
      description: >
        Every authentication input MUST be revalidated under the per-user lock,
        not only account state. A login verifies a password and reads MFA
        enrollment BEFORE the lock, because Argon2id and a policy screen must
        not run while a user row is held; both readings can therefore be stale
        by the time anything is issued. Under the lock the handler MUST
        re-read the password version (last_password_change_at, bumped by the
        only statement that writes password_hash) and refuse when it differs
        from the version it verified, and MUST re-read CONFIRMED MFA
        enrollment and let the locked value decide in BOTH directions:
        enrollment completing mid-login must not let a login through without
        an OTP, and enrollment being removed mid-login must not fail a login on
        an OTP that no longer has a secret. Mutations to these inputs, the
        administrative reset and the MFA enrollment and confirmation writes,
        MUST take the same lock so they cannot interleave with an issuance
        that is revalidating them.
      type: security
      enforcement: error
    - id: C-40
      description: >
        An UNKNOWN commit outcome MUST NOT invite replay. The response MUST be
        marked NOT retryable and MUST NOT tell the client to retry. For a
        refresh this is load-bearing rather than cosmetic: the rotation may
        already have committed, so presenting the same token again is
        indistinguishable from theft and revokes the whole family, turning a
        transient infrastructure failure into a forced sign-out. The client is
        told to re-authenticate, which is the only action that cannot make
        things worse. The same rule applies to a login whose commit outcome is
        unknown, where an automatic replay could issue a second set of
        credentials for a first set that already exists.
      type: security
      enforcement: error

    - id: C-41
      description: >
        Logout MUST end exactly one login family, located by the cookies the
        request carries. A family is the connected set of sessions and refresh
        rows reachable through refresh_tokens.session_id and
        refresh_tokens.rotated_to_id in BOTH directions; the cookie path
        rebinds each rotated successor to the session it mints, so a lineage
        does not keep one session id and a one-directional walk misses half
        the family. Target resolution MUST accept a session cookie alone, a
        refresh cookie alone, or both, and MUST match on the token hash alone,
        so an idle-expired or otherwise unusable session cookie still locates
        its family. That lookup authorizes nothing except logout. When both
        cookies resolve to different families, the session cookie's family is
        revoked and the other is left untouched; this is a target-precedence
        policy, and the disagreement is recorded in the declared
        auth.logout detail without any credential value. Every row reached
        MUST belong to one user, the walk MUST terminate on cycles and MUST
        fail beyond a bound, and on any inconsistency logout MUST revoke
        nothing: no user-wide fallback, no partial success, no silent
        widening. Resolution and revocation MUST run in one transaction under
        the same per-user lock as rotation, so a failure anywhere rolls every
        revocation back. CSRF protection on logout is unchanged.
      type: security
      enforcement: error

    - id: C-42
      description: >
        Logout MUST enforce the double-submit CSRF check itself whenever a
        session cookie or a refresh cookie selects what it revokes. The
        shared CSRF middleware exempts every /api/v1/auth/* route, every
        request carrying an Authorization header, and every request without
        a session cookie, so none of its checks reach logout. When a cookie is
        the revocation authority, a cross-site request could carry it; an
        Authorization header does not change that, because the cookies pick
        the target. A missing or mismatched token MUST be refused with 403
        authz.csrf_invalid BEFORE any revocation and WITHOUT clearing or
        replacing any cookie. Other authentication routes are unchanged. The
        limitation is accepted and recorded: the XSRF cookie is a
        browser-session cookie while the refresh cookie lasts seven days, so
        a client holding a refresh cookie and no XSRF cookie cannot complete a
        logout request, and no exemption, bootstrap endpoint or automatic
        refresh is provided for it.
      type: security
      enforcement: error
    - id: C-43
      description: >
        Credential transactions MUST be bounded in the production
        configuration, not only under test. Nothing else bounds them: the
        http.Server WriteTimeout does not cancel a handler. Two limits apply.
        First, identity.LockWaitBound, 5 seconds, is set as a
        transaction-local lock_timeout by the lock helper. PostgreSQL applies
        it to each lock acquisition separately, including implicit row locks
        taken by later statements in the same transaction; it does not limit
        pool acquisition, the transaction as a whole or the request. Second,
        identity.OperationDeadline, 15 seconds, is a context deadline over
        the whole serialized operation: pool acquisition, every statement,
        the commit and any retries, in RunSerialized and in the users
        service's account-state, reset and enable transactions. It never
        extends an earlier deadline the caller already carries. Exceeding
        either limit shows only that a wait exceeded it, not why. Outcomes
        MUST be reported by what is known. The per-user lock not acquired
        in time: nothing was read under it and nothing changed. A later
        lock timing out: the transaction rolled back, and the answer MUST
        NOT claim the per-user lock was never acquired. A deadline expiring
        during the commit: the outcome is unknown and is reported as
        ErrCommitUnknown, never as success or failure. Credential and
        administrative paths answer a known rollback from a lock timeout
        with 503 server.error, retryable. Administrative account mutations
        are classified by the stage the transaction reached, and the commit
        stage is tested FIRST: an uncertain commit stays unknown (503, not
        retryable) even when what interrupted it was a deadline. A
        transaction that never began, because no connection became free
        before the deadline, and one that rolled back after a lock timeout
        or a deadline before its commit, are "not applied" (503, retryable).
        The rollback after a failure runs on a context detached from the
        operation's cancellation, keeping its values, with its own limit,
        identity.RollbackCleanupLimit, 2 seconds. Cleanup can therefore add
        up to 2 seconds beyond OperationDeadline; it is not contained within
        it. Its result never changes how the attempt is reported: a
        transaction that never reached COMMIT cannot have committed, so an
        unconfirmed rollback leaves only the release of its locks
        uncertain, and a failed cleanup after an uncertain commit never
        turns it into "not applied". Logout clears both credential
        cookies on every outcome, because the web client treats any logout
        response as signed out, and so its lock-timeout answer is 503
        server.error, not retryable: with the cookies cleared a repeated
        request may name no family, or a different one. Its message says
        the account lock was not acquired and nothing was revoked, which
        keeps it distinct from an unknown commit, which says revocation
        could not be confirmed. The deadline starts at the identity binder
        (C-44) and is handed to the handlers of the credential and
        account-mutation routes, so their reads before the transaction and
        the transaction itself spend one budget; RunSerialized and the users
        service apply it again only as a ceiling, which never extends it.
      type: security
      enforcement: error
    - id: C-44
      description: >
        Cookie-session verification MUST be bounded and MUST NOT
        authenticate from a stale read. The binder runs verification under
        identity.OperationDeadline, never beyond an earlier deadline the
        request carries. The idle slide runs in its own short transaction
        with the LockWaitBound lock limit, so a session row held by another
        transaction delays a request by at most that limit, and the slide
        re-checks revocation and both expiry deadlines when it writes: a
        session revoked or expired while the request waited is refused with
        the reason the row now shows. A verification that cannot complete,
        from the lock limit or the deadline, is an infrastructure failure:
        503 server.error, retryable, with no protected handler run, no
        cookie cleared and no refresh triggered. Background requests
        (X-Background-Refresh, the event stream) and logout verify without
        sliding, so they neither extend the idle window nor wait on the
        row; logout still reaches its hash lookup, CSRF check and bounded
        revocation. bugs/OW-077.
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: HashPassword(plain) returns an Argon2id PHC string ($argon2id$v=19$m=65536,t=3,p=1$...); VerifyPassword(plain, hash) returns true for the original and false for any other input.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: ValidatePassword rejects a password if its SHA-1 prefix appears in the local breach corpus file (testdata fixture provides a small corpus); error returned is ErrPasswordBreached.
      priority: critical
      references_constraints: [C-02]
    - id: AC-03
      description: ValidatePassword accepts an 8-char password for a non-admin user; rejects a 7-char password with ErrPasswordTooShort; rejects a 129-char password with ErrPasswordTooLong.
      priority: critical
      references_constraints: [C-04]
    - id: AC-04
      description: ValidatePassword with the admin policy rejects a 14-char password with ErrPasswordTooShort; accepts a 15-char password.
      priority: critical
      references_constraints: [C-04]
    - id: AC-05
      description: ValidatePassword does NOT reject "alllowercase" or "1234567890" on character-class grounds (only on length and breach); per C-03.
      priority: critical
      references_constraints: [C-03]
    - id: AC-06
      description: IssueSession persists a row in the sessions table with hashed token, user_id, expires_at (now + 15min), absolute_expires_at (now + 12h), and returns the presentation-form token.
      priority: critical
      references_constraints: [C-05, C-06]
    - id: AC-07
      description: VerifySession against a valid presentation token returns the Identity; touches the sessions.last_seen and extends expires_at by 15 minutes; never extends past absolute_expires_at.
      priority: critical
      references_constraints: [C-06]
    - id: AC-08
      description: VerifySession against a revoked token returns ErrSessionRevoked and emits auth.session.revoked check failure audit (without leaking the token).
      priority: critical
      references_constraints: [C-05]
    - id: AC-09
      description: RevokeSession sets revoked_at on the row; subsequent VerifySession returns ErrSessionRevoked.
      priority: critical
    - id: AC-10
      description: VerifySession against a token whose absolute_expires_at has passed returns ErrSessionExpired even if last_seen was recent; emits auth.session.expired audit.
      priority: critical
      references_constraints: [C-06]
    - id: AC-11
      description: IssueJWT mints an RS256 token with claims {sub=userID, iat, exp=iat+30min, jti, role} signed by the system keypair; VerifyJWT parses the same token and returns the claims.
      priority: critical
      references_constraints: [C-08]
    - id: AC-12
      description: IssueRefreshToken persists a row in refresh_tokens with hashed token + user_id + expires_at (now + 7 days); ConsumeRefreshToken returns a new (access, refresh) pair AND atomically marks the consumed row as rotated_to_id pointing at the new row.
      priority: critical
      references_constraints: [C-07]
    - id: AC-13
      description: ConsumeRefreshToken called twice with the same input — second call returns ErrRefreshTokenReused; the user's session chain is invalidated (all active sessions for that user are revoked); emits auth.session.revoked with reason "refresh_token_reused".
      priority: critical
      references_constraints: [C-07]
    - id: AC-14
      description: EnrollMFA(userID) generates a 160-bit Base32 secret, stores it encrypted with the credential DEK, returns a provisioning URI of the form otpauth://totp/OpenWatch:{username}?secret=...&issuer=OpenWatch&algorithm=SHA1&digits=6&period=30.
      priority: critical
      references_constraints: [C-09]
    - id: AC-15
      description: VerifyMFA(userID, otp) accepts the OTP for the current 30-second step; accepts the previous and next steps (±1 window for drift); rejects a step outside that window.
      priority: critical
      references_constraints: [C-10]
    - id: AC-16
      description: VerifyMFA replay protection — the same OTP value used twice within its 90s window returns ErrOTPReplayed on the second use.
      priority: critical
      references_constraints: [C-10]
    - id: AC-17
      description: IdentityBinder middleware reads either Cookie "openwatch_session" or Authorization "Bearer <jwt>"; populates auth.Identity on the request context; anonymous when neither is present.
      priority: critical
    - id: AC-18
      description: IdentityBinder emits auth.login.failure (action) with detail.reason in {"invalid_session_token","session_expired","session_revoked","invalid_jwt","jwt_expired"} on every rejected authentication attempt.
      priority: high
      references_constraints: [C-11]
    - id: AC-19
      description: VerifyPassword has p99 latency < 200ms over 50 calls (Argon2id is the dominant cost; spec target ensures the configured parameters aren't accidentally relaxed).
      priority: medium
      references_constraints: [C-01]
    - id: AC-20
      description: IssueJWT + VerifyJWT round-trip p99 < 5ms over 1000 calls (RS256 verify is the dominant cost).
      priority: medium
      references_constraints: [C-08]
    - id: AC-21
      description: IdentityBinder, when a cookie OR bearer token is presented but resolveIdentity returns a non-empty reason (any of the C-11 reasons), writes HTTP 401 with envelope error.code "auth.session_invalid" and stops the chain (does not call next.ServeHTTP). Requests with no cookie and no Authorization header still flow through with anonymous Identity.
      priority: critical
      references_constraints: [C-12]
    - id: AC-22
      description: PostAuthLogin Set-Cookies "openwatch_refresh" (HttpOnly, Secure, SameSite=Lax, Path=/, MaxAge=604800) carrying the presentation form of a freshly minted refresh token. The same refresh token is also returned in the response body for non-browser consumers (existing contract preserved).
      priority: critical
      references_constraints: [C-13]
    - id: AC-23
      description: PostAuthRefreshCookie reads the openwatch_refresh cookie, calls ConsumeRefreshToken to rotate it (C-07), issues a new session via IssueSession, and Set-Cookies both "openwatch_session" (new presentation token) AND "openwatch_refresh" (new rotated refresh token). Returns 200 with the user identity. On missing cookie or any rotation error (expired/revoked/reused) returns 401 with envelope error.code "auth.refresh_invalid" and Set-Cookie clears both cookies (MaxAge=-1).
      priority: critical
      references_constraints: [C-14]
    - id: AC-24
      description: PostAuthLogout clears the openwatch_refresh cookie in the same response as the openwatch_session cookie clear (MaxAge=-1 for both). If a valid refresh token exists in the cookie, it is also revoked in the refresh_tokens table.
      priority: high
      references_constraints: [C-13, C-14]
    - id: AC-25
      description: >-
        Browser API client (src/api/client.ts) attaches an onResponse
        middleware that intercepts HTTP 401. On a 401 the middleware calls
        POST /api/v1/auth/refresh-cookie once and, if it returns 200,
        replays the original request exactly once with the rotated cookies.
        If refresh-cookie itself returns 401 the middleware clears
        useAuthStore.identity and navigates to /login. The retry MUST NOT
        loop — a second 401 on the same request after refresh is returned to
        the caller without a further retry. When that terminal 401 carries
        an authentication-failure code (auth.session_invalid /
        auth.session_expired / auth.required, or an unparseable 401 body)
        the middleware ALSO clears identity and navigates to /login — it does
        NOT rely on the query throwing, because openapi-fetch surfaces
        {error} without throwing so the QueryCache onError redirect would
        never fire for such a query. An authz (permission) 401 is returned
        untouched (a permission denial is not a session failure).
      priority: critical
      references_constraints: [C-14]
    - id: AC-26
      description: "VerifyJWT fails closed on a bad signature — the deny side of C-08, not only the happy round-trip (AC-11). A token whose RS256 signature does not verify against the system public key (e.g. a tampered signature segment) returns ErrJWTInvalid, and a structurally malformed/garbage bearer value returns ErrJWTInvalid; in neither case are claims returned. This makes the signature-verification deny path a spec'd contract so a regression that relaxes verification (accepting an unsigned/alg=none/foreign-key token) fails the suite rather than silently passing."
      priority: critical
      references_constraints: [C-08]
    - id: AC-27
      description: identity.DefaultBreachCorpus() loads a non-empty embedded baseline; ValidatePassword with it rejects common compromised passwords that pass the length floor (e.g. "password123", "qwerty123", "Password1") with ErrPasswordBreached, and accepts a strong unique password. Production users.NewService is wired with this corpus, not nil.
      priority: critical
      references_constraints: [C-15]
    - id: AC-28
      description: >-
        AUTH-1 (b) — ConsumeRefreshToken on a token whose carried
        absolute_expires_at is in the PAST returns ErrRefreshSessionExpired (the
        7-day token window may still be open), and does NOT rotate/issue a new
        pair. A token whose absolute deadline is in the future rotates normally.
      priority: critical
      references_constraints: [C-28]
    - id: AC-29
      description: >-
        AUTH-1 (b) — a successful ConsumeRefreshToken carries the ORIGINAL
        absolute deadline onto the rotated row unchanged (the new refresh row's
        absolute_expires_at equals the consumed row's), and returns it on the
        TokenPair so the cookie-refresh handler can stamp it onto the re-minted
        session via IssueSessionWithAbsolute (the new session's
        absolute_expires_at equals the original, not now + window).
      priority: critical
      references_constraints: [C-28]
    - id: AC-30
      description: >-
        AUTH-1 (c) — VerifySession with WithoutSlide returns the validated
        session but does NOT advance expires_at or last_seen (a row read after
        the call shows the pre-call expires_at), while a normal VerifySession on
        the same session still extends it. Expiry enforcement is unchanged under
        WithoutSlide (an idle- or absolute-expired session still returns
        ErrSessionExpired).
      priority: critical
      references_constraints: [C-29]
    - id: AC-31
      description: >-
        AUTH-1 (c), both ends. Server: the identity Binder passes WithoutSlide
        when the request carries X-Background-Refresh — a marked request does NOT
        advance the session expires_at, an unmarked request does (binder
        behavioral test). Client: the SPA API client sets the X-Background-Refresh
        header on safe/background reads when there has been no new user activity
        since the last reported request, gated on the idle-timer activity signal
        (the 'ow.session.lastActivity' localStorage key) so it stays inert — and
        the server keeps sliding as before — until that signal exists
        (source-inspection of frontend/src/api/client.ts).
      priority: high
      references_constraints: [C-29]
    - id: AC-32
      description: >
        Username enumeration via login timing is closed. VerifyUserPassword
        spends Argon2id work on a username that does not exist, using a decoy
        verification that always fails, so a miss and a wrong password cost
        comparable time. The decoy performs real key stretching rather than a
        sleep or a constant.
      priority: critical
      references_constraints: [C-30]
    - id: AC-33
      description: >
        Logout reports the truth. A failure to revoke the session or the
        refresh token is logged at error level and returns a 5xx naming the
        incomplete revoke, rather than the unconditional 204 the handler
        previously returned while discarding both errors. Cookies are still
        cleared in that case, so the browser stops presenting the credential
        even though the server could not kill it.
      priority: critical
      references_constraints: [C-30]
    - id: AC-34
      description: >
        The cookie binder refuses a live, unrevoked session whose account is
        disabled, and refuses one whose account is soft-deleted, by an
        explicit account-state check. An active account with roles is
        accepted. An active account holding NO role is also refused, and for
        a DIFFERENT reason than a disabled account, so the criterion cannot be
        satisfied by the incidental deleted_at join in role resolution.
      priority: critical
      references_constraints: [C-31]
      inputs:
        initial_state: "A live, unrevoked session row and its cookie"
        operation: "Set the account state by direct update, then GET with the cookie"
        variants: ["Disabled", "Soft-deleted", "Active control", "Active with no roles"]
        method: >
          The session is issued while the account is active and is never
          revoked, so a refusal cannot come from revocation. One request per
          variant, no concurrency, no elapsed-time dependence.
      expected_output:
        per_variant:
          Disabled: {status: 401, audit_reason: account_disabled}
          Soft-deleted: {status: 401, audit_reason: account_deleted}
          Active control: {status: 200}
          Active with no roles: {status: 401, audit_reason: session_user_lookup_failed}
        distinguishable_reasons: true
        prohibited_changes:
          - "A disabled account authenticating on the cookie path"
          - "The disabled refusal sharing the reason a role-less account produces"
    - id: AC-35
      description: >
        The session-JWT binder refuses a token whose account is disabled or
        soft-deleted, and accepts one whose account is active. The JWT itself
        remains cryptographically valid and unexpired in every case, so the
        refusal is attributable to account state alone.
      priority: critical
      references_constraints: [C-31]
      inputs:
        initial_state: "A valid, unexpired session JWT for an active account"
        operation: "Set the account state, then present the JWT as a Bearer credential"
        variants: ["Disabled", "Soft-deleted", "Active control"]
        method: "One request per variant against state written beforehand. No concurrency."
      expected_output:
        per_variant:
          Disabled: {status: 401, audit_reason: account_disabled}
          Soft-deleted: {status: 401, audit_reason: account_deleted}
          Active control: {status: 200}
        prohibited_changes: ["A disabled or deleted account authenticating on the Bearer path"]
    - id: AC-36
      description: >
        A database failure while evaluating account state answers 503
        server.error and NOT 401. The credential presented is valid, so the
        response must not claim it was rejected.
      priority: critical
      references_constraints: [C-32]
      inputs:
        initial_state: "A valid session cookie for an active account"
        controlled_failure: "The account-state lookup returns an infrastructure error"
        method: >
          The failure is injected through the lookup interface the binder
          depends on, so the same request succeeds without injection. It is
          deterministic: the injected error is returned on every call.
      expected_output:
        response: {status: 503, code: server.error}
        prohibited_changes:
          - "A 401 for an infrastructure failure"
          - "An identity bound from an indeterminate account state"
    - id: AC-37
      description: >
        Disable performs USER-WIDE INTERACTIVE revocation: every session and
        every refresh family for that user is revoked in one transaction.
        Afterwards neither refresh path mints anything, and no credential
        derived from either response authenticates. Service-account tokens are
        untouched.
      priority: critical
      references_constraints: [C-36]
      inputs:
        initial_state: "A live session, a live refresh cookie, a live body refresh token and one api_tokens row"
        operation: "Disable(user), then exercise both refresh paths"
        method: "Direct state construction, one Disable call, one request per path. No concurrency."
      expected_output:
        durable_changes: ["sessions live 0", "refresh_tokens live 0"]
        both_paths_refused: true
        usable_session_cookie_returned: false
        prohibited_changes:
          - "Any credential derived from either refresh response authenticating"
          - "api_tokens written by interactive revocation"
    - id: AC-38
      description: >
        AdminResetPassword and SoftDelete each perform user-wide interactive
        revocation. SoftDelete revoked nothing before this change.
      priority: critical
      references_constraints: [C-36]
      inputs:
        initial_state: "A live session and a live refresh family"
        operation: "AdminResetPassword(user); separately, SoftDelete(user)"
        variants: ["AdminResetPassword", "SoftDelete"]
        method: "One call per variant against freshly constructed state."
      expected_output:
        per_variant:
          AdminResetPassword: {sessions_live: 0, refresh_live: 0}
          SoftDelete: {sessions_live: 0, refresh_live: 0}
        prohibited_changes: ["Any refresh path succeeding afterwards"]
    - id: AC-39
      description: >
        Password login runs in ONE handler-owned transaction that takes the
        per-user lock as its first statement and revalidates account state
        inside it. A disable committed before the lock is observed by the
        login, which issues nothing.
      priority: critical
      references_constraints: [C-34]
      inputs:
        initial_state: "An enabled account with valid credentials"
        concurrent_ordering: "Disable commits while the login transaction is blocked on the user lock"
        method: >
          The disable is committed and released before the login proceeds, so
          the ordering is imposed by the lock rather than by timing. The test
          asserts the outcome, not a duration.
      expected_output:
        response: {status: 401, code: auth.invalid_credentials}
        durable_changes: []
        prohibited_changes: ["A session, refresh token or access token issued for the disabled account"]
    - id: AC-40
      description: >
        The MFA one-time password is consumed inside the issuing transaction.
        When issuance fails after a correct OTP, the OTP is NOT consumed and
        the same code still works on a retry.
      priority: critical
      references_constraints: [C-35]
      inputs:
        initial_state: "An MFA-enrolled user and a currently valid OTP"
        controlled_failure: "Issuance fails after the OTP validates"
        method: >
          The failure is injected inside the transaction, after validation and
          before commit, so the rollback is what leaves the OTP unconsumed.
          Deterministic: no timing and no concurrency.
      expected_output:
        durable_changes: []
        subsequent: ["The same OTP authenticates on a retry"]
        prohibited_changes: ["An auth_mfa_otp_uses row surviving a rolled-back login"]
    - id: AC-41
      description: >
        Both refresh paths run in one handler-owned transaction, take the
        per-user lock first and revalidate account state inside it. The
        rotation helper owns no transaction and commits nothing.
      priority: critical
      references_constraints: [C-34]
      inputs:
        initial_state: "A live refresh family for an enabled account"
        operation: "POST /auth/refresh and POST /auth/refresh-cookie"
        variants: ["Body path, account disabled", "Cookie path, account disabled", "Body path control", "Cookie path control"]
        method: "The account state is set before the request. One request per variant."
      expected_output:
        per_variant:
          Body path, account disabled: {refused: true, credentials_issued: 0}
          Cookie path, account disabled: {refused: true, credentials_issued: 0}
          Body path control: {refused: false}
          Cookie path control: {refused: false}
        helper_owns_transaction: false
        prohibited_changes: ["A rotated refresh row committed without the credentials it was rotated for"]
    - id: AC-42
      description: >
        Concurrency failures are bounded and honest. A transaction failing
        with 40P01 or 40001 is retried by restarting the whole transaction, at
        most three attempts. Any other error is not retried. An unknown commit
        outcome answers 503 asserting neither result and is not retried.
      priority: critical
      references_constraints: [C-37]
      inputs:
        initial_state: "A login transaction"
        controlled_failure: "Injected SQLSTATE 40P01, then 40001, then a non-retryable error, then an unknown commit outcome"
        variants: ["Retryable, succeeds on attempt 2", "Retryable, exhausts 3 attempts", "Non-retryable", "Unknown commit outcome"]
        method: >
          Each SQLSTATE is injected deterministically by a failing hook that
          counts its own calls, so attempt counts are asserted exactly rather
          than observed.
      expected_output:
        per_variant:
          Retryable, succeeds on attempt 2: {attempts: 2, response_status: 200}
          Retryable, exhausts 3 attempts: {attempts: 3, response_status: 503}
          Non-retryable: {attempts: 1}
          Unknown commit outcome: {attempts: 1, response_status: 503, asserts_neither_result: true}
        prohibited_changes:
          - "A retry of an unknown commit outcome"
          - "More than three attempts"
          - "A response claiming success or failure after an unknown commit"
    - id: AC-43
      description: >
        An access token stops authenticating when the session that issued it
        is revoked, while the account itself stays enabled and undeleted. This
        is the administrative-reset case: no account-state check can reach a
        token whose account is still active, so only the binding can.
      priority: critical
      references_constraints: [C-38]
      inputs:
        initial_state: "A login-issued access token and its live session; the account is enabled"
        operation: "Revoke the session, then present the same access token"
        variants: ["Session revoked directly", "Revoked via AdminResetPassword"]
        method: >
          The token is captured before the revocation and replayed after it in
          one request. The account state never changes, so an account-state
          check cannot produce the refusal. No concurrency, no elapsed time.
      expected_output:
        per_variant:
          Session revoked directly: {status: 401}
          Revoked via AdminResetPassword: {status: 401}
        account_state_unchanged: true
        prohibited_changes:
          - "The pre-revocation access token authenticating any request"
          - "A refusal produced by the account being disabled or deleted"
    - id: AC-44
      description: >
        An access token carrying no session binding is refused, and every
        interactive issuance path produces a bound one. An unbound token is
        not trusted as a legacy credential: after the migration no legitimate
        interactive token lacks a binding.
      priority: critical
      references_constraints: [C-38]
      inputs:
        initial_state: "An enabled account with a live session"
        operation: "Present an unbound token; separately, inspect what each issuance path mints"
        variants: ["Unbound token presented", "Password login", "Body refresh rotation"]
        method: >
          The unbound token is minted through the explicit unbound helper, so
          it is cryptographically valid and differs from a bound one only in
          the claim. One request per variant.
      expected_output:
        per_variant:
          Unbound token presented: {status: 401, audit_reason: sid_absent}
          Password login: {token_carries_sid: true, refresh_row_carries_session_id: true}
          Body refresh rotation: {token_carries_sid: true, binding_preserved: true}
        prohibited_changes:
          - "An unbound token authenticating"
          - "An issuance path minting a token the binder would refuse"
    - id: AC-45
      description: >
        The migration that introduces session binding revokes every live
        interactive credential, and leaves service-account tokens alone.
        Nothing minted before the rule survives it.
      priority: critical
      references_constraints: [C-38]
      inputs:
        initial_state: "Live sessions and refresh tokens written before the migration, plus one api_tokens row"
        operation: "Run the migration"
        method: >
          The pre-migration rows are inserted directly against a database at
          the prior migration version, then the migration runs. Deterministic:
          no timing and no concurrency.
      expected_output:
        durable_changes:
          - "Every pre-existing session revoked"
          - "Every pre-existing refresh token revoked"
        service_tokens_revoked: 0
        prohibited_changes:
          - "A pre-migration credential authenticating afterwards"
          - "api_tokens modified by the migration"
    - id: AC-46
      description: >
        Login refuses to issue when the password changed between verification
        and the per-user lock. An administrative reset committing in that
        window invalidates the credential the request presented, and issuing
        would hand out fresh credentials on the strength of a password that no
        longer opens the account.
      priority: critical
      references_constraints: [C-39]
      inputs:
        initial_state: "An enabled account whose current password is known"
        concurrent_ordering: >
          AdminResetPassword commits while the login transaction is blocked on
          the user lock, after the login has already verified the old password
        variants: ["Reset commits during the window", "Control, no reset"]
        method: >
          The disabling side holds the user row; the login blocks on it; the
          reset commits and releases. The ordering is imposed by the lock, and
          the test waits until a backend is observably blocked on the row
          rather than sleeping. The control runs the identical login with no
          reset in flight.
      expected_output:
        per_variant:
          Reset commits during the window:
            status: 401
            code: auth.invalid_credentials
            audit_reason: password_changed_during_login
            credentials_issued: 0
          Control, no reset:
            status: 200
        prohibited_changes:
          - "A session, refresh token or access token issued on a superseded password"
    - id: AC-47
      description: >
        An administrative reset applies the password change and the user-wide
        interactive revocation in ONE transaction under the per-user lock.
        A failure leaves neither applied, and no login can interleave between
        them.
      priority: critical
      references_constraints: [C-34, C-36, C-39]
      inputs:
        initial_state: "A live session and a live refresh family, password known"
        operation: "AdminResetPassword"
        variants: ["Commits", "Fails before commit", "Concurrent login attempt"]
        method: >
          The failure variant injects its failure inside the transaction, so
          the rollback is what leaves the password unchanged. The concurrency
          variant starts a login that must observe either the whole reset or
          none of it, never the password change without the revocation.
      expected_output:
        per_variant:
          Commits:
            durable_changes: ["password_hash replaced", "sessions live 0", "refresh live 0"]
            subsequent: ["The old password no longer authenticates", "The new password does"]
          Fails before commit:
            durable_changes: []
            prohibited_changes: ["The password changed with the revocation incomplete"]
          Concurrent login attempt:
            observed_states: ["either fully reset, or not reset at all"]
            prohibited_changes: ["Credentials issued from the pre-reset password after the reset committed"]
    - id: AC-48
      description: >
        Login revalidates CONFIRMED MFA enrollment under the lock. Enrollment
        completing while a login is in flight means that login needs an OTP it
        was not asked for, and is refused rather than issued.
      priority: critical
      references_constraints: [C-39]
      inputs:
        initial_state: "An enabled account with an unconfirmed MFA secret and a correct password"
        concurrent_ordering: >
          MFA confirmation commits while the login transaction is blocked on
          the user lock, after the login read enrollment as absent
        variants: ["Enrollment confirms during the window", "Control, not enrolled"]
        method: >
          Same lock-imposed ordering as AC-46, waiting until a backend is
          observably blocked on the user row. The control is the identical
          login with no enrollment in flight.
      expected_output:
        per_variant:
          Enrollment confirms during the window:
            status: 401
            code: auth.mfa_required
            audit_reason: mfa_required_during_login
            credentials_issued: 0
          Control, not enrolled:
            status: 200
        prohibited_changes:
          - "A login issued without an OTP for an account whose enrollment was confirmed before issuance"
    - id: AC-49
      description: >
        At the HANDLER, OTP consumption and credential issuance share one
        transaction. When issuance fails after a correct OTP, the OTP is not
        consumed and the same code still works on the next attempt.
      priority: critical
      references_constraints: [C-35]
      inputs:
        initial_state: "An MFA-enrolled account and a currently valid OTP"
        controlled_failure: "Issuance fails inside the login transaction, after the OTP validates"
        method: >
          Driven through the real login route, not the helper, because the
          helper-level criterion cannot observe whether the handler passed its
          transaction or the pool. The failure is injected so that the OTP has
          certainly validated before it fires.
        note: "This is the handler-level counterpart to AC-40, which covers the helper only"
      expected_output:
        response: {status: 503, code: server.error}
        durable_changes: []
        subsequent: ["A second login with the SAME OTP succeeds"]
        prohibited_changes:
          - "An auth_mfa_otp_uses row surviving a login that issued nothing"
          - "Credentials issued by the failed attempt"
    - id: AC-50
      description: >
        An unknown commit outcome is reported as NOT retryable and says nothing
        about retrying, on both the login and the refresh paths. No automatic
        replay follows, which matters because a replayed refresh is
        indistinguishable from theft and revokes the family.
      priority: critical
      references_constraints: [C-37, C-40]
      inputs:
        initial_state: "A live refresh chain and a live session"
        controlled_failure: "The commit outcome is indeterminate"
        variants:
          - name: "Durable commit, lost acknowledgement"
            setup: "The transaction committed; the acknowledgement never arrived"
          - name: "Non-durable"
            setup: "The transaction did not commit"
        method: >
          Both variants are driven through the real handler with the
          indeterminate outcome injected at the commit boundary, so the
          response fields are observed rather than reasoned about. The test
          also asserts that no second presentation of the same token is made
          by the server-side path.
      expected_output:
        response:
          status: 503
          code: server.error
          retryable: false
        message_mentions_retry: false
        identical_across_variants: true
        prohibited_changes:
          - "retryable true on an unknown outcome"
          - "A response instructing the client to retry"
          - "A second presentation of the same refresh token"
          - "Family revocation caused by the error response itself"
    - id: AC-51
      description: >
        The MFA enrollment and confirmation endpoints distinguish three
        outcomes: an OTP the server REJECTED, an infrastructure failure, and
        an UNKNOWN commit. A rejected OTP is a client failure and is audited
        as one. An infrastructure failure is not reported as an invalid OTP
        and emits no authentication-failure event. An unknown outcome claims
        neither that enrollment or confirmation succeeded nor that it failed,
        and is not retryable.
      priority: critical
      references_constraints: [C-32, C-40]
      inputs:
        initial_state: "An authenticated user, and for confirmation an enrolled secret with a valid OTP"
        operation: "POST /auth/mfa:enroll and POST /auth/mfa:verify"
        variants:
          - name: "Confirmation, OTP rejected"
            setup: "A wrong OTP, with no injected failure"
          - name: "Confirmation, unknown commit, durable"
            setup: "The transaction commits and the acknowledgement is lost"
          - name: "Confirmation, unknown commit, non-durable"
            setup: "The transaction does not commit and the outcome is unknown"
          - name: "Enrollment, unknown commit, durable"
            setup: "The transaction commits and the acknowledgement is lost"
          - name: "Enrollment, unknown commit, non-durable"
            setup: "The transaction does not commit and the outcome is unknown"
        method: >
          Driven through the real routes. The indeterminate outcomes are
          produced by substituting the transaction source, which selects the
          branch on demand rather than waiting for a real outage. The durable
          variant really commits before reporting the loss, so the assertion
          covers the case where the write survived.
      expected_output:
        per_variant:
          Confirmation, OTP rejected:
            status: 401
            code: auth.mfa_invalid
            audit: ["auth.mfa.failed"]
          Confirmation, unknown commit, durable:
            status: 503
            code: server.error
            retryable: false
            audit_excludes: ["auth.mfa.failed"]
          Confirmation, unknown commit, non-durable:
            identical_to: "Confirmation, unknown commit, durable"
          Enrollment, unknown commit, durable:
            status: 503
            code: server.error
            retryable: false
          Enrollment, unknown commit, non-durable:
            identical_to: "Enrollment, unknown commit, durable"
        prohibited_changes:
          - "An infrastructure failure reported as an invalid OTP"
          - "An authentication-failure audit event for a failure the user did not cause"
          - "retryable true on an unknown outcome"
          - "A response asserting that enrollment or confirmation failed when the outcome is unknown"
    - id: AC-52
      description: >
        The commit classifier decides by the error's MEANING. A SQLSTATE that
        states uncertainty is treated as uncertain, a SQLSTATE that states a
        known rollback is treated as known, and an error with no SQLSTATE is
        uncertain. The retryable set and the uncertain set are disjoint, so no
        unknown commit is ever retried.
      priority: critical
      references_constraints: [C-37]
      inputs:
        operation: "Classify a commit error"
        variants:
          - name: "No SQLSTATE"
            setup: "A transport error"
          - name: "40003 statement_completion_unknown"
          - name: "08007 transaction_resolution_unknown"
          - name: "08006 connection_failure"
          - name: "40001 serialization_failure"
          - name: "40P01 deadlock_detected"
          - name: "23505 unique_violation"
        method: >
          The classifier is a pure function over synthetic pgconn.PgError
          values, so every code is exercised exactly and on every run. The
          disjointness of the two sets is asserted over the same table rather
          than argued in a comment.
      expected_output:
        per_variant:
          No SQLSTATE: {indeterminate: true, retryable: false}
          40003 statement_completion_unknown: {indeterminate: true, retryable: false}
          08007 transaction_resolution_unknown: {indeterminate: true, retryable: false}
          08006 connection_failure: {indeterminate: true, retryable: false}
          40001 serialization_failure: {indeterminate: false, retryable: true}
          40P01 deadlock_detected: {indeterminate: false, retryable: true}
          23505 unique_violation: {indeterminate: false, retryable: false}
        invariant: "No variant is both indeterminate and retryable"
        prohibited_changes:
          - "A code that states uncertainty classified as determinate"
          - "An automatic retry of anything outside the approved rollback codes"
    - id: AC-53
      description: >
        A failure INSIDE MFA verification is classified by its meaning, not
        assumed to be a rejected OTP. Only the determinate client-side
        answers, a wrong code, a replayed code and an account with no secret,
        are refusals. Everything else, an unreadable secret, a failed lookup,
        a failed consumption write, is handed back to the transaction runner
        so it rolls back and classifies the outcome, and is reported as an
        infrastructure failure with no authentication-failure audit and no
        durable effect. This applies to the confirmation endpoint AND to
        login, which used the same blanket assumption.
      priority: critical
      references_constraints: [C-32, C-35]
      inputs:
        initial_state: "An MFA-enrolled account with a currently valid OTP"
        operation: "POST /auth/mfa:verify, and separately POST /auth/login carrying an OTP"
        variants:
          - name: "Confirmation, secret unreadable"
            setup: "The stored ciphertext is corrupted, so decryption fails deterministically"
          - name: "Confirmation, consumption write fails"
            setup: "A trigger raises on INSERT into auth_mfa_otp_uses"
          - name: "Confirmation, wrong OTP"
            setup: "A code outside the window, no injected failure"
          - name: "Confirmation, replayed OTP"
            setup: "A code already consumed, no injected failure"
          - name: "Login, secret unreadable"
            setup: "The stored ciphertext is corrupted"
          - name: "Login, consumption write fails"
            setup: "A trigger raises on INSERT into auth_mfa_otp_uses"
          - name: "Confirmation, rejection with an unknown commit"
            setup: "A wrong OTP AND an indeterminate commit outcome, together"
        method: >
          Both failures are real and deterministic: corrupted ciphertext makes
          decryption fail on the crypto path with no SQL error, and a trigger
          makes the consumption write fail with a SQLSTATE inside the
          transaction. Neither needs a code seam, and each fires on every run.
          The preserved rejection cases run with no injection at all.
      expected_output:
        per_variant:
          Confirmation, secret unreadable:
            status: 503
            code: server.error
            audit_excludes: ["auth.mfa.failed"]
            durable_changes: []
          Confirmation, consumption write fails:
            status: 503
            code: server.error
            audit_excludes: ["auth.mfa.failed"]
            durable_changes: []
          Confirmation, wrong OTP:
            status: 401
            code: auth.mfa_invalid
            audit: ["auth.mfa.failed"]
          Confirmation, replayed OTP:
            status: 401
            code: auth.mfa_invalid
            audit: ["auth.mfa.failed"]
          Login, secret unreadable:
            status: 503
            code: server.error
            credentials_issued: 0
            audit_excludes: ["auth.mfa.failed"]
          Login, consumption write fails:
            status: 503
            code: server.error
            credentials_issued: 0
            audit_excludes: ["auth.mfa.failed"]
          Confirmation, rejection with an unknown commit:
            status: 503
            code: server.error
            retryable: false
            audit_excludes: ["auth.mfa.failed"]
            rationale: "The transaction outcome outranks the rejection: 401 would assert the code was bad while the server cannot say what it committed"
        prohibited_changes:
          - "An infrastructure failure inside verification reported as an invalid OTP"
          - "An authentication-failure audit event for a failure the user did not cause"
          - "An auth_mfa_otp_uses row surviving a rolled-back attempt"
          - "A recorded rejection concealing a failed or unknown transaction outcome"
    - id: AC-54
      description: >
        The Bearer binder compares the bound session's owner with the token's
        subject and refuses a mismatch as session_owner_mismatch. The token is
        correctly signed and the session is live in every case, so the refusal
        is attributable to ownership alone.
      priority: critical
      references_constraints: [C-38]
      inputs:
        initial_state: "Two enabled accounts, each with its own live session"
        operation: "Present a correctly signed token whose sub is one user and whose sid names the OTHER user's live session"
        variants: ["Mismatched pair", "Own session control"]
        method: >
          Both tokens are minted by the real issuer, so signature and exp are
          valid, and both sessions are live and unrevoked. Only the pairing
          differs. One request per variant, no concurrency.
      expected_output:
        per_variant:
          Mismatched pair: {status: 401, audit_reason: session_owner_mismatch, identity_bound: false}
          Own session control: {status: 200}
        prohibited_changes:
          - "A token binding a session that belongs to another user"
          - "The mismatch binding either the subject or the session owner"
    - id: AC-55
      description: >
        Rotation refuses a refresh token whose LINKED session is revoked, on
        both refresh endpoints, and mints nothing. The token's own row is live
        and unconsumed, so the refusal is attributable to the session.
      priority: critical
      references_constraints: [C-38]
      inputs:
        initial_state: >
          A live, unconsumed refresh token attached to a session that is then
          revoked. Each endpoint gets its OWN fixture so neither result can be
          explained by the other having consumed the token.
        operation: "POST /auth/refresh; separately POST /auth/refresh-cookie"
        variants: ["Body path", "Cookie path", "Body path control", "Cookie path control"]
        method: >
          The session is revoked by direct update, leaving the refresh row
          untouched and unconsumed. Separate users per variant. One request
          each, no concurrency.
      expected_output:
        per_variant:
          Body path: {refused: true, credentials_issued: 0}
          Cookie path: {refused: true, session_cookie_issued: false, sessions_created: 0}
          Body path control: {refused: false}
          Cookie path control: {refused: false}
        prohibited_changes:
          - "A rotation succeeding for a token whose session is revoked"
          - "A cookie-path refusal that still minted a session"
          - "The refusal being reported as reuse, which would revoke other families"
    - id: AC-56
      description: >
        Revoking a session makes its descendants unusable, and logout obeys
        the same serialization protocol as the issuance paths so a concurrent
        rotation cannot escape it. Asserted in BOTH orders. Other login
        families and service-account tokens are untouched.
      priority: critical
      references_constraints: [C-34, C-36, C-38]
      inputs:
        initial_state: >
          A logged-in user whose refresh lineage has been rotated on the BODY
          path, so the live token is attached to the original session while
          the browser cookie holds the consumed one. A second independent
          login for the same user, and one service-account token.
        operation: "Log out, and race a rotation against it"
        variants:
          - name: "Logout then refresh"
            setup: "The logout commits first, then the rotation is attempted"
          - name: "Refresh then logout"
            setup: "The rotation commits first, then the logout runs"
          - name: "Concurrent, logout blocked on the lock"
            setup: "A rotation holds the per-user lock; the logout waits, then proceeds"
        method: >
          The lineage is desynchronized on purpose by rotating on the body
          path first, because the cookie path REBINDS each successor and would
          otherwise hide the case. Ordering is imposed by the per-user lock and
          observed through pg_stat_activity, not by sleeping.
        scope: "Targeted logout. It is not extended to the user's other login families"
      expected_output:
        per_variant:
          Logout then refresh:
            durable_changes: ["The session revoked", "Every refresh token attached to it revoked"]
            subsequent: ["Neither refresh endpoint rotates", "No session is minted"]
          Refresh then logout:
            subsequent: ["After the logout, no credential attached to that session rotates or authenticates"]
          Concurrent, logout blocked on the lock:
            final_state: "No live credential attached to the logged-out session"
            prohibited_changes: ["A live successor attached to a session that is already revoked"]
        preserved:
          - "The second independent login still authenticates"
          - "The service-account token is untouched"
    - id: AC-57
      description: >
        Bearer traffic is exempt from the session's IDLE window and bounded by
        its ABSOLUTE deadline, which is evaluated in the database. A Bearer
        request past the idle window but inside the absolute window is
        honored and does not advance the idle window; past the absolute
        deadline it is refused as session_absolute_expired.
      priority: critical
      references_constraints: [C-29, C-38]
      inputs:
        initial_state: "A live session whose idle window has passed and whose absolute deadline has not"
        operation: "Present the session-bound access token"
        variants: ["Past idle, inside absolute", "Past absolute", "Fresh control"]
        method: >
          The deadlines are set by direct update rather than by waiting, so
          the case is exact. The idle window is read before and after the
          request to prove it did not move. Nothing depends on this process's
          clock, which is the point of evaluating the deadline in the database.
      expected_output:
        per_variant:
          Past idle, inside absolute:
            status: 200
            idle_window_advanced: false
          Past absolute:
            status: 401
            audit_reason: session_absolute_expired
          Fresh control:
            status: 200
            idle_window_advanced: false
        prohibited_changes:
          - "A Bearer request refused for idle expiry"
          - "A Bearer request advancing expires_at or last_seen"
          - "The absolute deadline decided against the application clock"
    - id: AC-58
      description: >
        The refresh_tokens.session_id foreign key does not cascade on delete.
        Deleting a session that still has refresh rows is REFUSED by the
        database rather than silently removing them, and no retention behavior
        changes.
      priority: critical
      references_constraints: [C-38]
      inputs:
        initial_state: "A session with at least one refresh token attached"
        operation: "DELETE the session row"
        method: >
          The delete is attempted directly against the database and its error
          is inspected, so the assertion is about the actual constraint rather
          than about what the migration text appears to say.
      expected_output:
        delete_refused: true
        sqlstate: "23503"
        durable_changes: []
        prohibited_changes:
          - "Refresh rows removed as a side effect of deleting a session"
          - "A retention policy change introduced by this schema choice"
    - id: AC-59
      description: >
        A targeted logout ends the login family even when the cookie path has
        REBOUND the family's live successor to a session the logout does not
        name. Presenting the credentials the client held BEFORE that rotation
        must still end it.
      priority: critical
      references_constraints: [C-36, C-38, C-41]
      inputs:
        initial_state: "A login, then ONE cookie refresh, which rebinds the successor to a new session"
        operation: "Log out presenting the session and refresh cookies held BEFORE the rotation"
        method: >
          One rotation, then one logout, then the state is read directly. No
          concurrency and no elapsed-time dependence.
      expected_output:
        live_sessions: 0
        live_refresh_tokens: 0
        subsequent: ["The rebound session does not authenticate"]
        prohibited_changes:
          - "A live successor attached to a session the logout did not name"
          - "Revoking anything outside this family"
        red_evidence: "Red at 4b20d627: live sessions 1, live refresh 1, rebound session answered 200. Expected green after the C-41 implementation."
    - id: AC-60
      description: >
        Both ACTUAL orderings of a real refresh against a real logout end the
        family. Neither order may leave a usable credential, including the
        PREDECESSOR session the cookie path replaced.
      priority: critical
      references_constraints: [C-36, C-38, C-41]
      inputs:
        initial_state: "A logged-in user"
        operation: "Perform a real cookie refresh and a real logout"
        variants:
          - name: "Refresh commits, then logout"
            setup: "The rotation completes; the client logs out with exactly what it then holds"
          - name: "Logout commits, then refresh"
            setup: "The logout completes; the client then attempts both refresh paths"
        method: >
          Both are real HTTP requests in sequence, not simulated state. The
          client's cookies are taken from the responses, so what is presented
          is what a browser would hold.
      expected_output:
        per_variant:
          Refresh commits, then logout:
            live_sessions: 0
            live_refresh_tokens: 0
          Logout commits, then refresh:
            live_sessions: 0
            live_refresh_tokens: 0
            subsequent: ["Neither refresh path rotates"]
        prohibited_changes: ["A predecessor session surviving a logout of its successor"]
        red_evidence: "At 4b20d627 logout-then-refresh passed and refresh-then-logout was red: the predecessor session and its consumed token stayed live. Expected green after the C-41 implementation."
    - id: AC-61
      description: >
        A targeted logout ends ONE family. A second, independent login
        belonging to the SAME user keeps working, and that user's
        service-account token is untouched. This is the guard on any fix that
        reaches rebound descendants: a fix that revoked by user_id would
        satisfy AC-59 and AC-60 and break this.
      priority: critical
      references_constraints: [C-36, C-41]
      inputs:
        initial_state: "Two independent logins for one user, one service-account token, and a cookie rotation on the first family"
        operation: "Log out of the FIRST family"
        method: "Two real logins, one rotation, one logout, then both families are exercised."
      expected_output:
        first_family: {live_sessions: 0, live_refresh_tokens: 0}
        second_family: {authenticates: true}
        service_tokens_revoked: 0
        prohibited_changes:
          - "The second login signed out by the first's logout"
          - "A service-account token revoked by an interactive logout"
        red_evidence: "Passing at 4b20d627 as the guard, and required to stay passing."
    - id: AC-62
      description: >
        Logout revokes the session it names even when that session is
        IDLE-EXPIRED, and ends its family. An idle-expired session is not
        harmless: Bearer traffic is exempt from the idle window (C-38), so a
        token bound to it still authenticates.
      priority: critical
      references_constraints: [C-36, C-38, C-41]
      inputs:
        initial_state: "A logged-in user whose session is past its idle window and inside its absolute deadline"
        operation: "Log out presenting that session cookie and a live refresh cookie"
        method: >
          The idle window is aged by direct update rather than by waiting, so
          the case is exact. One logout, then the state is read and the bound
          access token is presented.
      expected_output:
        session_revoked: true
        live_sessions: 0
        live_refresh_tokens: 0
        subsequent: ["A Bearer token bound to that session does not authenticate"]
        prohibited_changes:
          - "A 204 logout that revoked nothing"
          - "A session left unrevoked because a verification helper refused it as expired"
        red_evidence: "Red at 4b20d627: logout answered 204 with 0 sessions revoked, live sessions 1, live refresh 1, and the bound Bearer token answered 200. Expected green after the C-41 implementation."
    - id: AC-63
      description: >
        A session cookie ALONE locates and ends a rebound family. With no
        refresh cookie presented, logout still reaches the successor the cookie
        path rebound to a new session, and the predecessor behind it.
      priority: critical
      references_constraints: [C-41]
      inputs:
        initial_state: "A login followed by one cookie refresh, so the family spans two sessions"
        operation: "Log out presenting ONLY a session cookie"
        variants: ["Pre-rotation session cookie only", "Post-rotation session cookie only"]
        method: "One rotation, one logout per variant on separate users, then the state is read directly."
      expected_output:
        per_variant:
          Pre-rotation session cookie only: {live_sessions: 0, live_refresh_tokens: 0}
          Post-rotation session cookie only: {live_sessions: 0, live_refresh_tokens: 0}
        prohibited_changes: ["Requiring a refresh cookie to reach the family"]
    - id: AC-64
      description: >
        An IDLE-EXPIRED session cookie alone ends its family, including the
        still-valid Bearer credentials bound to it. The expired cookie locates
        the family for logout and authorizes nothing else.
      priority: critical
      references_constraints: [C-38, C-41]
      inputs:
        initial_state: "A session past its idle window, inside its absolute deadline, with a working bound access token"
        operation: "Log out presenting ONLY that session cookie; then present the cookie to a protected route"
        method: >
          The idle window is aged by direct update. The access token is shown
          working before the logout, so the refusal after it is attributable to
          the logout.
      expected_output:
        before_logout: {bearer_status: 200}
        after_logout:
          bearer_status: 401
          live_sessions: 0
          live_refresh_tokens: 0
        protected_route_with_expired_cookie: {status: 401}
        prohibited_changes: ["The expired cookie authorizing any request other than logout"]
    - id: AC-65
      description: >
        When both cookies resolve but name DIFFERENT families, logout revokes
        only the session cookie's family, leaves the refresh cookie's family
        untouched, and records the disagreement in the declared auth.logout
        detail without any credential value.
      priority: critical
      references_constraints: [C-41]
      inputs:
        initial_state: "Two independent logins for one user, A and B"
        operation: "Log out presenting A's session cookie with B's refresh cookie"
        method: "Two real logins, one logout, then both families are exercised and the audit row is read."
      expected_output:
        family_a: {live_sessions: 0, live_refresh_tokens: 0}
        family_b: {authenticates: true, refreshes: true}
        audit:
          action: auth.logout
          detail: {anchor: session, target_conflict: true}
          detail_excludes: ["any session or refresh token value"]
        prohibited_changes:
          - "Revoking B's family"
          - "Unioning the two families"
    - id: AC-66
      description: >
        A failure during the family sweep rolls back EVERY revocation. Logout
        reports the failure, and no session or refresh row in the family
        changes.
      priority: critical
      references_constraints: [C-34, C-41]
      inputs:
        initial_state: "A family spanning two sessions after one cookie refresh"
        controlled_failure: "A trigger raises on UPDATE of refresh_tokens, after the session revocation has run"
        method: >
          The trigger makes the second revocation statement fail inside the
          transaction, so a non-atomic implementation would leave the sessions
          revoked and the refresh rows live.
      expected_output:
        response: {status: 500, code: auth.logout_incomplete}
        durable_changes: []
        prohibited_changes: ["Sessions revoked while the family's refresh rows stay live"]
    - id: AC-67
      description: >
        Family isolation is enforced during traversal. A link to a row owned by
        another user makes logout revoke NOTHING rather than widen, and a cycle
        in rotated_to_id terminates without touching anything outside the
        family.
      priority: critical
      references_constraints: [C-41]
      inputs:
        variants:
          - name: "Cross-user link"
            setup: "The family's refresh row is made to point at another user's refresh row through rotated_to_id"
          - name: "Rotation cycle"
            setup: "Two of the family's refresh rows point at each other through rotated_to_id"
        operation: "Log out with the family's session cookie"
        method: "The inconsistent links are written directly, so the case is exact and does not depend on a race."
      expected_output:
        per_variant:
          Cross-user link:
            response: {status: 500, code: auth.logout_incomplete}
            durable_changes: []
            other_user: {authenticates: true}
          Rotation cycle:
            response: {status: 204}
            family: {live_sessions: 0, live_refresh_tokens: 0}
            terminates: true
        prohibited_changes:
          - "User-wide revocation as a fallback"
          - "Revoking another user's credentials"
          - "An unbounded traversal"
    - id: AC-68
      description: >
        Logout refuses a cookie-authorized request whose CSRF token is missing
        or mismatched, before any revocation and without touching cookies, and
        performs the intended revocation when the token is valid. This holds
        for a session cookie alone, a refresh cookie alone, both cookies, and
        conflicting cookies, and an Authorization header does not bypass it.
      priority: critical
      references_constraints: [C-41, C-42]
      inputs:
        anchors: ["Session cookie only", "Refresh cookie only", "Both cookies, same family", "Conflicting cookies"]
        csrf_states: ["Missing", "Mismatched", "Valid"]
        extra_variant: "Session cookie only, missing CSRF, WITH an Authorization header"
        method: >
          Every anchor is crossed with every CSRF state, each on a fresh login,
          so a refusal in one case cannot hide state from another. The state is
          read directly before and after, and the response's Set-Cookie
          headers are inspected.
      expected_output:
        per_csrf_state:
          Missing:
            status: 403
            code: authz.csrf_invalid
            durable_changes: []
            set_cookie: []
          Mismatched:
            status: 403
            code: authz.csrf_invalid
            durable_changes: []
            set_cookie: []
          Valid:
            status: 204
            revoked: "The family selected under C-41 (the session cookie's family when the cookies conflict)"
        authorization_header_variant: {status: 403, durable_changes: []}
        prohibited_changes:
          - "Any revocation on a refused request"
          - "A refused request clearing or replacing a cookie"
          - "An Authorization header bypassing the check while cookies select the target"
    - id: AC-69
      description: >
        An UNKNOWN commit outcome on logout is reported truthfully: 503
        server.error, not retryable, with wording that the revocation could not
        be confirmed. Neither the response nor the log asserts success or
        rollback, no automatic replay occurs, and both credential cookies are
        still cleared. A KNOWN rollback stays distinct (AC-66).
      priority: critical
      references_constraints: [C-37, C-40, C-41]
      inputs:
        initial_state: "A logged-in user"
        controlled_failure: "The revocation transaction's commit outcome is indeterminate"
        variants:
          - name: "Durable commit, lost acknowledgement"
            setup: "The transaction commits, then the acknowledgement is lost"
          - name: "Non-durable"
            setup: "The transaction does not commit, and the outcome is unknown"
        method: >
          Driven through the real logout route with the transaction source
          substituted, which selects each outcome deterministically. The
          substitute counts transactions begun, so a replay would be visible.
          The server log is captured for the request.
      expected_output:
        response:
          status: 503
          code: server.error
          retryable: false
          message_states: "revocation could not be confirmed"
        identical_across_variants: true
        transactions_begun: 1
        set_cookie_clears: [openwatch_session, openwatch_refresh]
        log_states: "outcome unknown"
        durable_state:
          Durable commit, lost acknowledgement: "family revoked"
          Non-durable: "family live"
        prohibited_changes:
          - "A response or log asserting the family was revoked"
          - "A response or log asserting nothing was revoked"
          - "retryable true"
          - "A second revocation attempt"
    - id: AC-70
      description: >
        Re-enabling a disabled account revokes every interactive credential the
        user holds, atomically with the transition, and a fresh login
        afterwards succeeds. This includes credentials that exist at enable
        time without ever having been revoked, which is the state an older
        release or a leaked issuance path can leave behind. The transition is
        serialized on the per-user lock.
      priority: critical
      references_constraints: [C-34, C-36]
      inputs:
        initial_state: >
          A disabled user holding, at enable time, a live session row and its
          cookie, a live refresh token, and an access token bound to that
          session. The credentials are written directly for the disabled user,
          bypassing the handlers, so the criterion measures what Enable does
          with stray state rather than whether issuance is prevented.
        operation: "Enable(user)"
        variants:
          - name: "Transition"
            setup: "The enable commits"
          - name: "Controlled failure"
            setup: "A trigger fails the refresh-token revocation, so the enable transaction fails before commit"
          - name: "Serialized"
            setup: "A second connection holds the per-user lock when Enable starts"
        method: >
          Each variant calls the real Enable, then presents each credential to
          the real cookie binder, the real Bearer binder, and both refresh
          endpoints. A fresh login runs afterwards through the real login
          handler. No elapsed-time dependence.
      expected_output:
        per_variant:
          Transition:
            returns: {transitioned: true, error: nil}
            durable_changes:
              - "disabled_at cleared"
              - "Every interactive session and refresh token for the user revoked"
            interactive_credentials_authenticating_afterward: 0
            subsequent: ["A fresh login succeeds and its session authenticates"]
          Controlled failure:
            returns: {transitioned: false}
            enable_returns_error: true
            durable_changes: []
            prohibited_changes:
              - "disabled_at cleared without the revocation"
              - "Credentials revoked without the account being enabled"
          Serialized:
            enable_waits_for_the_lock: true
            completes_after_release: true
        response_cookies_audit: >
          Enable is a service call and sets no cookie. The HTTP response and
          the admin.user.enabled audit detail are api-users AC-17 and AC-20.
        prohibited_changes:
          - "Any pre-enable session cookie, refresh token or session-bound access token authenticating"

    - id: AC-71
      description: >
        Enable on an account that is not disabled is a no-op. It changes no
        row, revokes nothing, and signs nobody out. An unknown or soft-deleted
        user is reported as not found.
      priority: critical
      references_constraints: [C-34, C-36]
      inputs:
        initial_state: "An enabled user with a live session, a live refresh token and a working access token"
        operation: "Enable(user)"
        variants:
          - "Already enabled"
          - "Repeated: Enable twice in succession"
          - "Unknown or soft-deleted user"
      expected_output:
        per_variant:
          Already enabled:
            returns: {transitioned: false, error: nil}
            durable_changes: []
            credentials_revoked: 0
            subsequent: ["The pre-existing session, access token and refresh token still work"]
          Repeated:
            identical_to: "Already enabled"
          Unknown or soft-deleted user:
            returns: {transitioned: false, error: ErrUserNotFound}
        response_cookies_audit: "A service call; the HTTP response and audit detail are api-users AC-19 and AC-20"
        prohibited_changes:
          - "Any credential revoked by an enable that changed no account state"
          - "updated_at bumped by a no-op"

    - id: AC-72
      description: >
        Service-account tokens are outside the enable policy. Enable never
        revokes one and never restores one that was revoked.
      priority: high
      references_constraints: [C-36]
      inputs:
        initial_state: >
          A disabled user owning two owk_ tokens created before the disable:
          one otherwise valid, one permanently revoked
        operation: "Enable(user)"
        scope: >
          Asserts the separation only. Whether an owk_ token authenticates
          while its owner is disabled is a separate, service-token policy
          and is not asserted here.
      expected_output:
        durable_changes_to_api_tokens: []
        response_cookies_audit: "A service call; nothing is set or emitted about service-account tokens"
        per_token:
          Otherwise valid:
            revoked_by_enable: false
          Permanently revoked:
            authenticates_after_enable: false

    - id: AC-73
      description: >
        A request that cannot take the per-user lock within the limit
        answers 503 and decides nothing, on every credential path and on all
        four administrative account mutations.
      priority: critical
      references_constraints: [C-34, C-43]
      inputs:
        initial_state: "A second connection holds the per-user lock for longer than the limit"
        paths:
          - "POST /auth/login"
          - "POST /auth/refresh"
          - "POST /auth/refresh-cookie"
          - "POST /auth/logout"
          - "POST /users/{id}:disable"
          - "POST /users/{id}:enable (the user disabled beforehand)"
          - "POST /users/{id}:reset-password"
          - "DELETE /users/{id}"
        method: >
          The unmodified server, with no test override of either limit, on a
          pool explicitly sized to 8 connections, one case at a time. Each
          case confirms every connection is back in the pool before the next
          begins. A safety timer releases the held lock well after the
          limit, so a missing limit fails the test instead of hanging it.
        fixture_history: >
          The first version ran the eight cases in parallel on the default
          pool, whose size follows the CPU count. On a 4-connection pool the
          holders starved the requests of connections, so they hit the
          15 s operation deadline instead of the lock limit (Go CI run
          36081673305, reproduced locally with an explicit 4-connection
          pool). That was a fixture assumption, separate from the
          production defect AC-90 covers.
      expected_output:
        per_path:
          logout:
            response: {status: 503, code: server.error, retryable: false}
            message_states: "the account lock could not be acquired, so nothing was revoked"
            cookies: "Both credential cookies cleared"
          every_other_path:
            response: {status: 503, code: server.error, retryable: true}
            cookies: "None set and none cleared"
        answered_after: "The limit, not before it"
        transaction_effects: []
        audit: "No success event for the attempt"
        prohibited_changes:
          - "A credential issued or revoked"
          - "The account disabled, enabled, reset or deleted although the change was reported not applied"
        subsequent: ["The presented session still authenticates, except on the enable path, where it was revoked by the earlier disable"]

    - id: AC-74
      description: >
        A refresh racing Disable leaves nothing usable once Disable returns,
        in both orders and on both refresh paths.
      priority: critical
      references_constraints: [C-34, C-36]
      inputs:
        variants:
          - "Disable commits after the refresh's pre-lock reads and before it takes the lock"
          - "The refresh holds the lock, Disable queues behind it, the refresh commits"
        attribution: "Credential rows by ID: before, after the coordinator, after the attempt"
      expected_output:
        first_order:
          response: {status: 401}
          cookies: "No credential cookie set"
          transaction_effects: "The refresh writes no row"
        second_order:
          response: {status: 200}
          transaction_effects: "Every row the refresh wrote is revoked once Disable returns"
        audit: "Not asserted"
        prohibited_changes: ["Any predecessor or successor credential authenticating after Disable returns"]

    - id: AC-75
      description: >
        Credentials revoked by Disable stay revoked after Enable. Only a fresh
        sign-in works.
      priority: critical
      references_constraints: [C-36]
      inputs:
        initial_state: "A signed-in user"
        operation: "Disable, then Enable, then present the pre-disable session cookie, access token and both refresh tokens"
      expected_output:
        responses:
          session_cookie: {status: 401}
          access_token: {status: 401}
          body_refresh: "Not 200"
          cookie_refresh: "Not 200, and no session cookie set"
        credentials_authenticating: 0
        transaction_effects: "Enable revokes nothing further: Disable already revoked every credential"
        audit: "Not asserted"
        subsequent: ["A fresh sign-in succeeds"]

    - id: AC-76
      description: >
        MFA is decided under the lock. Two logins presenting one code issue
        once. A secret rotated after the pre-lock reads refuses the old
        code. An enrollment removed after the pre-lock reads lets the login
        issue without consuming anything, as C-39 requires.
      priority: critical
      references_constraints: [C-35, C-39]
      inputs:
        variants:
          - "Same code, two logins serialized behind the lock"
          - "Secret rotated and confirmed before the login takes the lock"
          - "Enrollment removed before the login takes the lock"
      expected_output:
        cookies: "Set only on the successful login"
        audit: "Not asserted"
        same_code: {successful_logins: 1, refused_code: auth.mfa_invalid, otp_uses_added: 1, sessions_added: 1}
        secret_rotated: {code: auth.mfa_invalid, rows_added: 0, otp_uses_added: 0}
        enrollment_removed: {status: 200, sessions_added: 1, otp_uses_added: 0}

    - id: AC-77
      description: >
        A retried transaction acts on the state it reads on the retry, not on
        what the lost attempt read.
      priority: critical
      references_constraints: [C-37]
      inputs:
        variants: ["40P01 on the first attempt", "40001 on the first attempt"]
        between_attempts: "The account is disabled through the real users service"
      expected_output:
        transactions_begun: 2
        response: {status: 401}
        cookies: "No credential cookie set"
        rows_added: 0
        audit: "Not asserted"

    - id: AC-78
      description: >
        Every password and refresh issuance path, paused after its pre-lock
        reads and released after an invalidating mutation commits, issues
        nothing.
      priority: critical
      references_constraints: [C-34, C-39]
      inputs:
        paths: ["Login", "Login with MFA", "Body refresh", "Cookie refresh"]
        coordinators: ["Disable", "Administrative password reset"]
        attribution: >
          Credential row IDs are read before the coordinator, right after
          it, and after the attempt. The coordinator's own changes are
          asserted separately: it inserts nothing and revokes every live
          row. Any ID that appears after it belongs to the attempt.
      expected_output:
        attempt_rows_added: 0
        otp_uses_added: 0
        prohibited_changes: ["A 200 response", "A credential cookie", "A token in the response body"]
        cookies: "No credential cookie set"
        audit: "Not asserted"

    - id: AC-79
      description: >
        A rotation whose commit fails reports no credential, sets no cookie,
        and leaves the presented token usable.
      priority: critical
      references_constraints: [C-34, C-37]
      inputs:
        variants: ["Body refresh", "Cookie refresh"]
        controlled_failure: "The commit is a known rollback"
      expected_output:
        response: {status: 503, code: server.error}
        cookies: "No credential cookie set"
        body: "No access or refresh token"
        credential_rows_changed: false
        audit: "Not asserted"
        subsequent: ["The same token rotates on the next request"]

    - id: AC-80
      description: >
        Every reason the code can record on auth.login.failure is declared
        in the event's detail_schema in audit/events.yaml.
      priority: high
      references_constraints: [C-11]
      inputs:
        method: >
          A source scan collects the literals that reach detail.reason
          through the shapes the binder, the account-state verdicts and the
          login, refresh and SSO handlers use. It first proves it still sees
          one reason of each shape, then compares against the declaration.
        known_limit: "A reason produced through a shape the scan does not read is invisible to it"
      expected_output:
        undeclared_reasons: []

    - id: AC-81
      description: >
        A lock that times out after the per-user lock was acquired rolls the
        transaction back, and the answer does not claim the account lock was
        never acquired.
      priority: critical
      references_constraints: [C-43]
      inputs:
        initial_state: "A second connection holds FOR UPDATE on the user's rows in a later table, not on the users row"
        method: "One case at a time on a pool explicitly sized to 8 connections; every connection is back in the pool before the next case"
        variants:
          - name: "Body refresh"
            held: "refresh_tokens"
          - name: "Logout"
            held: "refresh_tokens"
            note: "The refresh rows are the later lock here; a held session row is AC-86"
          - name: "Administrative disable"
            held: "sessions"
      expected_output:
        per_variant:
          Body refresh:
            response: {status: 503, code: server.error, retryable: true}
            cookies: "None set"
            subsequent: ["The same token rotates after the lock is released"]
          Logout:
            response: {status: 500, code: auth.logout_incomplete}
            cookies: "Both credential cookies cleared"
          Administrative disable:
            response: {status: 503, code: server.error, retryable: true}
            transaction_effects: "The account is not disabled"
        answered_after: "The lock limit"
        message_must_not_state: "The account lock was not acquired"
        transaction_effects: "No credential row changes"
        audit: "Not asserted"

    - id: AC-82
      description: >
        The serialized operation has a deadline. It exists without the
        caller supplying one, never extends an earlier caller deadline,
        makes an expiry during the commit an unknown outcome, and makes an
        expiry before the commit a known failure. The users service honors
        an earlier caller deadline the same way.
      priority: critical
      references_constraints: [C-37, C-43]
      inputs:
        variants:
          - "No caller deadline"
          - "A caller deadline earlier than OperationDeadline"
          - "The deadline expires while the commit is in progress"
          - "The deadline expires while waiting for the per-user lock"
          - "Users service Disable with a 1 second caller deadline while another connection holds the per-user lock"
        method: >
          The first four drive RunSerialized with a transaction source whose
          lock or commit blocks until its context ends. The last uses the
          real database.
      expected_output:
        per_variant:
          No caller deadline: {deadline_present: true, at_most: "OperationDeadline from the start"}
          Earlier caller deadline: {deadline: "The caller's, unchanged"}
          Expiry during commit: {error: ErrCommitUnknown, transactions_begun: 1}
          Expiry while waiting for the lock: {error: "context.DeadlineExceeded", not: [ErrCommitUnknown, ErrLockWaitExceeded], transactions_begun: 1}
          Users service Disable: {returns: "An error, before the lock limit", transaction_effects: "Account not disabled; no credential row changes"}
        response_cookies_audit: "Asserted at the HTTP layer by AC-73 and AC-81"

    - id: AC-83
      description: >
        An ordinary cookie request whose session row is locked by another
        transaction answers 503 once the lock limit expires. The protected
        handler does not run, no cookie changes, and the session is untouched.
      priority: critical
      references_constraints: [C-44]
      inputs:
        initial_state: "A live session; a second connection holds FOR UPDATE on its row past the lock limit"
        operation: "GET /auth/me with the session cookie and its own correlation id"
      expected_output:
        response: {status: 503, code: server.error, retryable: true}
        handler_ran: false
        cookies: "None set and none cleared"
        answered_after: "The lock limit"
        audit: {action: auth.login.failure, reason: session_lookup_failed, read_by: "The request's correlation id"}
        transaction_effects: "The session's expires_at is unchanged"
        subsequent: ["After the lock is released the session authenticates"]

    - id: AC-84
      description: >
        A lock released before the limit lets verification finish normally,
        and the idle window is extended.
      priority: high
      references_constraints: [C-44]
      inputs:
        initial_state: "A live session whose row is held by a second connection"
        operation: "GET /auth/me with the session cookie; the lock is released about one second after the request starts waiting"
      expected_output:
        response: {status: 200}
        handler_ran: true
        cookies: "None changed"
        transaction_effects: "The session's expires_at moves later"
        audit: "Not asserted"

    - id: AC-85
      description: >
        A session revoked while verification waits for its row is refused.
        The request does not authenticate from the read it made before
        waiting.
      priority: critical
      references_constraints: [C-44]
      inputs:
        initial_state: "A live session; a second connection revokes it and holds the row uncommitted"
        operation: "GET /auth/me with the session cookie; the revocation commits while the request waits"
      expected_output:
        response: {status: 401}
        handler_ran: false
        audit: {action: auth.login.failure, reason: session_revoked, read_by: "The request's correlation id"}
        transaction_effects: "The idle window is not extended"
        cookies: "Not asserted"

    - id: AC-86
      description: >
        Logout under a real session-row lock reaches its own bounded outcome
        instead of waiting in the binder.
      priority: critical
      references_constraints: [C-41, C-43, C-44]
      inputs:
        initial_state: "A signed-in user; a second connection holds FOR UPDATE on the user's session rows"
        operation: "POST /auth/logout with both cookies and a valid CSRF pair"
      expected_output:
        response: {status: 500, code: auth.logout_incomplete}
        cookies: "Both credential cookies cleared"
        answered_after: "One lock limit, in the revocation; the binder did not wait"
        message_must_not_state: "The account lock was not acquired"
        transaction_effects: "No credential row changes"
        audit: "No auth.logout event (nothing was revoked); not asserted"

    - id: AC-87
      description: >
        An earlier caller deadline ends verification before the lock limit,
        and a credential request has one time budget across the binder and
        the handler, not one per layer.
      priority: critical
      references_constraints: [C-43, C-44]
      inputs:
        variants:
          - name: "Earlier caller deadline"
            setup: "VerifySession with a 1 s deadline while the session row is held"
          - name: "One budget"
            setup: "POST /auth/login carrying a session cookie whose row is held for 2 s, so the binder spends 2 s before the handler runs"
      expected_output:
        per_variant:
          Earlier caller deadline:
            returns: "An error that reports no session state, before the lock limit"
          One budget:
            response: {status: 200}
            cookies: "The login's session cookie set"
            login_transaction_deadline: "At most OperationDeadline from the request's start"
        audit: "Not asserted"

    - id: AC-88
      description: >
        A background request neither slides the idle window nor waits on a
        locked session row.
      priority: high
      references_constraints: [C-44]
      inputs:
        initial_state: "A live session whose row is held by a second connection"
        operation: "GET /auth/me with the session cookie and X-Background-Refresh: 1"
      expected_output:
        response: {status: 200}
        handler_ran: true
        answered_within: "One second"
        transaction_effects: "The session's expires_at is unchanged"
        cookies: "None changed"
        audit: "Not asserted"

    - id: AC-89
      description: >
        The users service's account transactions carry the operation
        deadline without a caller supplying one, and an unknown commit on an
        administrative mutation reaches the administrator as an unknown
        outcome, whether or not the change was durable.
      priority: critical
      references_constraints: [C-37, C-43]
      inputs:
        variants:
          - name: "Default deadline"
            setup: "Service Disable with context.Background, through a transaction source that records the deadline"
          - name: "Unknown commit, durable"
            setup: "POST /users/{id}:disable; the commit applies, then its acknowledgement is lost"
          - name: "Unknown commit, non-durable"
            setup: "POST /users/{id}:disable; the commit does not apply and its outcome is unknown"
      expected_output:
        per_variant:
          Default deadline:
            deadline: "Present, at most OperationDeadline from the call"
          Unknown commit, durable:
            response: {status: 503, code: server.error, retryable: false}
            message_states: "The change may or may not have been applied"
            transaction_effects: "The account is disabled"
          Unknown commit, non-durable:
            response: {status: 503, code: server.error, retryable: false}
            message_states: "The change may or may not have been applied"
            transaction_effects: "The account is not disabled"
        cookies: "None set"
        audit: "No admin.user.disabled row for the request's correlation id, read after a settle period"

    - id: AC-90
      description: >
        An administrative account mutation reports its failure by the stage
        the transaction reached. One that could not start reports "not
        applied" and changes nothing; one whose deadline expired after it
        began rolls back and releases the account; an uncertain commit is
        never reported as "not applied", even when a deadline interrupted
        it.
      priority: critical
      references_constraints: [C-37, C-43]
      inputs:
        variants:
          - name: "Pool exhausted"
            setup: >
              The account transactions draw from a separate 1-connection pool
              whose connection is held. POST :disable, POST :enable (user
              disabled first), POST :reset-password and DELETE /users/{id},
              each with its own correlation id, run together.
          - name: "Deadline after the transaction began"
            setup: "Service Disable with a 1 s caller deadline while another connection holds the account lock"
          - name: "Mapping order"
            setup: "The handler's error mapping given a not-begun error, a rolled-back deadline, and a commit made uncertain by a deadline"
          - name: "Deadline during the commit"
            setup: "POST :disable; the commit is rolled back, then fails with the context deadline"
      expected_output:
        per_variant:
          Pool exhausted:
            response: {status: 503, code: server.error, retryable: true}
            message_states: "The change could not start"
            answered_after: "The operation deadline"
            transactions_begun: 0
            begin_errors: "Every one carries the operation deadline"
            transaction_effects: "Account state and credential rows unchanged, for users created for this case, so the assertion describes this attempt alone"
            audit: "No admin.user.* row for any request's correlation id, read after a settle period"
            cookies: "None set"
          Deadline after the transaction began:
            returns: "An error carrying the deadline; neither ErrNotBegun nor ErrCommitUnknown"
            transaction_effects: "The account is unchanged"
            subsequent:
              - "Every connection is back in the pool"
              - "No backend is left idle in a transaction"
              - "The account lock can be taken at once"
          Mapping order:
            not_begun: {status: 503, retryable: true, message_states: "could not start"}
            rolled_back_deadline: {status: 503, retryable: true, message_states: "did not complete in time"}
            uncertain_commit_from_deadline: {status: 503, retryable: false, message_states: "may or may not have been applied"}
          Deadline during the commit:
            response: {status: 503, code: server.error, retryable: false}
            message_states: "The change may or may not have been applied"
            transaction_effects: "The account is unchanged in this rolled-back variant"

    - id: AC-91
      description: >
        Cleanup after a failed administrative transaction is bounded, and its
        outcome never changes how the attempt is reported. The rollback runs
        on a context detached from the expired operation that keeps its
        values and carries its own deadline; a rollback that really fails in
        the driver discards the connection; and a failed cleanup leaves a
        pre-commit failure "not applied" and an uncertain commit uncertain.
      priority: critical
      references_constraints: [C-37, C-43]
      inputs:
        variants:
          - name: "Cleanup context"
            setup: "RollbackDetached called with an operation context whose deadline has already expired and which carries a value"
          - name: "Real driver failure"
            setup: >
              A pooled transaction whose backend is terminated with
              pg_terminate_backend before RollbackDetached runs, and a
              control transaction whose backend is left alone
          - name: "Pre-commit failure, cleanup fails"
            setup: >
              POST /users/{id}:disable through the transaction seam: the first
              statement fails with the deadline, and the rollback reports a
              failure after really rolling back
          - name: "Uncertain commit, cleanup fails"
            setup: >
              POST /users/{id}:disable through the transaction seam: the
              commit fails with no SQLSTATE, and the rollback reports a
              failure
        fixture: "Each HTTP variant uses a user created for it, so durable-state assertions describe that attempt alone"
      expected_output:
        per_variant:
          Cleanup context:
            done_while_rolling_back: false
            caller_value_present: true
            deadline: "Present, positive, at most RollbackCleanupLimit (2 s) away"
          Real driver failure:
            terminated: "The rollback fails (SQLSTATE 57P01) and the connection is closed"
            control: "The connection stays open"
          Pre-commit failure, cleanup fails:
            response: {status: 503, code: server.error, retryable: true}
            message_states: "did not complete in time"
            transaction_effects: "Account state and credential rows unchanged"
            cookies: "None set"
          Uncertain commit, cleanup fails:
            response: {status: 503, code: server.error, retryable: false}
            message_states: "may or may not have been applied"
            transaction_effects: "Account unchanged in this rolled-back variant"
            cookies: "None set"
        audit: "Not asserted"
        timing: "Cleanup may add up to 2 s beyond the 15 s operation deadline"
