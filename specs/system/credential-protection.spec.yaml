spec:
  id: system-credential-protection
  # Version 1.0.0. New spec, features/OW-122, slice 3 of the consolidated
  # contract r2 (2026-10-14): the protection state and reservations, in
  # internal/credprotect. It decides whether a secret may be sent; it sends
  # nothing. Later slices wire it in: the SSH dial adapter (4), the sudo
  # runner (5), every consumer (6), and the API and UI (7). Deriving a
  # password's keyed fingerprint, the keyring and its rotation are slice 2:
  # here a secret arrives already identified (C-03).
  version: "1.0.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Credential protection
    description: >
      OpenWatch must stop authenticating with a secret that a host may have
      rejected, across every consumer, worker and host, until an operator
      acts. Lockout counters belong to an account, which OpenWatch models as
      an identity. This module keeps, per identity and secret, the
      restrictions that decide whether a submission may be reserved, holds
      one durable reservation per identity, and settles each submission's
      outcome under rules that let restrictive effects always apply and
      permissive ones only on an exact match. It does not promise zero
      lockouts: external clients and attempts already in flight can still
      consume an account's failures.
    related_specs:
      - system-credential-store
      - system-ssh-connectivity
      - system-discovery-scheduler

  objective:
    summary: >
      One module owns every rule about when a secret may be sent. Callers
      reserve before any network I/O, run a fence immediately before the
      secret reaches the transport, and settle the outcome afterwards. A
      rejection, or any outcome that might have been one, blocks that secret
      for that identity and everything below it, until an operator-requested
      verification succeeds on an exact match.
    scope:
      includes:
        - Identities, root identities and lineage (unconfirmed, local, directory)
        - Restrictions (block, pause, cooldown, used allowance) inherited through lineage
        - Modes (PAUSED, BLOCKED, VERIFYING, ACTIVE) computed per identity and secret
        - Durable reservations with K = 1 per identity, a restriction snapshot and a deadline
        - The fence
        - Idempotent, conditional settlement; slot release; expiry; verified termination; risk override
        - Recovery records, verification requests, cooldown and allowance
        - Classification with lineage and nothing copied
      excludes:
        - Fingerprint derivation, keyring and rotation (slice 2)
        - Classifying SSH and sudo outcomes, and enforcing one method per dial (slices 1, 4, 5)
        - Wiring any consumer (slice 6)
        - API, permissions, audit events, notifications and UI (slice 7)

  constraints:
    - id: C-01
      description: >-
        Identity. Every credential resolves, for a host, to one identity. An
        unconfirmed credential resolves to the root identity for its
        normalized username (trimmed, lower-case). A local one resolves to the
        identity for (host, normalized username). A directory one resolves to
        an operator-created directory identity with the same normalized
        username. Every identity other than a root has at least one parent,
        and every identity has the root for its username as an ancestor,
        including one created as local or directory before any unconfirmed
        use. A credential with no classification is unconfirmed. A
        classification is stale when the credential's username was edited
        after it: its directory identity, or the parent its local identities
        hang from, belongs to another username. A stale classification
        resolves as unconfirmed, under the new username's root, until the
        credential is classified again, so the new account's restrictions
        apply.
      type: security
      enforcement: error
    - id: C-02
      description: >-
        Lineage depth is bounded at 3: root (1), directory (2), local (2
        below a root, 3 below a directory). A directory identity's only
        parent is its root. Classification moves a credential only downward:
        unconfirmed to local or directory, and directory to local. Any other
        change is refused, because it would exceed the bound or merge
        lineage. There is no operation that merges identities or discards
        lineage.
      type: security
      enforcement: error
    - id: C-03
      description: >-
        A secret is identified by its kind (password or key) and one or more
        aliases, each a key id and a 32-byte identifier. Two secrets are the
        same when their kinds match and any alias matches. For a key, the
        identifier is the SHA-256 of its public key, so a passphrase change
        does not change it. Restrictions are keyed by (identity, secret) and
        apply to every stage (SSH password, keyboard-interactive, sudo); the
        stage is recorded for attribution only. An identifier never appears in
        an error message or a log line. Every row that records a secret (a
        submission, a restriction, a verification request, a verified secret)
        records every alias its writer presented, and rows match by alias
        overlap. So a restriction written under [new, old] during a key
        rotation reaches an unresolved submission reserved under old alone,
        and the reverse. Callers must present the secret's identifier under
        every key still retained.
      type: security
      enforcement: error
    - id: C-04
      description: >-
        Restrictions are records, each attached to one identity, and each
        applies to that identity and every descendant through lineage. A
        block applies to one secret, or to every secret when it comes from an
        ambiguous outcome. A pause applies to every secret until it is ended
        on the identity where it was set. A cooldown applies to one secret
        until it expires. A used allowance applies to one secret and is never
        removed; a new secret has none.
      type: security
      enforcement: error
    - id: C-05
      description: >-
        The mode of a secret on an identity is PAUSED when a pause applies;
        otherwise BLOCKED when an unlifted block applies and no verification
        is pending for it; otherwise VERIFYING when an unlifted block applies
        and a verification is pending, or when no block applies but the
        secret has not been verified on this identity; otherwise ACTIVE. A
        block is lifted for an identity only by a recovery record on that
        identity that names the block's id.
      type: security
      enforcement: error
    - id: C-06
      description: >-
        Reserve runs in one transaction before any network I/O, under the
        username's lock, which every write in this module takes first. It
        inserts a submission with its kind (ordinary or verification), owner
        (machine, PID, process start time), deadline and restriction snapshot
        (the ids of every restriction that applies at that moment). It is
        refused unless the mode allows the kind: ordinary only when ACTIVE;
        verification only when VERIFYING with no cooldown and no used
        allowance applying. K = 1: it is refused while another submission on
        the identity holds a slot. If the store cannot be reached, nothing is
        reserved and the caller must not dial. The owner is complete only with
        a machine, a PID above 0 and a non-empty start time; a reservation
        without one is refused, and the database refuses such a row.
      type: security
      enforcement: error
    - id: C-07
      description: >-
        The fence, run immediately before the secret is handed to a transport,
        passes only while the submission holds its slot, is before its
        deadline, its mode still allows its kind, its credential is active,
        and the secret is still the credential's current secret. It also
        refuses when the credential was deleted, or no longer resolves to the
        submission's identity, for example after its username was edited.
      type: security
      enforcement: error
    - id: C-08
      description: >-
        Settling records an outcome, releases a slot and changes protection as
        three separate, conditional steps. Recording is idempotent: the same
        outcome again changes nothing, and a different one is refused, except
        that an unknown recorded by expiry may be followed once by the owner's
        own outcome, recorded as late. An outcome recorded after the deadline
        is late. The slot is released only when the attempt is known to have
        ended: its owner recorded an outcome, before or after the deadline, or
        the owner ran on this machine and its PID and start time no longer
        exist together. Expiry records unknown and keeps the slot. A risk
        override, with a reason and a confirmation, frees the slot but keeps
        the submission counted in o until one of those two happens. A verified
        termination with no outcome recorded records unknown first, with its
        restrictive effects, so the slot is never freed while a possible
        rejection is unrecorded. In flight or unresolved, an identity never
        has more than K + o transmissions. A process identity that cannot be
        determined, including an empty start time or an unreadable process
        table, is never taken as proof that the owner ended.
      type: security
      enforcement: error
    - id: C-09
      description: >-
        Restrictive effects always apply, even late. Rejected, unsuccessful,
        unknown and unsupported_profile block the secret the submission used;
        ambiguous blocks every secret of the identity. For a verification,
        any of these also starts a cooldown of at least 15 minutes and uses
        the allowance, and ends the pending request. not_submitted and
        local_decrypt_failed change nothing. Blocks are per secret, so a
        late failure of an old secret never blocks a new one.
      type: security
      enforcement: error
    - id: C-10
      description: >-
        Permissive effects apply only on an exact match: a verification,
        outcome verified, not late, no pause applying, and the set of
        restrictions that applies now equal to its snapshot. Then a recovery
        record is written on that identity naming every block in the snapshot,
        the secret is recorded as verified on that identity, and the pending
        request ends. Those blocks are lifted for that identity only;
        ancestors, siblings and descendants keep them, and a block the record
        does not name, including one created later, applies. Any other
        verified outcome is recorded as evidence and changes nothing. An
        overridden submission's success is evidence only, even before its
        deadline: its slot was freed without knowing how the attempt ended.
      type: security
      enforcement: error
    - id: C-11
      description: >-
        An operator may request verification of one secret on one identity
        when an unlifted block applies to it. The request is refused while a
        cooldown or a used allowance applies to that secret, through
        lineage; a repeat while one is pending changes nothing. A pause is
        ended only on the identity where it was set.
      type: security
      enforcement: error
    - id: C-12
      description: >-
        Classification changes the identity a credential resolves to, under
        the username's lock. It is refused while any identity at or below
        the credential's current identity has a submission holding a slot or
        an outstanding override. New identities get a lineage edge to the
        credential's previous identity. Nothing is copied: every restriction
        and every verified secret stays on the identity where it was
        recorded, and restrictions apply to the new identities through
        lineage.
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: >-
        Resolution: an unconfirmed credential resolves to the root for its
        normalized username on every host; a local one to (host, username),
        one identity per host shared by every local credential for that
        account; a directory one to its directory identity. The root is an
        ancestor of each. A credential created as local after a block on the
        unconfirmed root still meets that block (example B). A directory
        identity for another username is refused. A credential classified
        local or directory whose username is then edited resolves to the new
        username's root and meets its block; it can be classified again below
        the new root.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: >-
        Classification from unconfirmed to local or directory, and from
        directory to local, succeeds with the depths above. Directory to
        directory, local to directory, local to local, and any move back to
        unconfirmed are refused and change nothing.
      priority: high
      references_constraints: [C-02]
    - id: AC-03
      description: >-
        A block recorded from a submission at the SSH stage refuses a
        reservation for the same secret at the sudo stage, and the reverse. A
        secret matches by any alias, a different secret of the same identity
        is not blocked, and no error or log line contains an identifier. A
        submission reserved with two aliases stores both; the fence accepts a
        secret verified under its second alias, and refuses, with no recovery
        at settlement, when a block appears under that alias.
      priority: critical
      references_constraints: [C-03]
    - id: AC-04
      description: >-
        Modes: a new secret is VERIFYING; a block makes it BLOCKED; a pending
        request makes it VERIFYING; a pause makes it PAUSED, and ending the
        pause on another identity changes nothing; an expired cooldown no
        longer applies.
      priority: critical
      references_constraints: [C-04, C-05, C-11]
    - id: AC-05
      description: >-
        Reservation: ordinary work is refused unless ACTIVE, verification
        unless VERIFYING; the snapshot holds every applicable restriction id.
        With the database: eight workers racing for one identity get exactly
        one reservation; ordinary work racing a verification while
        VERIFYING never reserves (example G); with the store unreachable,
        Reserve fails and nothing is reserved.
      priority: critical
      references_constraints: [C-06]
    - id: AC-06
      description: >-
        The fence refuses after the slot is released, at or after the
        deadline, when a block appeared since reserve, when the credential is
        inactive, and when the secret changed; it passes otherwise. It also
        refuses a submission whose credential's username was edited since
        reserve.
      priority: critical
      references_constraints: [C-07]
    - id: AC-07
      description: >-
        Recording: the same outcome twice is a no-op; a conflicting second
        outcome is refused; after an expiry's unknown the owner's outcome is
        recorded once as late, and a second, different late outcome is
        refused; an outcome after the deadline is late. Concurrent duplicate
        settlements create one block.
      priority: critical
      references_constraints: [C-08]
    - id: AC-08
      description: >-
        Slots: expiry records unknown, blocks, and keeps the slot; the owner's
        late outcome then releases it. Verified termination releases a slot
        only for an owner on this machine whose PID and start time no longer
        exist together. An override needs a reason and a confirmation, frees
        the slot and counts in o until the owner reports or is verified ended;
        the bound reported is K + o (example D). A reservation without a start
        time is refused, and so is such a row in the database; an incomplete
        identity gets no answer from the process check; a process check that
        fails leaves the slot held.
      priority: critical
      references_constraints: [C-08]
    - id: AC-09
      description: >-
        Restrictive effects: each non-verified outcome blocks the secret it
        used, ambiguous blocks every secret, a late failure of an old secret
        does not block a new one, and a non-verified verification also
        starts a cooldown and uses the allowance.
      priority: critical
      references_constraints: [C-09]
    - id: AC-10
      description: >-
        Exact match: a verified verification with an unchanged applicable set
        writes a recovery naming the snapshot's blocks and makes the secret
        ACTIVE. No recovery when a pause began during the attempt, when a
        block appeared after reserve (example H), when the outcome is late, or
        when the submission is ordinary. An overridden verification's success,
        before its deadline, writes no recovery; the request stands, and a
        later verification recovers.
      priority: critical
      references_constraints: [C-10]
    - id: AC-11
      description: >-
        Recovery through lineage (examples F, H): a recovery on a local
        identity lifts the named block there only; a sibling stays BLOCKED;
        a second local credential for the same account shares the recovery;
        a block created on the root afterwards blocks the recovered identity
        again.
      priority: critical
      references_constraints: [C-05, C-10]
    - id: AC-12
      description: >-
        Cooldown and allowance, with a controlled clock: after a non-verified
        verification, a new request inside the cooldown is refused; after
        the cooldown it is refused because the allowance is used, including
        on a descendant; a new secret can be verified.
      priority: critical
      references_constraints: [C-09, C-11]
    - id: AC-13
      description: >-
        Classification (example E): refused while a submission holds a slot
        or an override is outstanding; afterwards the new identities inherit
        the earlier block through lineage, and no restriction or verified
        secret is copied.
      priority: critical
      references_constraints: [C-12]
