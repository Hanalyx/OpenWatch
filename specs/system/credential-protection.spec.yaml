spec:
  id: system-credential-protection
  # Version 1.0.0. New spec, features/OW-122, slice 3 of the consolidated
  # contract r3 (2026-10-15), which adopts the account scope proposal r4:
  # the protection state and reservations, in internal/credprotect. It
  # decides whether a secret may be sent; it sends nothing. Later slices
  # wire it in: the SSH dial adapter (4), the sudo runner (5), every
  # consumer (6), and the API and UI (7). Deriving a password's keyed
  # fingerprint, the keyring and its rotation are slice 2: here a secret
  # arrives already identified (C-03).
  version: "1.0.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Credential protection
    description: >
      OpenWatch must stop authenticating with a secret that a host may have
      rejected, across every consumer, worker and host, until an operator
      acts. Lockout counters belong to an account. An attempt's class says
      what is known about the account it reaches: a directory account, a
      confirmed local account, or nothing. The class decides the attempt's
      scope (whose slot it holds, where its failures are recorded and where
      its recovery is written) and which restrictions it must respect. It
      does not promise zero lockouts: external clients and attempts already
      in flight can still consume an account's failures.
    related_specs:
      - system-credential-store
      - system-ssh-connectivity
      - system-discovery-scheduler

  objective:
    summary: >
      One module owns every rule about when a secret may be sent. Callers
      reserve before any network I/O, run a fence immediately before the
      secret reaches the transport, and settle the outcome afterwards. A
      rejection, or any outcome that might have been one, blocks that
      secret for every attempt that may reach the same account, until a
      verification that can lift it succeeds on an exact match.
    scope:
      includes:
        - Roots, host records and directory identities; attempt classes and targets
        - Restrictions (block, pause, cooldown, used allowance), consulted through lineage and laterally
        - Modes (PAUSED, BLOCKED, VERIFYING, ACTIVE)
        - Durable reservations, K = 1 per scope, and conflicts between scopes that may share an account
        - The fence; idempotent, conditional settlement; expiry, verified termination and risk override
        - Recovery records, including the atomic host-plus-scope recovery
        - Directory admission, local confirmation, binding intent and classification
      excludes:
        - Fingerprint derivation, keyring and rotation (slice 2)
        - Classifying SSH and sudo outcomes, and enforcing one method per dial (slices 1, 4, 5)
        - Wiring any consumer (slice 6)
        - API, permissions, audit events, notifications and UI (slice 7)

  constraints:
    - id: C-01
      description: >-
        Identities. Each username (trimmed, lower-case) has one root. Every
        other identity has the root as its only parent: a host record, one
        per host and username, or an operator-created directory identity.
        An attempt is for a credential on a host. Its class and scope are:
        directory, scoped to the directory identity, when the credential is
        classified to a usable directory identity for its current username
        (a retired one is followed to the identity it was retired into);
        confirmed local, scoped to the host record, when the credential is
        classified local and the host record is confirmed local; and
        unconfirmed, scoped to the root, in every other case, which includes
        no classification, a classification left stale by a username edit,
        and a local classification on a host that is not confirmed local.
        Every reservation names a host.
      type: security
      enforcement: error
    - id: C-02
      description: >-
        A credential may be classified unconfirmed, local, or to a directory
        identity for its username that is not retired, a candidate included.
        A classification to another username's directory identity, or to a
        retired one, is refused. Classification moves nothing: restrictions
        stay on the identity where they were recorded.
      type: security
      enforcement: error
    - id: C-03
      description: >-
        A secret is identified by its kind (password or key) and one or more
        aliases, each a key id and a 32-byte identifier. Two secrets are the
        same when their kinds match and their alias sets overlap. Every row
        that records a secret (a submission, a restriction, a verification
        request, a verified secret) records every alias its writer
        presented, so a row written under [new, old] during a key rotation
        reaches an unresolved submission reserved under old alone, and the
        reverse. Callers must present the secret's identifier under every
        key still retained. For a key, the identifier is the SHA-256 of its
        public key. Restrictions apply to every stage (SSH password,
        keyboard-interactive, sudo); the stage is recorded for attribution
        only. An identifier never appears in an error message or a log line.
      type: security
      enforcement: error
    - id: C-04
      description: >-
        Restrictions are records on one identity. An attempt consults its
        lineage (its scope and the root) and its lateral identities: its
        host's record, if one exists and is not its scope; and, for an
        unconfirmed attempt, every usable directory identity for its
        username. A block applies to one secret, or to every secret when it
        comes from an ambiguous outcome. A pause applies to every secret
        until it is ended on the identity where it was set. A cooldown
        applies to one secret until it expires. A used allowance applies to
        one secret and is never removed; a new secret has none.
      type: security
      enforcement: error
    - id: C-05
      description: >-
        A block in an attempt's lineage is lifted for it by a recovery on its
        scope that names the block. A lateral block is lifted only by a
        recovery on the identity it lives on. The mode of a secret for an
        attempt is PAUSED when a pause applies; otherwise BLOCKED when an
        unlifted block applies that the attempt's own verification cannot
        lift (one living on a directory identity it is not bound to); then
        BLOCKED when an unlifted block applies and no verification is pending
        on its scope; VERIFYING when one is pending, or when no block applies
        but the secret has not been verified on its scope; otherwise ACTIVE.
      type: security
      enforcement: error
    - id: C-06
      description: >-
        Reserve runs in one transaction before any network I/O, under the
        username's lock, which every write in this module takes first. It
        records the attempt's target (class, scope, username, host), its
        kind, every alias, a complete owner (machine, a PID above 0 and a
        non-empty start time), a deadline and a snapshot of every applicable
        restriction id. It is refused unless the mode allows the kind:
        ordinary only when ACTIVE; verification only when VERIFYING with no
        cooldown and no used allowance applying. K = 1: it is refused while
        an attempt that may reach the same account holds a slot. A directory
        attempt conflicts with its own directory and with every unconfirmed
        attempt; an unconfirmed attempt conflicts with every unconfirmed and
        every directory attempt, and with a confirmed-local attempt on its
        host; a confirmed-local attempt conflicts with its own host record
        and with an unconfirmed attempt on its host. Usable directory
        identities are distinct accounts and do not conflict. If the store
        cannot be reached, nothing is reserved and the caller must not dial.
      type: security
      enforcement: error
    - id: C-07
      description: >-
        The fence, run immediately before the secret is handed to a
        transport, passes only while the submission holds its slot, is before
        its deadline, its credential exists, is active, still has the
        username it was reserved under, and still has the reserved secret,
        and the mode for its recorded target, recomputed now, still allows
        its kind.
      type: security
      enforcement: error
    - id: C-08
      description: >-
        Settling records an outcome, releases a slot and changes protection
        as three separate, conditional steps. Recording is idempotent: the
        same outcome again changes nothing, and a different one is refused
        and logged, except that an unknown recorded by expiry may be followed
        once by the owner's own outcome, recorded as late. An outcome
        recorded after the deadline is late. The slot is released only when
        the attempt is known to have ended: its owner recorded an outcome, or
        the owner ran on this machine and its PID and start time no longer
        exist together. An identity the process check cannot determine is
        never taken as proof that the owner ended. A verified termination
        with no outcome records unknown first, with its restrictive effects.
        Expiry records unknown and keeps the slot. A risk override, with a
        reason and a confirmation, frees the slot but keeps the submission
        counted in o until one of those happens; a scope never has more than
        K + o transmissions in flight or unresolved.
      type: security
      enforcement: error
    - id: C-09
      description: >-
        Restrictive effects always apply, even late, to the attempt's
        recorded scope. Rejected, unsuccessful, unknown and
        unsupported_profile block the secret; ambiguous blocks every secret.
        For a verification, any of these also starts a cooldown of at least
        15 minutes and uses the allowance on its scope, and on its host's
        record when its snapshot held a block there, and ends the pending
        request. not_submitted and local_decrypt_failed change nothing: no
        block, no cooldown, no allowance.
      type: security
      enforcement: error
    - id: C-10
      description: >-
        Permissive effects apply only on an exact match: a verification,
        outcome verified, not late, not overridden, and the set of
        restrictions that applies now to its recorded target, lateral ones
        included, equal to its snapshot, which is otherwise kept as evidence
        only. Then a recovery is written on its scope naming the snapshot's
        lineage blocks, and, when the snapshot held blocks on its host's
        record and that record is not its scope, a second recovery on the
        host record naming those: both in one transaction, or neither. The
        secret is recorded as verified on the scope, and the pending request
        ends. A directory identity's block is lifted only by a verification
        bound to that directory; a host record's only by a verification on
        that host. Any other verified outcome is evidence and changes
        nothing.
      type: security
      enforcement: error
    - id: C-11
      description: >-
        An operator may request verification of one secret for a
        credential's attempts on a host. The request is recorded on their
        scope. It is refused while a cooldown or a used allowance applies to
        that secret, while a block applies that the scope's verification
        cannot lift, and when no block applies; a repeat while one is
        pending changes nothing. A pause is ended only on the identity where
        it was set.
      type: security
      enforcement: error
    - id: C-12
      description: >-
        Classification, local confirmation and its withdrawal, and directory
        resolution are binding changes. Each is refused while any attempt
        for the username holds a slot or counts in o. An attempt keeps its
        recorded target through settlement, and editing its credential
        never retargets its outcome.
      type: security
      enforcement: error
    - id: C-13
      description: >-
        Directory admission. Directory identities are created under the
        username's lock: the first for a username is usable, every later one
        is a candidate. A candidate admits nothing: reservations through it,
        pauses on it and verification requests through it are refused, so it
        has no protection history. An operator resolves it, with a basis
        that is recorded: distinct, naming the usable identities it is
        distinct from, refused if that set is not the usable set now; or
        same as one usable identity, which retires it and reclassifies its
        credentials to that identity in one transaction, refused if the
        candidate has any protection history.
      type: security
      enforcement: error
    - id: C-14
      description: >-
        Local confirmation and binding intent. An operator may confirm a
        host and username as a local account, with a basis that is recorded;
        a successful authentication is not required. A directory attempt's
        reservation records binding intent for its host and username: intent,
        not proof that the attempt reached the host. Confirmation is refused
        once binding intent exists for that host account, as a conservative
        policy. A directory attempt is refused on a host account that is
        confirmed local, or that another directory identity's intent already
        names. Withdrawing a confirmation is always allowed when nothing is
        outstanding, and keeps the host record's history.
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: >-
        Resolution: an unconfirmed credential resolves to its root on every
        host, whatever its case and spacing; a local credential on a host
        that is not confirmed resolves to the root, and on a confirmed host
        to the host record; a directory credential resolves to its usable
        directory identity; a credential whose username was edited after it
        was classified resolves to its new root; a local credential needs a
        host.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: >-
        Classification between unconfirmed, local and directory succeeds in
        every direction; a retired directory identity, another username's
        directory identity, and an unknown scope are refused and change
        nothing; a reservation without a host is refused.
      priority: high
      references_constraints: [C-01, C-02]
    - id: AC-03
      description: >-
        A block recorded at the SSH stage refuses the sudo stage, and the
        reverse. A restriction, a request and a verified secret recorded
        under [new, old] are seen by a caller presenting old alone, and the
        reverse; a submission stores every alias. A different secret is not
        blocked. No error or log line contains an identifier.
      priority: critical
      references_constraints: [C-03]
    - id: AC-04
      description: >-
        Modes: a new secret is VERIFYING; a block makes it BLOCKED; a pending
        request makes it VERIFYING; a pause makes it PAUSED for everything
        that consults the paused identity, and ending a pause elsewhere
        changes nothing; an expired cooldown no longer applies; a
        directory's block makes an unconfirmed attempt BLOCKED even with a
        request pending.
      priority: critical
      references_constraints: [C-04, C-05, C-11]
    - id: AC-05
      description: >-
        Reservation: ordinary work is refused unless ACTIVE, verification
        unless VERIFYING; the snapshot holds every applicable restriction id;
        every write takes the username's lock; a username edited while a
        reservation waits for the lock is refused; eight workers racing for
        one scope get one reservation; ordinary work racing a verification
        while VERIFYING never reserves; with the store unreachable nothing is
        reserved; a reservation without its parts reserves nothing.
      priority: critical
      references_constraints: [C-06]
    - id: AC-06
      description: >-
        The fence refuses after the slot is released, at or after the
        deadline, when the credential is inactive, deleted, or has another
        username or secret, and when a restriction appeared since reserve,
        a lateral one included; it accepts the secret under any of its
        aliases; it passes otherwise.
      priority: critical
      references_constraints: [C-07]
    - id: AC-07
      description: >-
        Recording: the same outcome twice is a no-op; a conflicting outcome
        is refused and logged; after an expiry's unknown the owner's outcome
        is recorded once as late; an outcome after the deadline is late;
        concurrent duplicate settlements create one block; expiry leaves a
        settled submission alone.
      priority: critical
      references_constraints: [C-08]
    - id: AC-08
      description: >-
        Slots: expiry keeps the slot and the owner's late outcome releases
        it; verified termination needs this machine and a PID and start time
        that no longer exist together; an incomplete or indeterminate owner
        never releases a slot; an override needs a reason and a confirmation
        and counts in o until the owner reports (example D).
      priority: critical
      references_constraints: [C-08]
    - id: AC-09
      description: >-
        Restrictive effects: each non-verified outcome blocks the secret on
        the recorded scope, ambiguous every secret; not_submitted and
        local_decrypt_failed record nothing, for an ordinary attempt and for
        a verification; a late failure of an old secret does not block a new
        one; a failed verification starts the cooldown and uses the
        allowance on its scope, and on the host record when it would have
        lifted a block there.
      priority: critical
      references_constraints: [C-09]
    - id: AC-10
      description: >-
        Exact match: a verified verification with an unchanged set writes a
        recovery and makes the secret ACTIVE. No recovery when a pause began,
        a restriction appeared after reserve (a lateral one included), the
        outcome is late, the verification was overridden, or the submission
        is ordinary.
      priority: critical
      references_constraints: [C-10]
    - id: AC-11
      description: >-
        Recovery scope: a recovery on a confirmed-local host record lifts the
        root's block there only; a host-plus-scope recovery writes one
        recovery on the scope and one on the host record; a failure injected
        between those writes leaves neither, nor the outcome; a verification
        on a host record cannot lift a directory's block; a used allowance
        on the host record refuses the host-plus-scope verification.
      priority: critical
      references_constraints: [C-05, C-10]
    - id: AC-12
      description: >-
        Cooldown and allowance, with a controlled clock: after a failed
        verification a new request inside the cooldown is refused, after it
        the allowance is used, including for a descendant scope, and a new
        secret can be verified; a cooldown or used allowance on an ancestor
        refuses a pending verification below it.
      priority: critical
      references_constraints: [C-09, C-11]
    - id: AC-13
      description: >-
        Directory admission: eight concurrent creations for one username
        leave exactly one usable; a candidate refuses reservations, pauses
        and verification requests; an assertion of distinctness naming a
        set that is not the usable set now is refused; asserted distinct, it
        admits attempts independently of the other directory, while an
        unconfirmed attempt is constrained by both; resolved as the same,
        it is retired, its credentials share the usable identity's blocks,
        allowance and slot, and a candidate with history cannot be resolved
        as the same.
      priority: critical
      references_constraints: [C-13]
    - id: AC-14
      description: >-
        Confirmation and binding: confirming local after binding intent is
        refused; a directory attempt on a confirmed-local host is refused; a
        second directory's attempt on a host bound to the first is refused;
        binding changes wait for outstanding attempts; withdrawing a
        confirmation keeps the host record's block in force for the attempts
        that consult it.
      priority: critical
      references_constraints: [C-12, C-14]
    - id: AC-15
      description: >-
        Slot conflicts follow C-06: two directory attempts through two hosts
        share one slot; distinct directories do not conflict; unconfirmed
        attempts on two hosts share one slot; a directory attempt and an
        unconfirmed one conflict; a confirmed-local attempt conflicts with an
        unconfirmed one on its host, not on another, and confirmed-local
        accounts on two hosts do not conflict.
      priority: critical
      references_constraints: [C-06]
    - id: AC-16
      description: >-
        Account history: a block recorded on the root by an unconfirmed
        local credential refuses a duplicate credential and a username round
        trip; a block recorded on a confirmed-local host record refuses an
        unconfirmed duplicate on that host and a username round trip back to
        it; a directory's rejection on one host refuses the same directory
        on another host and an unconfirmed duplicate; a credential
        classified local on a host that is not confirmed meets a directory's
        block; a failure on one confirmed-local account leaves another
        host's confirmed-local account unaffected.
      priority: critical
      references_constraints: [C-01, C-04, C-05]
