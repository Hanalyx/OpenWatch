spec:
  id: system-drift-detector
  title: Compliance drift detector
  # Version 1.3.0 (was 1.2.0). Minor: C-05 rewritten to name the threshold
  # source that exists, and three added constraints (C-11 to C-13) with four
  # added acceptance criteria (AC-22 to AC-25) that bind a CALLER. AC-25 is
  # the dedicated-worker shape, the approved v0.8 limitation (features/OW-057). Every
  # criterion through 1.2.0 held inside this package while no build of
  # cmd/openwatch linked it, so no scan ever ran the detector and no drift
  # alert ever fired (CP bugs/OW-055, 2026-09-19). Nothing published here
  # changed meaning for the package itself; the change is what the binary
  # is required to do with it.
  version: "1.3.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Per-host compliance drift detection
    description: >
      The drift detector runs at the end of every scan. It computes the
      compliance score delta between the prior state (last successful
      scan for the host) and the current state (this scan's results),
      classifies the change against operator-configured thresholds in
      policy.AlertThresholds, and emits compliance.drift.detected for
      major/minor worsening or improvement transitions. Stable scans
      (delta below the minor threshold) do not audit — the no-noise
      principle.

      Reads from the transaction log (B.1c) only. No scan_baselines
      table — the Python-era baseline mechanism is explicitly dropped;
      the prior host_rule_state aggregate IS the baseline.

  objective:
    summary: >
      One method — drift.Service.DetectForScan(ctx, hostID, scanID) —
      returns a DriftReport with kind + score delta. The detector is a
      pure consumer of write-on-change state: prior score from
      host_rule_state at the moment of detection, current score from
      the rule transitions in this scan_id. Emission gates on the
      classified DriftKind being non-stable.
    scope:
      includes:
        - Pure-function classifier (DriftKind from score delta + thresholds)
        - DetectForScan reading prior + current state from PostgreSQL
        - compliance.drift.detected emission on non-stable kinds
        - Thresholds loaded from policy.AlertThresholds, clamp-guarded
      excludes:
        - host_drift_events persistence (B.4 fleet-rollup adds this if
          query-side performance demands it; for v1 the audit log is the
          source of truth)
        - Per-rule alert routing (B.3 alert router consumes the audit
          events emitted here)
        - Scan_baselines table (explicitly dropped — write-on-change
          eliminates the need)

  constraints:
    - id: C-01
      description: Classify is a pure function over (prior, current, thresholds) → DriftKind; no I/O, no side effects, deterministic
      type: technical
      enforcement: error
    - id: C-02
      description: DriftKind enum is closed — stable | minor_worsening | major_worsening | improvement. Maps to compliance.drift.detected detail.drift_type
      type: technical
      enforcement: error
    - id: C-03
      description: Score-delta thresholds MUST be in percentage points, not percent-of-percent. A drop from 80% to 70% is a 10pp delta, NOT a 12.5pp delta
      type: technical
      enforcement: error
    - id: C-04
      description: compliance.drift.detected emission MUST gate on Kind != DriftStable. Stable scans do not audit (no-noise principle)
      type: technical
      enforcement: error
    - id: C-05
      description: >
        Thresholds are drift.DefaultThresholds() (major=10pp, minor=5pp,
        improvement=5pp) in this release, passed explicitly by the caller.
        policy.AlertThresholds carries score BANDS (critical_below,
        high_below, medium_below), a different quantity, and MUST NOT be
        read as drift deltas; the 1.2.0 wording named it as the source and
        no adapter could have satisfied that. An operator-facing drift
        threshold setting is a separate request. Values MUST be in (0, 100]
        and major MUST be >= minor (AC-07). Boundaries are inclusive on the
        threshold side: a delta of exactly -major is major, exactly -minor
        is minor, exactly +improvement is improvement (AC-01, AC-03).
      type: technical
      enforcement: error
    - id: C-06
      description: DetectForScan MUST use a single read transaction to compute prior + current scores so a concurrent writer cannot produce a torn view
      type: technical
      enforcement: error
    - id: C-07
      description: The detector MUST NOT read or write scan_baselines — that table is explicitly dropped (Python-era artifact). Source-inspection enforces
      type: technical
      enforcement: error
    - id: C-08
      description: DriftReport MUST include the per-severity transition counts (critical_became_failing, high_became_failing, etc.) — operators need this granularity for alert routing in B.3
      type: technical
      enforcement: error
    - id: C-09
      description: On every non-stable detection (Kind != Stable), Service MUST publish a typed DriftDetected event to the eventbus carrying the same per-severity transition counts that the audit detail carries. The publish is best-effort — bus errors are logged but do not affect DetectForScan's return. v1.1.0 NEW
      type: technical
      enforcement: error
    - id: C-10
      description: NewService signature is NewService(pool, emit, thresholds, bus). The bus parameter MAY be nil — in that case the service still emits audit events but skips bus publishes. v1.1.0 NEW
      type: technical
      enforcement: error
    - id: C-11
      description: >
        The scan worker MUST call DetectForScan(ctx, hostID, scanID) on the
        success path of every scan, after transactionlog.Writer.Apply has
        committed (the detector reads host_rule_state and transactions for
        that scan id) and before it publishes ScanCompleted, in both the
        serve process's in-process worker and the openwatch worker
        subcommand. cmd/openwatch MUST link internal/drift (AC-22). The
        worker subcommand constructs the detector with a nil bus (C-10):
        it emits compliance.drift.detected and publishes no bus event,
        because the alert router runs in serve and cross-process bus
        delivery is a known non-goal (system-worker-subcommand). Drift
        ALERTS therefore fire for scans completed by serve's in-process
        worker; a scan completed by a dedicated worker process is
        recorded in the audit log only. v1.3.0 NEW
      type: technical
      enforcement: error
    - id: C-12
      description: >
        Detector failure is non-fatal to the scan. The outcomes are already
        persisted and the run is already marked completed when DetectForScan
        runs; an error from it MUST be logged at warn level with scan_id,
        host_id and the error, MUST NOT fail or retry the job, MUST NOT
        suppress the ScanCompleted publication, and is not retried on its
        own (the next scan produces the next comparison). The
        scan.completed audit and bus events are unaffected (AC-24).
        v1.3.0 NEW
      type: technical
      enforcement: error
    - id: C-13
      description: >
        Detection is at most once per scan id on the success path, and the
        Apply idempotency rule (system-transaction-log AC-05) makes a
        re-applied scan a no-op with no new transitions, so a job the queue
        redelivers after Apply committed reaches DetectForScan with the same
        transitions it recorded the first time and MAY emit a second
        compliance.drift.detected for that scan id. The alert router's
        dedup gate (system-alert-router, key type|host_id|rule_id within
        DedupTTL) collapses the duplicate alert; the audit log keeps both
        rows, which is the correct record of what the worker did. No
        stronger guarantee is claimed. v1.3.0 NEW
      type: technical
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: Classify(prior=80, current=70, defaultThresholds) returns DriftMajorWorsening. A 10pp drop hits the major threshold exactly.
      priority: critical
      references_constraints: [C-01, C-02, C-03]
    - id: AC-02
      description: Classify(prior=80, current=76, defaultThresholds) returns DriftMinorWorsening. A 4pp drop is below minor threshold (5pp) — actually returns DriftStable.
      priority: critical
      references_constraints: [C-01, C-02]
    - id: AC-03
      description: Classify(prior=80, current=75, defaultThresholds) returns DriftMinorWorsening (5pp drop matches the minor threshold).
      priority: critical
      references_constraints: [C-01, C-02]
    - id: AC-04
      description: Classify(prior=70, current=78, defaultThresholds) returns DriftImprovement (8pp gain ≥ improvement threshold 5pp).
      priority: critical
      references_constraints: [C-01, C-02]
    - id: AC-05
      description: Classify(prior=80, current=82, defaultThresholds) returns DriftStable. A 2pp swing is below ALL thresholds — stable.
      priority: critical
      references_constraints: [C-01, C-02, C-04]
    - id: AC-06
      description: Classify uses the input thresholds, not hardcoded values. Same prior/current with major=20pp / minor=10pp produces different kind than with the defaults.
      priority: critical
      references_constraints: [C-05]
    - id: AC-07
      description: ValidateThresholds rejects any threshold ≤ 0 or > 100 with a typed error. Major MUST be >= minor.
      priority: critical
      references_constraints: [C-05]
    - id: AC-08
      description: DetectForScan returns DriftReport with Kind=DriftStable when no host_rule_state rows existed before this scan (first-ever scan against this host) — no prior baseline to drift from.
      priority: critical
      references_constraints: [C-01, C-06]
    - id: AC-09
      description: DetectForScan against a transaction-log state where 3 rules became failing returns DriftReport with the correct per-severity counts (e.g., critical_became_failing=1, high_became_failing=2).
      priority: critical
      references_constraints: [C-08]
    - id: AC-10
      description: After DetectForScan returns DriftMajorWorsening, exactly one compliance.drift.detected audit event is emitted with detail.drift_type="major" and detail.score_delta = the computed delta (negative).
      priority: critical
      references_constraints: [C-04]
    - id: AC-11
      description: After DetectForScan returns DriftStable, ZERO compliance.drift.detected audit events are emitted.
      priority: critical
      references_constraints: [C-04]
    - id: AC-12
      description: Source-inspection — internal/drift source files contain no scan_baselines / ScanBaseline references. Python-era baseline table explicitly dropped.
      priority: critical
      references_constraints: [C-07]
    - id: AC-13
      description: The DriftKind enum has exactly 4 values (stable, minor_worsening, major_worsening, improvement) — closed enum verified by reflection.
      priority: high
      references_constraints: [C-02]
    - id: AC-14
      description: 'v1.2.0 - drift.Score counts only confirmed verdicts: passed / (passed + failed). Skipped AND errored outcomes are excluded from the denominator. The previous wording said total "excludes skipped rules" and never mentioned error, describing a denominator the code has never used. It delegates to internal/compliance so drift shares one score definition with every other surface.'
      priority: high
      references_constraints: [C-03]
      inputs:
        counts: {passed: 80, failed: 20}
      expected_output:
        score_pct: 80.0
        score_present: true
    - id: AC-15
      description: On a major-worsening detection, DetectForScan publishes a DriftDetected{DriftType="major"} event to the eventbus; verified with an in-memory bus + subscriber.
      priority: critical
      references_constraints: [C-09]
    - id: AC-16
      description: On a stable detection (no drift), DetectForScan does NOT publish a DriftDetected event — the bus subscriber sees zero events.
      priority: critical
      references_constraints: [C-09]
    - id: AC-17
      description: The DriftDetected event's per-severity transition counts match the audit detail values; verified by asserting both produced from the same Report.
      priority: critical
      references_constraints: [C-09]
    - id: AC-18
      description: NewService(pool, emit, thresholds, nil) — when the bus is nil, DetectForScan still emits the audit event; the only difference is no bus publish.
      priority: high
      references_constraints: [C-10]
    - id: AC-19
      description: 'An empty verdict denominator produces an ABSENT score, never zero, and drift emits no event for one. This is bugs/OW-023: drift.ComplianceScore returned 0 for passed+failed=0 and called it a conservative default, while the Evaluate guard tested total rows including skipped. A scan returning only skipped rows therefore passed the guard, scored a fabricated 0, and classified as a major worsening against a real prior, routing a false compliance-collapse alert to Slack, webhook or email. Guard on the denominator the score actually uses. The fixture states has_prior_baseline rather than a prior score percentage: reconstructPriorCounts inverts pass and fail transitions only, so an all-skipped rescan leaves the prior counters where the current ones are and no prior percentage is reconstructible. What the guard needs is that a baseline EXISTS, which is the condition that made the old code emit.'
      priority: critical
      references_constraints: [C-03]
      inputs:
        counts: {passed: 0, failed: 0, skipped: 10}
        has_prior_baseline: true
      expected_output:
        current_score_present: false
        drift_kind: stable
        audit_events_emitted: 0
        bus_events_published: 0
    - id: AC-20
      description: 'Counterexample to AC-19: a host whose every evaluated rule failed has a real score of zero and is NOT absent. The two must stay distinguishable, because collapsing them is what let an unassessable host alert as a compliance collapse.'
      priority: critical
      references_constraints: [C-03]
      inputs:
        counts: {passed: 0, failed: 5}
      expected_output:
        score_pct: 0.0
        score_present: true
    - id: AC-21
      description: 'Score absence is symmetric. A report distinguishes an absent prior score from a prior of zero, and states whether a comparison was made at all. HasPriorBaseline is not the same fact: a baseline can exist while no prior percentage is reconstructible, because reconstructPriorCounts inverts pass and fail transitions only. Without PriorScorePresent and ComparisonPresent such a report exposes a plausible PriorScore of 0 and a ScoreDelta of 0 that no comparison produced. The reachable shape: every scored rule in the current scan is first_seen, so reconstructPriorCounts subtracts each one and the prior reduces to zero pass and zero fail, while one retained rule keeps firstSeenCount below the rule total so a baseline still exists.'
      priority: critical
      references_constraints: [C-03]
      inputs:
        current: {passed: 2, failed: 0}
        new_rules_first_seen: 2
        retained_skipped_rules: 1
        has_prior_baseline: true
      expected_output:
        current_score_present: true
        prior_score_present: false
        comparison_present: false
        drift_kind: stable
        audit_events_emitted: 0
    - id: AC-22
      description: >
        internal/drift is a dependency of cmd/openwatch. The instrument is
        the dependency graph the linker sees, go list -deps ./cmd/openwatch,
        not a grep over tests: the package's own tests kept the coverage
        gate at 100% for two releases while no binary called it.
      priority: critical
      references_constraints: [C-11]
      expected_output:
        linked: true
    - id: AC-23
      description: >
        Two scans completed through the real ScanWorker on one host, the
        first passing 10 rules and the second failing one of them, produce
        exactly one compliance.drift.detected audit event with
        drift_type=major and score_delta=-10 and exactly one DriftDetected
        bus event. With an alert router and store subscribed to the same
        bus, exactly one alerts row of type drift_major exists for the host.
        Re-running DetectForScan for scan 2 before any newer scan (the
        redelivery shape of C-13) emits a second audit event and a second
        bus event, and the router's dedup gate leaves the alerts row count
        at one. A third scan that changes nothing then emits neither an
        audit nor a bus event.
      priority: critical
      references_constraints: [C-11, C-05, C-13]
      inputs:
        scan_1: {passed: 10, failed: 0}
        scan_2: {passed: 9, failed: 1}
        scan_3: {passed: 9, failed: 1}
      expected_output:
        audit_events_after_scan_2: 1
        bus_events_after_scan_2: 1
        drift_type: major
        score_delta: -10
        alert_rows_drift_major: 1
        audit_events_after_redelivery: 2
        alert_rows_after_redelivery: 1
        audit_events_after_scan_3: 2
    - id: AC-24
      description: >
        A detector that returns an error on a completed scan leaves the job
        completed, the outcomes persisted, and ScanCompleted published; a
        warn-level log line carries scan_id and host_id; no scan.failed is
        emitted and no host_backoff_state row is written.
      priority: critical
      references_constraints: [C-12]
      expected_output:
        job_status: completed
        scan_completed_published: true
        scan_failed_emitted: 0
    - id: AC-25
      description: >
        The dedicated-worker shape (C-11, second half). A ScanWorker
        constructed the way cmdWorker constructs it, with no event bus and
        no alert router, holding a detector built with a nil bus, completes
        a scan that lowers the host's score by 10 points: exactly one
        compliance.drift.detected audit event is emitted with
        drift_type=major, no DriftDetected event exists anywhere (there is
        no bus to carry one), and the alerts table holds no row for the
        host. This is the approved v0.8 limitation (features/OW-057): a
        dedicated worker records drift and does not alert or notify.
      priority: critical
      references_constraints: [C-11, C-10]
      inputs:
        scan_1: {passed: 10, failed: 0}
        scan_2: {passed: 9, failed: 1}
        bus: nil
        alert_router: none
      expected_output:
        audit_events_emitted: 1
        drift_type: major
        alert_rows: 0
