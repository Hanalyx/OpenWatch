spec:
  id: system-rbac
  title: RBAC permission registry and middleware
  version: "2.2.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: Role-based access control
    description: >
      Permissions are a registry, not a vocabulary. The permissions.yaml
      file is the single source of truth; codegen produces typed Permission
      and RoleID constants plus metadata maps. The RequirePermission
      middleware checks RBAC and nothing else. A permission carries no
      entitlement: tiering is by scope, so one host is free and the same
      vocabulary at fleet scale is paid, and both use the SAME permission.
      Only the route can tell them apart. Entitlement is therefore two
      separate things, and neither is a permission flag. The route DECLARES
      x-required-feature in api/openapi.yaml, which is a contract annotation
      that a CI gate checks, not runtime code. The handler ENFORCES by
      calling license.EnforceFeature, which is the only thing that returns
      402 at runtime. LicenseGate was a third mechanism that duplicated the
      second one and could not express scope, so it was removed rather than
      moved. RBAC still resolves first, because the handler cannot run until
      the middleware passes. See decision record 05.
    related_specs:
      - system-license-features
      - system-audit-emission

  objective:
    summary: >
      Eliminate permission-string drift by making the registry the only
      surface that defines a permission. OpenAPI x-required-permission,
      handler middleware, and built-in roles all resolve through the same
      codegen output. Misspell anywhere → compile error.
    scope:
      includes:
        - Codegen-typed Permission constants from permissions.yaml
        - Codegen-typed RoleID constants + BuiltInRoles map with wildcards expanded
        - RequirePermission middleware (RBAC only)
        - Runtime lookup helpers (HasPermission, IsDangerous)
        - Stub identity via X-Stub-Role header (Stage 0)
      excludes:
        - Real identity binding (Stage 2)
        - Custom-role CRUD (Stage 2)
        - Policy cross-validation (Stage 2)

  constraints:
    - id: C-01
      description: Each permissions.yaml entry MUST emit a typed Permission constant
      type: technical
      enforcement: error
    - id: C-02
      description: Each permissions.yaml roles entry MUST emit a typed RoleID constant with permissions expanded (no runtime wildcard resolution)
      type: technical
      enforcement: error
    - id: C-03
      description: "RBAC MUST resolve before entitlement for the same request, so 403 wins over 402. The middleware enforces RBAC only. Entitlement MUST be enforced by the handler calling license.EnforceFeature, which the middleware guards; declaring x-required-feature alone enforces nothing at runtime. A caller who lacks the permission MUST NOT learn the entitlement state of the deployment."
      type: security
      enforcement: error
    - id: C-04
      description: RBAC denial MUST emit authz.permission_denied audit event with detail.required_permission populated
      type: security
      enforcement: error
    - id: C-05
      description: An entitlement denial MUST emit license.feature_check_denied (not authz.permission_denied) when RBAC passes. The two denial classes stay distinct, so an operator can tell "your role is wrong" from "your license does not cover this".
      type: security
      enforcement: error
    - id: C-06
      description: Stage-0 X-Stub-Role header MUST be ignored in production (build flag or env gate)
      type: security
      enforcement: error
    - id: C-07
      description: Codegen output MUST be deterministic (re-running with no changes produces no diff)
      type: technical
      enforcement: error
    - id: C-08
      description: Built-in role grants MUST preserve separation of duties for the governed lifecycles. A built-in role that can request remediation MUST NOT also hold remediation:approve; the same requester-is-not-approver rule applies to exceptions. The full built-in-role to governed-permission matrix (remediation:* and exception:*) is fixed and documented in docs/engineering/remediation_exception_governance.md; a permissions.yaml edit that changes it is a deliberate governance decision and MUST update that matrix and this spec together.
      type: security
      enforcement: error
    - id: C-09
      description: "Entitlement is not authorization. Every operation in api/openapi.yaml that declares x-required-feature MUST also declare x-required-permission and enforce it. License state is process-global, not per-caller, so a feature check alone tells the server what the DEPLOYMENT bought, never who is asking. On a licensed instance a feature-only route is open to anyone who can reach the port."
      type: security
      enforcement: error
    - id: C-10
      description: "A mutating operation is never anonymously open by default. Every POST, PUT, PATCH and DELETE in api/openapi.yaml MUST resolve to exactly one of two states. Either its handler provably enforces the caller (an RBAC check on a typed permission, or an authentication check for a route that needs no specific permission), or its operationId appears on the named anonymous allowlist that api/openapi.yaml carries. An operation that is on neither is a defect, and the rule is written so the next author has a question to answer rather than a list to keep. The allowlist is the small side on purpose: it holds the pre-auth routes such as login and setup, and nothing joins it without a reason recorded next to it. This constraint is about REACHABILITY, not documentation. It does not claim the contract describes the gate: today many operations enforce inside the handler while declaring no x-required-permission, so a rule written against the annotation alone would report a contract gap as if it were an open route. Closing that annotation gap is separate work, and C-09 plus AC-18 govern the declarations that do exist."
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: Codegen produces permissions.gen.go with one typed Permission constant per entry in permissions.yaml.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: Codegen produces Permissions map with Category, Description and Dangerous per id. There is no entitlement field.
      priority: critical
    - id: AC-03
      description: Codegen produces roles.gen.go with one RoleID constant per entry in permissions.yaml roles section.
      priority: critical
      references_constraints: [C-02]
    - id: AC-04
      description: BuiltInRoles map resolves category wildcards (e.g., "host:*") at codegen time to the explicit list of host permissions.
      priority: critical
      references_constraints: [C-02, C-07]
    - id: AC-05
      description: HasPermission(perm) returns true iff the calling identity's role grants perm.
      priority: critical
    - id: AC-06
      description: IsDangerous(perm) returns the registry's dangerous flag for perm.
      priority: high
    - id: AC-07
      description: "The registry carries no license gate, and neither does the RBAC middleware. permissions.yaml declares no license_gated key, permissions.gen.go emits no LicenseGated field and no LicenseGate helper, and internal/auth/middleware.go does not import internal/license. A permission cannot express an entitlement because per-host and fleet-scale use the same permission; the route tells them apart. Pinned by source inspection, since a reintroduced field would still compile."
      priority: high
    - id: AC-08
      description: RequirePermission middleware allows the request when the calling identity grants the permission. RBAC is the only check it makes.
      priority: critical
    - id: AC-09
      description: "RequirePermission / EnforcePermission distinguishes the two denial classes by HTTP status. An ANONYMOUS caller (no credentials, or a session cookie that expired in the browser and is no longer sent) is denied 401 auth.required so the SPA redirects to login. An AUTHENTICATED caller whose role lacks the permission is denied 403 authz.permission_denied. The authz.permission.denied audit event is emitted in both cases."
      priority: critical
      references_constraints: [C-03, C-04]
    - id: AC-10
      description: "A paid route denies with 402 license.feature_unavailable when RBAC passes but the feature is not enabled. The 402 is produced at runtime by license.EnforceFeature inside the handler. x-required-feature does not enforce anything at runtime; it is the contract declaration that a CI gate holds the handler to. The ordering still holds: a caller who lacks the permission is stopped at 401 or 403 and never reaches the feature check, so 403 wins over 402 for the same request."
      priority: critical
      references_constraints: [C-03, C-05]
    - id: AC-11
      description: RequirePermission emits audit event with detail.required_permission set to the permission id on denial.
      priority: critical
      references_constraints: [C-04]
    - id: AC-12
      description: The production binary MUST NOT contain any header-based identity bypass. The previously-shipped X-Stub-Role / X-Stub-User-Id mechanism has been removed entirely from internal/auth (no exported symbols, no middleware mount). Identity is bound exclusively by the production binder via session cookie or Bearer JWT.
      priority: critical
      references_constraints: [C-06]
    - id: AC-13
      description: GET /auth/me/permissions returns the effective permission list of the calling identity.
      priority: high
    - id: AC-14
      description: GET /auth/permissions:registry returns the full registry (categories, permissions, built-in roles).
      priority: high
    - id: AC-15
      description: GET /admin/roles returns the 5 built-in roles.
      priority: high
    - id: AC-16
      description: RequirePermission p99 latency < 1µs for the hot path (registry lookup is a map read).
      priority: medium
    - id: AC-17
      description: "Built-in role grants match the remediation/exception governance matrix, locking separation of duties against drift. Remediation: ops_lead grants request/execute/rollback but NOT approve; remediation:approve is held only by security_admin and admin; viewer/auditor cannot request remediation. Exceptions: auditor grants request/approve, ops_lead grants request but NOT approve, revoke is security_admin/admin only. viewer holds only remediation:read/exception:read of the governed categories; admin holds all. Verified against BuiltInRoles so a permissions.yaml edit that breaks the matrix fails the build."
      priority: critical
      references_constraints: [C-08]
    - id: AC-18
      description: >
        Per-route enforcement is structurally guaranteed, not remembered. Every
        operation in api/openapi.yaml that declares x-required-permission MUST
        have a handler that enforces the matching codegen-typed constant from
        internal/auth/permissions.gen.go, and the declared permission MUST exist
        in the registry. A handler that omits the check, or a contract that
        names a permission the registry does not have, fails the build. The
        check follows delegation to a same-receiver helper (several handlers are
        thin wrappers whose enforcement lives one call down), so a false
        positive cannot be "fixed" by weakening it. Before this AC the
        x-required-permission declarations were decorative: nothing linked the
        contract to the code, and the link was maintained by review alone.
      priority: critical
    - id: AC-19
      description: >
        The anti-escalation guard fails CLOSED on any role it cannot resolve.
        RoleGrantsWithin previously returned true (allow) for every role absent
        from the built-in registry, on the reasoning that an unknown role
        confers nothing. That reasoning does not hold for a CUSTOM role: it
        exists, it is not built in, and the downstream existence check accepts
        it, so the guard passed for every custom role on both the role-assign
        and the API-token-mint paths. The guard MUST now distinguish three
        states and treat them differently. A role that RESOLVES is evaluated
        against its actual permission set, whether built in or custom. A role
        that is INDETERMINATE (no resolver, or the lookup failed) is DENIED,
        because the guard cannot show the grant is within the caller's
        authority and a database fault must not open it. A role that is
        PROVABLY ABSENT passes the guard, because it confers nothing and the
        downstream existence check rejects it as bad input; denying there would
        turn a client typo into an authorization error and change the
        documented 400 for an unknown role id into a 403.
      priority: critical
    - id: AC-20
      description: >
        A caller MUST NOT author a custom role granting a permission they do
        not themselves hold. Validating that a permission is registered is not
        the same as validating the author may confer it: authoring an
        over-broad role and then having it assigned is a two-step escalation
        that neither step catches alone. CreateCustomRole rejects with
        ErrRoleExceedsGrant and names the offending permissions so the API can
        return them.
      priority: critical
    - id: AC-21
      description: >
        Privileged surfaces are not reachable anonymously, and identity is not
        disclosed to a caller who has none. POST /diagnostics:enqueue-test-job
        writes to the real job queue and MUST require an admin-mutating
        permission: unauthenticated it is a denial-of-service primitive and a
        source of unbounded table growth. POST /admin/license:verify MUST
        require an admin read: anonymously it answers whether any submitted JWT
        verifies and reports its tier, features, expiry, and whether it was
        signed with the previous key, which leaks key-rotation state. POST
        /hosts/{id}/connectivity:check MUST require host:connectivity_check
        rather than host:read, because it makes the server open an SSH or ICMP
        connection to a managed host on demand; that is a side effect, not a
        read, and viewer and auditor therefore lose it. GET /license MUST
        disclose a field anonymously only when a pre-login screen needs it AND
        it is not a customer or infrastructure fact. Exactly three qualify:
        tier, status, features. customer_id, expires_at, using_prev_key,
        in_grace_period and clock_rollback_detected all require system:read,
        and a field nobody has sorted defaults to gated. The first fix here
        gated customer_id alone and left expires_at, a contract end date of
        the same class, set outside the same permission check. The full rule
        and its field-level tests live in api-license C-06, AC-11 and AC-12;
        this AC states only that the route is governed by a rule rather than
        by a list someone maintains.
      priority: critical
    - id: AC-22
      description: >
        A license feature check is never the only gate on a route. Every
        operation in api/openapi.yaml that declares x-required-feature also
        declares x-required-permission, and the per-route enforcement gate in
        AC-18 then holds its handler to the matching typed constant. Verified
        by inspecting the contract, so a new paid route that ships with an
        entitlement gate and no permission fails the build rather than review.
        POST /diagnostics:premium-echo was the instance: it called
        license.EnforceFeature and nothing else, so on any instance licensed
        for premium_diagnostics an anonymous caller reached the handler. Its
        sibling POST /diagnostics:require-remediation-execute already declared
        both and was unaffected.
      priority: critical
      references_constraints: [C-09]
    - id: AC-23
      description: >
        RBAC runs before the feature check inside the handler, not just in the
        contract. For a route carrying both gates, a caller who lacks the
        permission is denied 401 or 403 whatever the license state, and in
        particular an anonymous caller on an UNLICENSED instance still gets
        401 rather than 402. The status code therefore carries no information
        about what the deployment bought. Testing this needs both license
        states, since checking only the licensed instance would pass even if
        the handler ran the checks in the wrong order.
      priority: critical
      references_constraints: [C-03, C-09]
    - id: AC-24
      description: >
        POST /diagnostics:echo requires system:read, the same permission its
        sibling :premium-echo already requires. A DIRECT anonymous call, one
        that does not hit the idempotency cache, returns 401 auth.required and
        writes no idempotency row. internal/idempotency/middleware.go stores
        only a 2xx, so a denial is never cached and never replayable.

        The gate changes WHAT anonymous traffic writes, not HOW MUCH. It does
        not stop the audit write: auth.EnforcePermission denies through
        denyPermission, which emits authz.permission_denied on every denial
        including an anonymous one, exactly as AC-09 already requires. What
        changes is the content. The row is now a fixed shape carrying
        required_permission and actor_role, instead of an event carrying up to
        1024 characters of the caller's own text that a compliance reviewer
        later reads as evidence. That is the evidence-integrity half. The row
        COUNT is still unbounded, and nothing rate-limits the route, because
        internal/server/server.go throttles login and MFA only. Recorded here
        as open, not closed by this AC.

        An in-handler permission check does not run on an idempotency cache
        hit. The middleware returns the stored response without calling the
        handler, so a caller who supplies a previously used key and its exact
        body is served the cached 200 whatever their identity. This is
        route-agnostic: the middleware is mounted globally and keys on the
        header alone, never on the contract or the caller. Nothing ties a
        cached row to its creator either, so the same gap lets one
        AUTHENTICATED caller replay another's cached response by reusing their
        key. Closing either half needs a change in the idempotency middleware,
        not here. Both are filed as bugs/OW-012, which needs a migration
        because idempotency_keys has no actor column. No AC in this spec may be
        read as having closed them.
      priority: critical
      references_constraints: [C-10]
    - id: AC-25
      description: >
        POST /diagnostics:evaluate-alert requires policy:read. It had no check
        of any kind, not even authentication. It decodes a score, evaluates the
        alert_thresholds policy, and returns the outcome with the policy type
        and version, so an anonymous caller could walk scores 0 to 100, watch
        where the verdict changes, and read back the deployment's alert
        thresholds along with which policy version is loaded. policy:read is
        the permission whose registered scope is viewing active policies, and
        policy content is what this route discloses. Two alternatives were
        considered and rejected. alert:read covers alert instances and history,
        which this route never returns. system:read would match the sibling
        diagnostics routes, but its registered scope is health, version and
        non-secret configuration, and a loaded policy is neither: the route
        answers with policy_type and policy_version, and the sibling write path
        POST /admin/policies:reload already uses the policy category for the
        same object. All five built-in roles hold both, so the choice changes
        nothing for them and decides only what a custom role built to read
        system health can also read. An anonymous call returns 401
        auth.required. All five built-in roles hold policy:read, so the 403
        case needs the technique in api-license AC-16: an
        auth.Identity on the request context with IsAnonymous false and a
        RoleID that auth.BuiltInRoles does not resolve.
      priority: critical
      references_constraints: [C-10]
    - id: AC-26
      description: >
        No mutating operation is anonymously open by accident. A test walks
        every POST, PUT, PATCH and DELETE in api/openapi.yaml and requires each
        one to resolve to a gate. Either the handler for its operationId
        provably enforces the caller, or the operationId appears on the named
        anonymous allowlist that api/openapi.yaml carries. Enforcement is read
        from the handler source, not from the annotation, and the check follows
        delegation to a same-receiver helper the way AC-18 already does, since
        many handlers are thin wrappers. It accepts either class of check: an
        RBAC check on a typed constant from internal/auth/permissions.gen.go,
        or an authentication check for a route that needs no specific
        permission. Reading the source rather than the contract is what keeps
        this AC honest: the annotation is documentation that a CI gate gives
        teeth, and the handler check is the only thing that stops a request.
        The allowlist is a TOP-LEVEL key in api/openapi.yaml named
        x-anonymous-mutations. It holds a list of maps, each with exactly two
        keys, operationId and reason. An entry for postAuthLogin, for example,
        records a reason such as: pre-auth by definition, this is where a
        caller gets credentials. Top-level, so one place shows the whole
        anonymous surface, rather than a marker scattered across the file that
        has to be gathered before it can be reviewed. Keyed by operationId
        rather than by a path and method pair, because every other structural
        gate here already keys on operationId, including AC-18 and the parser
        it shares. Every entry MUST carry a reason and MUST name an operationId
        that still exists in the contract, so a renamed or deleted route fails
        this AC instead of leaving a dead entry that quietly widens the rule.
        An operationId MUST NOT appear twice, since a duplicate hides one of
        the two entries from review. An operation MUST NOT both appear here and
        declare x-required-permission, because the two say opposite things: a
        route that gets gated later and keeps its old entry leaves the
        inventory advertising an anonymous surface that no longer exists. A new
        mutating operation with neither a gate nor an allowlist entry fails,
        and that failure is the point. Both defects this AC closes survived
        review because a silent contract reads exactly like a safe one.
      priority: critical
      references_constraints: [C-10]
