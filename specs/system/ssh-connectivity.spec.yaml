spec:
  id: system-ssh-connectivity
  title: SSH connectivity check against resolved credentials
  version: "1.6.0"
  status: approved
  tier: 2

  context:
    system: openwatch
    feature: SSH dial layer
    description: >
      Performs an SSH handshake against a host using the credential
      returned by credential.Resolve. The dial layer is the only path
      that consumes plaintext secrets; the api-hosts connectivity-check
      endpoint and the future Kensa scan executor both go through it.
      Key validation follows NIST SP 800-57 (RSA ≥ 2048, Ed25519 always
      OK). Host-key verification has two modes: strict (known-hosts
      lookup; reject unknown) and TOFU (trust-on-first-use, then
      strict). Timeouts are mandatory.
    related_specs:
      - system-credential-store
      - system-host-inventory

  objective:
    summary: >
      Make "can the platform reach this host?" answerable in one call
      with a hard timeout, a clean error per failure mode, and no
      leaked credential material in any log or audit row.
    scope:
      includes:
        - Dial(ctx, host, cred) with timeout enforcement
        - Known-hosts policy (Strict, TOFU)
        - NIST SP 800-57 key validator (RSA ≥ 2048, Ed25519, ECDSA P-256+)
        - Distinct error sentinels per failure mode for forensic clarity
      excludes:
        - "Running commands over SSH (Slice B's scan executor)"
        - "Connection pooling / session reuse (no demand in Slice A)"
        - "SSH cert auth (deferred — operators rarely use it)"

  constraints:
    - id: C-01
      description: >-
        Dial MUST enforce a connect+handshake timeout no greater than
        DefaultDialTimeout (10 seconds); callers may supply a shorter ctx
        deadline. v1.4.0 (bugs/OW-120): the bound covers the SSH handshake
        itself, not only the TCP connect. crypto/ssh's ClientConfig.Timeout
        does not reach ssh.NewClientConn, so a server that never sends a
        banner used to hold the handshake past every deadline. Dial and
        DialConn close the connection when the bound passes or ctx is
        canceled, and stop watching once the handshake returns.
      type: performance
      enforcement: error
    - id: C-02
      description: Dial MUST reject RSA keys below 2048 bits per NIST SP 800-57
      type: security
      enforcement: error
    - id: C-03
      description: Dial MUST NEVER include a credential's password or private key in any error message, log line, or audit detail
      type: security
      enforcement: error
    - id: C-04
      description: Strict known-hosts mode MUST reject a connection when the host's presented key does not match any known-hosts entry for that hostname
      type: security
      enforcement: error
    - id: C-05
      description: TOFU known-hosts mode MUST accept the first key presented for a hostname and store it; subsequent connections behave like Strict against that stored key
      type: security
      enforcement: error
    - id: C-06
      description: A failed handshake MUST surface a distinct error sentinel (ErrAuthFailed / ErrHostKeyUnknown / ErrHostKeyMismatch / ErrDialTimeout / ErrConnect) so callers can audit by reason
      type: technical
      enforcement: error
    - id: C-09
      description: 'v1.2.0 — The credential-password sudo fallback applies to EVERY SSH-using subsystem that issues a sudo command, namely: (1) the compliance collector via ssh.RunSudo, (2) the liveness privilege probe in internal/sshprivilege, (3) OS discovery firewall queries in internal/intelligence/discovery. When the initial `sudo -n <cmd>` returns non-zero, the call site MAY retry as `sudo -S -k -p '' <cmd>` ONLY when ALL of these hold — (a) systemconfig.SecurityConfig.AllowCredentialSudoPassword is true, (b) cred.AuthMethod ∈ {password, both}, (c) cred.Password is non-empty. Any one condition false → no retry; the original sudo -n failure propagates with usedFallback=false. The conditions and the retry shape are IDENTICAL across the three call sites — drift between them is forbidden. NOTE: the compliance scan path ALSO supports credential-password sudo, but via the per-connection sudo-mode probe defined in system-connection-profile (a once-per-connection `true` sentinel, then `sudo -S -p ''` without `-k` given the high command volume) — it is deliberately NOT part of this inline `sudo -n`→`sudo -S -k` retry shape and is exempt from the identical-shape rule. Separately, AllowCredentialSudoPassword now DEFAULTS to true (a kill-switch, not opt-in); the per-call gating above is unchanged.'
      type: security
      enforcement: error
    - id: C-10
      description: The credential password MUST be delivered to the remote sudo process via the SSH session's STDIN pipe (RunWithStdin). The password MUST NOT appear in the cmd argv on the remote host. Source-inspection enforces (AC-15).
      type: security
      enforcement: error
    - id: C-11
      description: Every sudo -S retry MUST include the -k flag so the remote sudo credential cache is invalidated before each attempt. A wrong password therefore fails immediately on the FIRST sudo -S call rather than incrementing pam_tally2 / pam_faillock counters that could lock the host user out.
      type: security
      enforcement: error
    - id: C-12
      description: When sudo -n succeeds, the password fallback path MUST NOT execute and the credential password MUST NOT be transmitted. Source-inspection enforces (AC-15) — there is exactly one call site that passes a password to sudo and it is unreachable after a sudo -n success on the same command.
      type: security
      enforcement: error
    - id: C-13
      description: >-
        TOFU's "store the first key" (C-05) MUST be DURABLE in production:
        the known-hosts store MUST persist across process restarts. The
        in-memory store is per-process, so a restart re-TOFUs every host and
        a network attacker can MITM the first scan after each restart to
        harvest credentials. Production therefore wires a PostgreSQL-backed
        KnownHostsStore (internal/knownhosts, table ssh_known_hosts) at every
        dial site, not an in-memory store. A changed key is still rejected
        (ErrHostKeyMismatch) by the dial layer.
      type: security
      enforcement: error

    - id: C-14
      description: >-
        v1.5.0 (features/OW-122 slice 1). A dial classifies what it
        established about each secret it holds from evidence the client can
        observe, not from error text, and reports it through
        DialOptions.Report however the dial ends. It records each
        authentication method, whether the method sent a secret and how many
        times, and its result: accepted (USERAUTH_SUCCESS), partial
        (USERAUTH_FAILURE with partial success), ended without success over
        an intact connection, or ended with no answer the client could see (a
        transport error, a server disconnect or the dial's timeout).
        crypto/ssh's client treats USERAUTH_FAILURE and an unexpected reply,
        such as SSH_MSG_USERAUTH_PASSWD_CHANGEREQ (RFC 4252 section 8), alike
        and does not say which it saw, so an ended method does not establish a
        rejection, and the SSH classifier never reports one. A
        keyboard-interactive exchange is inside the supported profile when, in
        the whole exchange, at most one hidden prompt is asked, which the
        password answers, and no visible prompt; prompt-free rounds are
        information. A further hidden prompt leaves the profile, whatever it
        asks. Per secret, in order: a secret a method sent and the server
        accepted, fully or in part, is verified; an exchange outside the
        profile is unsupported_profile; a secret sent with no answer seen is
        ambiguous; a secret whose method ended without success is
        unsuccessful, its cause not established; a key whose passphrase is
        wrong or missing is local_decrypt_failed; otherwise the secret was
        not_submitted. A partial success accepts the secret, not the login
        (RFC 4252 section 5.1): the dial fails, the report keeps the partial
        result, and it is not a usable connection or by itself grounds for
        recovery. The observer chooses nothing: authentication order, the
        methods offered, what keyboard-interactive answers, and the error Dial
        returns are unchanged. Consumers adopt the outcome in later slices.
      type: technical
      enforcement: error

    - id: C-15
      description: >-
        v1.6.0 (features/OW-122 slice 4). ProtectedDial submits one of a
        credential's secrets, a password or a key, under credential
        protection (system-credential-protection). It reserves the submission
        before any network I/O, identifying the secret from the material it
        will send: a password through the loaded fingerprint keyring, a key by
        the SHA-256 of its public key. A refused reservation, or a protection
        store that cannot be reached, opens no connection. A key that cannot
        be decrypted reserves nothing. The dial offers exactly one
        secret-bearing method, through ClientConfig.AuthCallback: after the
        none method it hands crypto/ssh that method if the server offers it,
        and after that method it ends the exchange, whatever the result. A key
        is sent by publickey and never falls through to the password. A
        password goes by the host's learned method when offered, otherwise by
        the other password method when offered, and on first contact password
        before keyboard-interactive. A method the server does not offer is not
        sent. The fence runs once, inside the method's callback, immediately
        before the secret is handed to crypto/ssh. The store's fence reads
        the credential again through Current under its own lock on the
        credential row (system-credential-protection C-07): it must be
        active, have the same username, and still hold the secret being
        sent, so an edit committed before the fence is seen. A refused fence returns an error
        from the callback, so crypto/ssh writes nothing. Keyboard-interactive
        is answered only inside the C-14 profile: a round with a visible
        prompt, with several prompts, or with a second hidden prompt is
        refused before any response is written, and is unsupported_profile.
        A partial success is unsupported_profile, never verified: the login
        needs a step the dial does not take. Every reserved submission is
        settled exactly once with the C-14 outcome of its secret, however the
        dial ends, on a context the dial's cancellation does not reach; an
        outcome the dial cannot name settles as unknown. If the outcome cannot
        be recorded, the connection is closed and the error wraps
        ErrNotRecorded; the reservation then expires as unknown. Against
        OpenSSH with pam_faillock, a password rotated on the host and still
        held adds one failure to the account's tally across concurrent
        workers and repeated dials. Hosted Go CI and the strict local gate
        run that container test with OPENWATCH_SSH_CONTAINER_TESTS=1.
      type: technical
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: Dial against a reachable test SSH server with a valid password credential completes the handshake within 1 second.
      priority: critical
    - id: AC-02
      description: Dial against a reachable test SSH server with a valid Ed25519 private-key credential completes the handshake within 1 second.
      priority: critical
    - id: AC-03
      description: Dial against a TCP address that refuses connections returns ErrConnect within DefaultDialTimeout (10s).
      priority: critical
      references_constraints: [C-01]
    - id: AC-04
      description: Dial with a context that times out before the underlying dial returns surfaces ErrDialTimeout (not a generic ctx.DeadlineExceeded).
      priority: critical
      references_constraints: [C-01, C-06]
    - id: AC-05
      description: ValidateAuthKey rejects an RSA key with bitlen < 2048 with ErrWeakKey; accepts an RSA key with bitlen >= 2048; always accepts an Ed25519 key.
      priority: critical
      references_constraints: [C-02]
    - id: AC-06
      description: KnownHostsPolicy Strict mode rejects an unknown-host-key handshake with ErrHostKeyUnknown; the connection is NOT cached.
      priority: critical
      references_constraints: [C-04, C-06]
    - id: AC-07
      description: KnownHostsPolicy TOFU mode accepts the first connection to a hostname and persists the key; a second connection with the SAME key succeeds; a second connection with a DIFFERENT key returns ErrHostKeyMismatch.
      priority: critical
      references_constraints: [C-05, C-06]
    - id: AC-08
      description: A failed Dial's returned error AND any audit emission MUST NOT contain the cleartext password or the cleartext private key from the credential.
      priority: critical
      references_constraints: [C-03]
    - id: AC-09
      description: Dial returns ErrAuthFailed (distinct from ErrConnect / ErrHostKeyUnknown) when credentials are rejected by the server.
      priority: critical
      references_constraints: [C-06]
    - id: AC-10
      description: Dial against an unparseable private-key credential returns ErrInvalidKey BEFORE any network I/O — invariant verified by mocking the dial network func.
      priority: high
    - id: AC-11
      description: Test stub returns exit 1 for `sudo -n cat /etc/shadow` then exit 0 for `sudo -S -k -p '' cat /etc/shadow` with the expected password on stdin. With AllowCredentialPassword=true and cred.AuthMethod=both + populated Password, ssh.RunSudo returns the fallback's (out, code=0, usedFallback=true) and the collector's runCycleWithTransport reports fallback count > 0.
      priority: critical
      references_constraints: [C-09]
    - id: AC-12
      description: Same stub setup as AC-11 but AllowCredentialPassword=false. The sudo -n exit 1 propagates verbatim; ssh.RunSudo issues NO sudo -S -k call; usedFallback=false; the collector's per-cycle fallback count remains 0.
      priority: critical
      references_constraints: [C-09]
    - id: AC-13
      description: cred.AuthMethod=ssh_key with empty cred.Password. Policy allows fallback but credential cannot provide one. ssh.RunSudo MUST NOT issue sudo -S -k; usedFallback=false.
      priority: critical
      references_constraints: [C-09]
    - id: AC-14
      description: Stub returns exit 0 for `sudo -n cat /etc/shadow`. The password fallback path MUST NOT execute even if policy + credential would allow it. Snapshot is populated normally; zero `system.intelligence.sudo_password_used` audit events emitted.
      priority: critical
      references_constraints: [C-12]
    - id: AC-15
      description: Source-inspection of internal/ssh/sudo.go verifies the password is passed to RunWithStdin via the stdin parameter and never appears in the cmd string. The single call site that builds the `sudo -S -k -p ''` command MUST source the password from cred.Password — no fmt.Sprintf interpolation of secret material into argv.
      priority: critical
      references_constraints: [C-10]
    - id: AC-16
      description: After one collector.RunCycle against a host where the password fallback engaged for at least one sudo command, exactly one audit event of code `system.intelligence.sudo_password_used` is emitted with detail.credential_id = the credential UUID, detail.host_id = the host UUID, and detail.command_count = the number of distinct sudo commands that used the fallback. Cycles with zero fallback use emit zero such events.
      priority: critical
      references_constraints: [C-09]
    - id: AC-17
      description: Stub returns exit 1 for sudo -n then exit 1 for sudo -S -k (wrong password). ssh.RunSudo issues exactly ONE sudo -S -k call (no internal retry); usedFallback=true; the returned exit code matches the failing fallback. The -k flag is present in the fallback cmd string so the host-side sudo timestamp cache is invalidated, protecting against pam_tally2 / pam_faillock lockout.
      priority: critical
      references_constraints: [C-11]
    - id: AC-18
      description: 'v1.2.0 — Liveness privilege probe parity. A stubbed SSH session returns exit 1 for `sudo -n true` then exit 0 for `sudo -S -k -p '''' true` with the credential password fed via stdin. With AllowCredentialSudoPassword=true and a credential carrying a non-empty Password, internal/sshprivilege.Probe returns ok=true. With the policy off (false) the probe returns ok=false and issues no sudo -S call.'
      priority: critical
      references_constraints: [C-09, C-10, C-11]
    - id: AC-19
      description: 'v1.2.0 — Liveness privilege probe — credential cannot supply a password. cred.AuthMethod=ssh_key with empty cred.Password and AllowCredentialSudoPassword=true. The probe MUST NOT issue any sudo -S call (no Password to feed); the sudo -n exit 1 propagates as ok=false.'
      priority: critical
      references_constraints: [C-09]
    - id: AC-20
      description: 'v1.2.0 — OS discovery firewall parity. A stubbed SSH session returns exit 1 for `sudo -n ufw status` then exit 0 for `sudo -S -k -p '''' ufw status` (with active output) when fed the password via stdin. With policy on + password, discovery.probeFirewall returns service="ufw", status="active". With policy off or no password, the helper returns ok=false from this attempt (existing fall-through to the next firewall remains).'
      priority: critical
      references_constraints: [C-09, C-10, C-11]
    - id: AC-21
      description: 'v1.2.0 — Negative invariant across all three sites: a sudo -n exit 0 MUST NOT trigger the fallback. Source-walk asserts that the three call sites (ssh.RunSudo, sshprivilege.Probe, discovery.probeFirewall) all gate the sudo -S retry behind a non-zero exit code from sudo -n and a runtime policy/credential check.'
      priority: high
      references_constraints: [C-09, C-12]
    - id: AC-22
      description: The PostgreSQL known-hosts store (internal/knownhosts) round-trips Put/Get for a hostname and returns (nil,false) for an absent host; a key stored by one Store instance is visible to a fresh Store instance on the same database (the durable-TOFU-across-restart guarantee), and re-Putting the same key is idempotent.
      priority: critical
      references_constraints: [C-13]
    - id: AC-23
      description: >-
        v1.4.0. Against a peer that never sends an SSH banner, whether or not
        it reads, Dial returns ErrDialTimeout within its bound for a ctx
        deadline, for opts.Timeout, and for a ctx canceled with no deadline;
        DialConn does the same on a caller's connection. A client dialed with
        a short opts.Timeout still runs a command after that timeout has
        passed.
      priority: critical
      references_constraints: [C-01]
    - id: AC-24
      description: >-
        v1.5.0. Against an in-process server, with a password credential: an
        accepted password, an accepted keyboard-interactive password, and a
        password accepted as a partial success are verified; a wrong password
        by either method is unsuccessful, never rejected; a second hidden
        prompt, and a round with only a visible prompt or with two hidden
        prompts, are unsupported_profile; a server offering no password
        method, and one that admits the client without asking for the
        password, leave it not_submitted. Dial returns the same error as
        before in each case, and the report holds no outcome for a secret the
        credential lacks.
      priority: critical
      references_constraints: [C-14]
    - id: AC-25
      description: >-
        v1.5.0. A password the server never answered is ambiguous, not
        unsuccessful: when the server drops the connection on receiving it,
        and when the dial times out while the server holds it (Dial still
        returns ErrDialTimeout). The correct password followed by a hidden
        one-time-code prompt and a dropped connection is unsupported_profile.
        When the server disconnects as the next method starts, that method is
        not recorded as ended with an answer.
      priority: critical
      references_constraints: [C-14]
    - id: AC-26
      description: >-
        v1.5.0. An accepted key is verified and a refused key unsuccessful.
        With a key and a password, a refused key and an accepted password are
        reported separately, the server sees publickey before password as
        before, and a keyboard-interactive exchange outside the profile
        affects the password's outcome only. A key with a wrong or missing
        passphrase is local_decrypt_failed, and nothing is dialed.
      priority: critical
      references_constraints: [C-14]
    - id: AC-27
      description: >-
        v1.5.0. A refused connection and a refused host key leave every
        secret not_submitted with no method recorded, and the server sees no
        authentication before its host key is accepted. A dial without a
        report behaves as before.
      priority: high
      references_constraints: [C-14]
    - id: AC-28
      description: >-
        v1.6.0. Against an in-process server that counts what it receives, a
        protected dial sends one secret-bearing request: a wrong password goes
        once and is never replayed through keyboard-interactive; the learned
        keyboard-interactive method leads when offered; a keyboard-interactive
        only host is reached on first contact; a refused key never falls
        through to the password; and a password the server has no method for
        is not sent and is not fenced.
      priority: critical
      references_constraints: [C-15]
    - id: AC-29
      description: >-
        v1.6.0. A refused reservation opens no connection and fences and
        settles nothing. A refused fence sends nothing over password,
        keyboard-interactive or publickey, and settles not_submitted. The
        fence receives the credential as stored now, so a changed password, a
        changed username and a deactivation reach it, and a credential that
        cannot be read sends nothing. The reserved identifier is the one
        computed from the material sent.
      priority: critical
      references_constraints: [C-15]
    - id: AC-30
      description: >-
        v1.6.0. A keyboard-interactive round with a visible prompt, two hidden
        prompts, or a hidden and a visible prompt gets no response; after the
        password, a second hidden prompt or a visible one gets none either.
        Each is unsupported_profile. Prompt-free rounds are answered, and the
        fence runs once. A partial success is unsupported_profile and no
        further method is tried.
      priority: critical
      references_constraints: [C-15]
    - id: AC-31
      description: >-
        v1.6.0. A refused connection and a refused host key settle
        not_submitted, and an unanswered password ambiguous. A dial canceled
        during authentication still settles, on a context that is not
        canceled. An outcome that cannot be recorded returns no client and
        wraps ErrNotRecorded. A key with a wrong passphrase reserves nothing
        and reports local_decrypt_failed. Each named outcome settles as itself
        and any other as unknown.
      priority: critical
      references_constraints: [C-15]
    - id: AC-32
      description: >-
        v1.6.0. With the real protection store and a loaded keyring: after a
        password is verified and then rotated on the host, eight workers
        dialing at once with the old password make the host receive one
        secret-bearing request in total; one dial fails authentication, the
        others are refused by protection, the secret is BLOCKED, and later
        dials are refused before they connect. A fence refused because the
        credential was deactivated or edited sends nothing, leaves the mode
        unchanged and holds no slot.
      priority: critical
      references_constraints: [C-15]
    - id: AC-33
      description: >-
        v1.6.0. With the real credential service and protection store, a
        password rotation or a soft deletion committed through the service
        after the dial asks for the fence, and before the store's fence
        takes its locks, sends nothing, and the dial returns ErrFenceRefused.
      priority: critical
      references_constraints: [C-15]
    - id: AC-34
      description: >-
        v1.6.0. Against OpenSSH with pam_faillock at deny = 3, in a local
        container, with password and keyboard-interactive offered and with
        keyboard-interactive only: after the host rotates a verified
        password, eight concurrent workers and five later dials with the old
        password leave exactly one failure in the account's pam_faillock
        tally, and the new password then verifies. Hosted Go CI runs it with
        OPENWATCH_SSH_CONTAINER_TESTS=1, so a skip leaves the criterion
        uncovered.
      priority: critical
      references_constraints: [C-15]
