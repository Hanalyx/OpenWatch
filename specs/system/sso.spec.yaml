spec:
  id: system-sso
  title: Single sign-on (OIDC) — provider store + authorization-code flow
  version: "1.1.0"
  status: approved
  tier: 1

  context:
    system: openwatch
    feature: >-
      internal/sso owns SSO provider configuration (migration 0034) and the
      OpenID Connect authorization-code sign-in flow. Providers are
      admin-configured; their client secret is AES-256-GCM encrypted at
      rest. The runtime flow uses PKCE (S256), a CSRF state, and a
      replay-guard nonce, and verifies the ID token's RS256 signature
      against the provider JWKS before provisioning a user or issuing a
      session.
    description: >-
      A first successful sign-in provisions a passwordless local user keyed
      on the stable OIDC sub (not the mutable email) and records the
      federation link in sso_identities; later sign-ins reuse it. Per-login
      state (state, nonce, PKCE verifier) lives in sso_auth_states and is
      consumed exactly once at callback.
    related_specs:
      - api-sso
      - system-auth-identity
      - system-user-management
      - system-rbac

  objective:
    summary: >-
      Lock the encrypted-at-rest secret, the PKCE/state/nonce flow, the
      JWKS-backed ID-token validation, the single-use auth state, and the
      provision-or-link user mapping.
    scope:
      includes:
        - "sso_providers / sso_identities / sso_auth_states (migration 0034)"
        - "Provider CRUD: secret encrypted on write, never returned on read; https issuer required"
        - "BuildAuthURL: authorize URL with code+PKCE(S256)+state+nonce; persists single-use auth state"
        - "OIDC discovery validated (issuer match + endpoints present)"
        - "HandleCallback: ID-token RS256/JWKS signature + iss/aud/exp/nonce checks; provision-or-link"
      excludes:
        - "SAML (separate slice)"
        - "Dynamic client registration / provider-initiated logout"

  constraints:
    - id: C-01
      description: >-
        The client secret MUST be stored AES-256-GCM encrypted
        (client_secret_enc) and MUST NOT appear on any read path — the
        Provider struct returned by List/Get carries no secret field. The
        issuer MUST be an https URL (discovery, token, and JWKS calls ride
        it).
      type: security
      enforcement: error
    - id: C-02
      description: >-
        BuildAuthURL MUST use the authorization-code flow with PKCE S256
        (code_challenge derived from a per-login verifier), a random state,
        and a random nonce, and MUST persist them as a single-use
        sso_auth_states row with a bounded TTL. The verifier and nonce MUST
        NOT leave the server (only the S256 challenge does).
      type: security
      enforcement: error
    - id: C-03
      description: >-
        HandleCallback MUST consume the auth state exactly once (a second
        consume fails; an expired state is rejected), MUST verify the ID
        token's RS256 signature against the provider JWKS, and MUST reject
        the token unless iss matches the issuer, aud contains the client id,
        exp is in the future, and nonce equals the stored nonce. Any failure
        returns an error and provisions no user / issues no session.
      type: security
      enforcement: error
    - id: C-04
      description: >-
        The federation link is keyed on (provider, sub). A first sign-in
        provisions a passwordless local user with the provider's default
        role and records the link; subsequent sign-ins for the same sub
        reuse the linked user (no duplicate provisioning).
      type: technical
      enforcement: error

    - id: C-05
      description: >
        Federated identity resolution MUST consult the local account's state.
        A subject whose link resolves to a disabled or soft-deleted user MUST
        NOT sign in, MUST receive no session and no refresh token, and MUST
        NOT be recorded as a successful login. The federation link survives
        both operations (soft delete is an UPDATE, so the ON DELETE CASCADE
        on sso_identities never fires), so without this check the two controls
        an operator uses to end access do not hold on this path. Resolution
        MUST distinguish "this subject is unknown" from "this subject belongs
        to an account that may not sign in": filtering the state out of the
        lookup would report no link and provision a SECOND user for a subject
        that already has one. Issuance MUST additionally revalidate account
        state under the per-user lock, because a disable committing between
        resolution and issuance would otherwise produce a session that nothing
        later revokes.
      type: security
      enforcement: error

    - id: C-06
      description: >
        The SSO callback MUST report an UNKNOWN issuance outcome as uncertainty,
        not as failure. When the issuance transaction's commit outcome is
        indeterminate, a session may exist that the response cannot deliver,
        or none may exist. The callback MUST redirect to
        /login?sso_error=unconfirmed, a value distinct from every failure
        value, and MUST NOT set a credential cookie, clear an existing one,
        replay the callback or restart sign-in. Neither the log nor any audit
        event may assert that issuance succeeded or rolled back; no login
        success or failure event is written. A KNOWN rollback stays
        /login?sso_error=session. Issuance MUST run through the handlers'
        transaction source, so the outcome can be selected deterministically
        under test.
      type: security
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: Create persists a provider with the client secret encrypted (the stored client_secret_enc is not the plaintext bytes); List/Get return the metadata with no secret field; Create rejects a non-https issuer and a missing name/client_id/client_secret with ErrInvalidParams.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: Update with a non-empty client_secret replaces it; Update with an empty client_secret leaves the stored secret intact (a later sign-in still authenticates). Update of an unknown id returns ErrProviderNotFound.
      priority: high
      references_constraints: [C-01]
    - id: AC-03
      description: BuildAuthURL returns the provider authorization endpoint with response_type=code, the client_id, the redirect_uri, a scope containing openid, a state, a nonce, code_challenge, and code_challenge_method=S256; it persists exactly one sso_auth_states row carrying the matching nonce + a PKCE verifier whose S256 hash equals the challenge.
      priority: critical
      references_constraints: [C-02]
    - id: AC-04
      description: discover rejects a document whose issuer does not match the configured issuer, and one missing the authorization/token/jwks endpoints (ErrDiscovery).
      priority: high
      references_constraints: [C-03]
    - id: AC-05
      description: consumeAuthState returns the row once then deletes it (a second consume returns ErrStateNotFound); a row past its expiry returns ErrStateExpired.
      priority: critical
      references_constraints: [C-03]
    - id: AC-06
      description: HandleCallback against a stub IdP validates a correctly-signed ID token (matching iss/aud/exp/nonce) and returns the claims' subject; it returns ErrTokenValidation for a token signed by a non-JWKS key (bad signature), for a mismatched nonce, and for a wrong audience.
      priority: critical
      references_constraints: [C-03]
    - id: AC-07
      description: HandleCallback provisions a new user on first sign-in (Provisioned true, an sso_identities row created via the injected ProvisionFunc) and returns the same user without re-provisioning on a second sign-in for the same subject.
      priority: critical
      references_constraints: [C-04]
    - id: AC-08
      description: users.CreateFederatedUser creates an active user with the given role assigned and a password hash that is NOT the empty string and cannot be produced from a known password (random entropy); it surfaces a uniqueness collision as an error rather than merging.
      priority: high
      references_constraints: [C-04]
    - id: AC-09
      description: >
        A federated sign-in for a disabled or soft-deleted account is refused:
        no session row, no refresh row, no cookies, and no success audit. An
        active account is unaffected. The federation link is left in place, so
        re-enabling the account restores sign-in without re-provisioning.
      priority: critical
      references_constraints: [C-05]
      inputs:
        initial_state: >
          An existing federation link created by an earlier successful sign-in
          while the account was active
        operation: "Complete the real SSO callback for that federated subject"
        variants: ["Disabled", "Soft-deleted", "Active control"]
        method: >
          A controlled test identity provider signs an ID token for a fixed
          subject; the state and nonce come from the server's own
          sso_auth_states row, so state, nonce, issuer, audience and signature
          validation all run unchanged. The account transition is applied
          through the real users service between two sign-ins. Only the
          outbound HTTP transport is substituted, because the shipped client's
          SSRF guard blocks loopback by design and that guard is left alone.
          No concurrency and no elapsed-time dependence.
      expected_output:
        per_variant:
          Disabled: {session_cookie_issued: false, refresh_cookie_issued: false, sessions_written: 0, refresh_written: 0}
          Soft-deleted: {session_cookie_issued: false, refresh_cookie_issued: false, sessions_written: 0, refresh_written: 0}
          Active control: {session_cookie_issued: true, refresh_cookie_issued: true, authenticates: true}
        audit: "No auth.login.success for a refused account"
        prohibited_changes:
          - "A session or refresh row written for a disabled or soft-deleted account"
          - "An auth.login.success recorded for a refused sign-in"
          - "A second local user provisioned for a subject that already has one"
    - id: AC-10
      description: >
        SSO issuance revalidates account state under the per-user lock. A
        disable committed while the callback waits on that lock is observed,
        and nothing is issued.
      priority: critical
      references_constraints: [C-05]
      inputs:
        initial_state: "An active account with an existing federation link"
        concurrent_ordering: "Disable commits while the callback is blocked on the user lock"
        method: >
          The disabling transaction holds the user row; the callback blocks on
          it; the disable commits and releases. If the callback had not yet
          reached the lock it still observes the committed disable, so the
          assertion holds either way and cannot flake into a false pass.
      expected_output:
        response: "Redirect to /login with an error"
        durable_changes: []
        prohibited_changes: ["A session or refresh token issued for the disabled account"]
    - id: AC-11
      description: >
        The real SSO callback distinguishes a successful issuance, a known
        rollback, and an unknown outcome, and reports each truthfully. Both
        unknown variants read identically to the user, set no credential
        cookie, clear none, replay nothing, and write no login audit event,
        while the durable state confirms which variant the harness produced.
      priority: critical
      references_constraints: [C-05, C-06]
      inputs:
        initial_state: "An active account signing in for the first time through a controlled test provider"
        operation: "Complete the real SSO callback"
        variants:
          - name: "Durable commit, acknowledgement lost"
            setup: "The issuance transaction commits, then its acknowledgement is lost"
          - name: "Non-durable, outcome unknown"
            setup: "The issuance transaction does not commit, and its outcome is reported as unknown"
          - name: "Known rollback"
            setup: "A trigger fails the session insert inside the transaction"
          - name: "Successful issuance"
            setup: "No injected failure"
        method: >
          The transaction source is substituted through the handlers' seam,
          which selects each unknown variant deterministically and counts the
          transactions begun, so a replay would be visible. The server log is
          captured for the request, and sessions and refresh rows are read
          afterwards to confirm which variant actually ran.
      expected_output:
        per_variant:
          Durable commit, acknowledgement lost:
            location: /login?sso_error=unconfirmed
            credential_cookies_set: 0
            credential_cookies_cleared: 0
            transactions_begun: 1
            login_audit_events: 0
            log_states: "outcome unknown"
            durable_state: "session and refresh rows exist"
          Non-durable, outcome unknown:
            location: /login?sso_error=unconfirmed
            credential_cookies_set: 0
            credential_cookies_cleared: 0
            transactions_begun: 1
            login_audit_events: 0
            log_states: "outcome unknown"
            durable_state: "no session or refresh rows"
          Known rollback:
            location: /login?sso_error=session
            credential_cookies_set: 0
            durable_state: "no session or refresh rows"
          Successful issuance:
            location: "the return target"
            credential_cookies_set: 2
            durable_state: "one session and one refresh row"
        prohibited_changes:
          - "An unknown outcome reported as a failed sign-in"
          - "A credential cookie delivered without a confirmed commit"
          - "An automatic replay or restart of the sign-in"
          - "A log or audit event asserting success or rollback for an unknown outcome"
