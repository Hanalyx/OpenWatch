spec:
  id: system-supply-chain
  title: Supply-chain governance — module allowlist, vulnerability, SBOM
  version: "1.2.0"
  status: draft
  # v1.2.0: C-09 and AC-12 to AC-15. The release SBOMs carry the frontend's
  # runtime npm components, complete against the runtime lockfile, and say
  # which files are proven to ship. Each package SBOM carries the Go modules
  # of the binary it ships. The same merge and checks run on every pull
  # request's package build. syft is pinned by version and hash and asked for
  # CycloneDX 1.5: unpinned, it emitted 1.7, which AC-09 rejects (CP
  # bugs/OW-111). CP bugs/OW-110.
  # v1.1.0 — allowlist gained github.com/go-pdf/fpdf (pure-Go PDF, used for
  # the bounded executive report face; core fonts are built in, so it adds
  # no font files and stays airgap-safe). Its sole transitive dep,
  # github.com/boombuler/barcode, is indirect (pinned in go.sum, not
  # allowlisted per C-02). AC-03's generic test validates the addition.
  # Back to tier 1: AC-08/AC-09 (release-workflow SBOM via syft/CycloneDX) are
  # satisfied again now that .github/workflows/release.yml runs syft and emits
  # CycloneDX 1.5. (They were temporarily deferred to tier 2 while the Go-native
  # release workflow was being built after the Python CI was archived.)
  tier: 1

  context:
    system: openwatch
    feature: Third-party dependency allowlist + vulnerability + reproducibility gates
    description: >
      OpenWatch's third-party dependency surface is gated by an explicit
      allowlist in app/.golangci.yml's depguard linter — list-mode "strict"
      so any unlisted import fails the lint. govulncheck blocks merge on any
      reachable CVE (declared canonically in release-ci-gates). Dependabot
      raises PRs against the Go ecosystem so versions don't drift silently.
      CI runs every go command with -mod=readonly and asserts that
      `go mod tidy` is a no-op so neither builds nor lints can mutate
      go.mod or go.sum on the side. Release tags produce a CycloneDX 1.5
      SBOM artifact that downstream consumers can verify against this
      spec's allowlist.

  objective:
    summary: >
      Adding a new third-party module requires a deliberate, reviewable
      change to BOTH go.mod AND the depguard allowlist in the same PR.
      Drift cannot pass CI because depguard fails closed on unlisted
      imports, tidy fails on go.mod / go.sum drift, and govulncheck
      blocks on any reachable CVE. Release SBOMs document exactly what
      shipped.
    scope:
      includes:
        - depguard allowlist gating direct third-party imports
        - go.mod / go.sum drift detection in CI
        - GOFLAGS=-mod=readonly enforcement in CI build commands
        - Dependabot Go ecosystem coverage
        - CycloneDX 1.5+ SBOM artifact on every release tag
      excludes:
        - Vendoring (we do not commit vendor/)
        - Private module proxy (today public Go proxy is used)
        - Signed module verification beyond go.sum hashes
        - Allowlisting of transitive (indirect) modules — depguard sees
          only direct imports; indirect modules are pinned by go.sum

  constraints:
    - id: C-01
      description: app/.golangci.yml MUST enable depguard with list-mode "strict"; any third-party import not on the allow list fails the lint with a clear error message
      type: security
      enforcement: error
    - id: C-02
      description: Every third-party module directly imported by any .go file in app/ MUST have a matching allow entry in depguard. Transitive (indirect) deps are NOT required to be allowlisted — they appear in go.sum and are pinned, but depguard does not see them
      type: security
      enforcement: error
    - id: C-03
      description: CI lint, test, and build steps MUST run with GOFLAGS=-mod=readonly (or pass -mod=readonly explicitly) so go commands cannot silently mutate go.mod or go.sum
      type: security
      enforcement: error
    - id: C-04
      description: CI MUST run `go mod tidy` after checkout and fail on any resulting diff to go.mod or go.sum (drift detection); enforced via `git diff --exit-code go.mod go.sum`
      type: security
      enforcement: error
    - id: C-05
      description: .github/dependabot.yml MUST include at least one updates entry with package-ecosystem "gomod" pointing at /app so Go module updates get automatic PRs
      type: security
      enforcement: error
    - id: C-06
      description: The release workflow MUST produce a CycloneDX 1.5+ JSON SBOM artifact for every tagged release. The SBOM MUST describe the deployed artifact (the built binary, the RPM, the DEB) — not just the Go source manifest — because compliance reviewers ask for what's in the package, not what's in the source. Tool choice (syft) recorded in AC-07
      type: security
      enforcement: error
    - id: C-07
      description: govulncheck MUST gate every merge to main (cross-references release-ci-gates C-03). This spec records the dependency without duplicating the enforcement
      type: security
      enforcement: warning
    - id: C-08
      description: The depguard allow list MUST permit $gostd (Go standard library) and github.com/Hanalyx/openwatch (the internal module); without these, every file would fail
      type: technical
      enforcement: error
    - id: C-09
      description: >
        The SBOM of every openwatch release artifact (the binary, each RPM and
        each DEB) MUST include one component per runtime (non-dev) entry of
        frontend/package-lock.json, so it is complete against the runtime
        lockfile. It MUST NOT claim to list the JavaScript that ships. Each component carries purl, version and the lockfile
        license. The lockfile integrity value identifies the npm registry
        tarball, not installed or shipped bytes: it MUST be recorded on the
        component's distribution external reference, never in the component's
        own hashes, with the property openwatch:hash-source. The property
        openwatch:evidence is lockfile, which claims nothing about the bundle,
        or bundle-files-verified, which claims only that the listed files ship:
        a file of the installed package, at the locked version, is
        byte-identical to an embedded SPA file whose bytes are in the shipped
        binary. A verified component records how many package files matched,
        how many files the installed package has, and each match. One
        name@version installed at several paths is one component listing every
        path and every dependency edge; if the entries differ in integrity,
        license or tarball URL, the merge MUST fail. A package SBOM MUST also
        carry the Go modules of the binary it ships. Combining MUST keep every
        syft component and dependency edge unchanged, keep bom-refs unique, and
        leave no dependency ref unresolved. Each combined SBOM MUST be checked
        against the lockfile, the binary's build info and the artifact's
        digest, and every SBOM MUST validate against the CycloneDX 1.5 schema,
        both on each pull request's package build and in the release workflow.
        Schema validity alone is not completeness.
      type: security
      enforcement: error

  # Process note (not a spec-enforced constraint): adding or upgrading a
  # third-party module MUST update both app/go.mod AND the depguard
  # allowlist in the same PR. The spec's version SHOULD be bumped (semver
  # minor) whenever the allowlist changes. Reviewers enforce this; CI
  # catches the structural side via AC-03 (every imported module is
  # allowlisted).

  acceptance_criteria:
    - id: AC-01
      description: app/.golangci.yml's enabled linters list includes "depguard" alongside the existing forbidigo entry; source-inspection on linters.enable verifies.
      priority: critical
      references_constraints: [C-01]
    - id: AC-02
      description: app/.golangci.yml contains a linters-settings.depguard block with rules.main.list-mode set to "strict"; source-inspection verifies.
      priority: critical
      references_constraints: [C-01]
    - id: AC-03
      description: For every distinct third-party import path appearing in any .go file under app/, a matching module prefix is present on the depguard allow list. The test extracts import strings from source, maps each to its module, asserts each module appears on the allowlist. No unlisted import passes.
      priority: critical
      references_constraints: [C-02]
    - id: AC-04
      description: A test fixture that imports an unlisted module (e.g., github.com/example/forbidden) causes `golangci-lint run` to exit non-zero with a depguard violation message naming the unlisted import.
      priority: critical
      references_constraints: [C-01, C-02]
    - id: AC-05
      description: .github/workflows/go-ci.yml's lint, test, and build steps either set GOFLAGS=-mod=readonly in the env block OR pass -mod=readonly as an explicit flag on every go command; source-inspection verifies.
      priority: critical
      references_constraints: [C-03]
    - id: AC-06
      description: .github/workflows/go-ci.yml has a step (or a step in another workflow that runs on every PR) that executes `go mod tidy` followed by `git diff --exit-code -- go.mod go.sum`; source-inspection verifies the step's presence.
      priority: critical
      references_constraints: [C-04]
    - id: AC-07
      description: .github/dependabot.yml contains at least one updates entry with package-ecosystem "gomod" and directory pointing at "/app"; source-inspection verifies.
      priority: critical
      references_constraints: [C-05]
    - id: AC-08
      description: .github/workflows/release.yml (or equivalent release workflow) has a step that runs `syft` against the built binary plus the RPM and DEB packages and uploads the resulting CycloneDX SBOM as a workflow artifact named for the release tag. syft is chosen over cyclonedx-gomod because it scans the actual deployed artifact, not just the source manifest.
      priority: high
      references_constraints: [C-06]
    - id: AC-09
      description: A generated CycloneDX SBOM artifact validates against the published CycloneDX 1.5 JSON schema (https://cyclonedx.org/schema/bom-1.5.schema.json); end-to-end validation.
      priority: high
      references_constraints: [C-06]
    - id: AC-10
      description: depguard's allow list explicitly includes both "$gostd" and "github.com/Hanalyx/openwatch"; source-inspection verifies.
      priority: critical
      references_constraints: [C-08]
    - id: AC-11
      description: This spec cross-references release-ci-gates by mentioning system-release-ci-gates C-03 in its description; verifies the govulncheck dependency is non-orphan.
      priority: medium
      references_constraints: [C-07]
    - id: AC-12
      description: >
        The merge builds one component per runtime lockfile package: dev
        entries are excluded; scoped, nested and optional entries are kept.
        The integrity hash sits on a distribution reference with
        openwatch:hash-source, not in the component's hashes. A package is
        bundle-files-verified only when an installed file at the locked version
        matches an embedded SPA file byte for byte and those bytes are in the
        binary, and it records the matched count, its file count and each
        match. An installed version that differs from the lockfile, a match
        absent from the binary, or a match below the minimum size leaves it
        labeled lockfile. Duplicate name@version entries that differ in
        integrity, license or tarball URL fail the merge; those that agree keep
        every path and the union of their dependencies. A lockfile entry with
        no license, integrity or tarball URL, or an unresolvable required
        dependency, fails the merge.
      priority: high
      references_constraints: [C-09]
    - id: AC-13
      description: >
        Combining keeps every syft component and dependency edge unchanged,
        adds the shipped binary's Go modules to a package SBOM, makes the
        artifact and its package component depend on the Go main module and
        the frontend, and refuses a bom-ref collision with different content.
      priority: high
      references_constraints: [C-09]
    - id: AC-14
      description: >
        The check passes a correctly combined SBOM and reports each of these
        mutations: a missing or extra npm component; a changed version or
        license; a changed distribution URL or hash; the tarball hash moved
        into the component's hashes or left unlabeled; a bundle-files-verified
        label with no verified file, a wrong verified count, a file count below
        it, or an occurrence absent from the binary; a lockfile label with
        verified files; a Go module set that differs from the binary's build
        info; an artifact digest mismatch; a duplicate bom-ref; and an
        unresolved dependency ref. The vendored CycloneDX 1.5 schemas match
        their recorded hashes, the combined SBOM validates against them when
        the validator is installed, and the real lockfile's duplicate entries
        agree.
      priority: high
      references_constraints: [C-09, C-06]
    - id: AC-15
      description: >
        syft is installed by packaging/sbom/install-syft.sh at a pinned
        version, verified against a pinned tarball sha256, and asked for
        cyclonedx-json@1.5 in release.yml and package-smoke. Both workflows run
        packaging/sbom/merge-and-check.sh, which extracts the binary from each
        openwatch package, merges, checks, and validates every SBOM. The
        schema validator is installed with --require-hashes from
        packaging/sbom/requirements.txt, only in the release job and in
        package-smoke's package build job. package-smoke runs when the merge
        script or the frontend lockfile changes.
      priority: high
      references_constraints: [C-09]
